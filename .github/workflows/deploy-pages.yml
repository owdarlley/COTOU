name: Deploy Prototype to GitHub Pages

on:
  push:
    branches: [claude/parts-quotation-system-V7Nz1, main]
    paths:
      - 'public/prototype/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch prototype — injetar URL da API
        env:
          VPS_API_URL: ${{ secrets.VPS_API_URL }}
        run: |
          FILE=public/prototype/index.html

          # 1. Substitui PLATE_PROXY_URL pela URL da VPS
          sed -i "s|const PLATE_PROXY_URL = 'https://cotou.vercel.app';|const PLATE_PROXY_URL = '${VPS_API_URL}';|g" "$FILE"

          # 2. Converte fetch com caminhos relativos para absolutos
          sed -i "s|fetch('/auth/login'|fetch(PLATE_PROXY_URL + '/auth/login'|g" "$FILE"
          sed -i "s|fetch('/api/whatsapp/consultar-fornecedor'|fetch(PLATE_PROXY_URL + '/api/whatsapp/consultar-fornecedor'|g" "$FILE"
          sed -i "s|fetch('/api/whatsapp/instancia/criar'|fetch(PLATE_PROXY_URL + '/api/whatsapp/instancia/criar'|g" "$FILE"
          sed -i "s|fetch('/api/whatsapp/instancia/qrcode')|fetch(PLATE_PROXY_URL + '/api/whatsapp/instancia/qrcode')|g" "$FILE"
          sed -i "s|fetch('/api/whatsapp/instancia/status')|fetch(PLATE_PROXY_URL + '/api/whatsapp/instancia/status')|g" "$FILE"
          sed -i 's|fetch(`/api/whatsapp/enviar/|fetch(`${PLATE_PROXY_URL}/api/whatsapp/enviar/|g' "$FILE"

          echo "Patch aplicado. Verificando:"
          grep -n 'PLATE_PROXY_URL\|fetch(PLATE' "$FILE" | head -15

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/prototype

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
