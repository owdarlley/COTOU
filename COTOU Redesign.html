<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COTOU — Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<style>
:root {
  --sidebar:#0d1117;--sidebar-hover:#1c2333;--sidebar-active:#2563eb;
  --sidebar-brand:#fff;--sidebar-text:#8b98b0;--sidebar-border:rgba(255,255,255,.06);
  --bg:#f1f5f9;--card:#fff;--border:#e2e8f0;--text:#0f172a;--text-muted:#64748b;
  --th-bg:#1e293b;--th-color:#94a3b8;--topbar:#fff;--topbar-border:#e2e8f0;
  --accent:#2563eb;--accent-light:#eff6ff;
  --green:#16a34a;--green-light:#f0fdf4;
  --amber:#d97706;--amber-light:#fef3c7;
  --red:#dc2626;--red-light:#fef2f2;
  --purple:#7c3aed;--purple-light:#f5f3ff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;font-size:14px;background:var(--bg);color:var(--text);min-height:100vh}
input,button,textarea,select{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "accentColor": "#2563eb",
  "sidebarWidth": 220,
  "density": "normal"
}/*EDITMODE-END*/;

const THEMES = {
  dark:{sidebar:'#0d1117',sidebarHover:'#1c2333',sidebarActive:'#2563eb',sidebarBrand:'#fff',sidebarText:'#8b98b0',sidebarBorder:'rgba(255,255,255,.06)',bg:'#f1f5f9',thBg:'#1e293b',thColor:'#94a3b8',topbar:'#fff',topbarBorder:'#e2e8f0'},
  blue:{sidebar:'#1e3a6e',sidebarHover:'#254e96',sidebarActive:'#3b82f6',sidebarBrand:'#fff',sidebarText:'#93c5fd',sidebarBorder:'rgba(255,255,255,.08)',bg:'#f0f4ff',thBg:'#1e3a6e',thColor:'#93c5fd',topbar:'#fff',topbarBorder:'#dbeafe'},
  clean:{sidebar:'#f8fafc',sidebarHover:'#f1f5f9',sidebarActive:'#eff6ff',sidebarBrand:'#0f172a',sidebarText:'#475569',sidebarBorder:'#e2e8f0',bg:'#f8fafc',thBg:'#f1f5f9',thColor:'#64748b',topbar:'#fff',topbarBorder:'#e2e8f0'},
};

function applyTheme(name,accent){
  const t=THEMES[name]||THEMES.dark;
  const r=document.documentElement;
  const vars={'--sidebar':t.sidebar,'--sidebar-hover':t.sidebarHover,'--sidebar-active':accent||t.sidebarActive,
    '--sidebar-brand':t.sidebarBrand,'--sidebar-text':t.sidebarText,'--sidebar-border':t.sidebarBorder,
    '--bg':t.bg,'--th-bg':t.thBg,'--th-color':t.thColor,'--topbar':t.topbar,'--topbar-border':t.topbarBorder,
    '--accent':accent||'#2563eb'};
  Object.entries(vars).forEach(([k,v])=>r.style.setProperty(k,v));
  const hex=accent||'#2563eb';
  const rv=parseInt(hex.slice(1,3),16),gv=parseInt(hex.slice(3,5),16),bv=parseInt(hex.slice(5,7),16);
  r.style.setProperty('--accent-light',`rgba(${rv},${gv},${bv},.1)`);
}

// ── ATOMS ───────────────────────────────────────────
const STATUS={pendente:{l:'Aguardando',c:'badge-amber'},em_cotacao:{l:'Em Cotação',c:'badge-blue'},cotado:{l:'Cotado',c:'badge-green'},peca_chegou:{l:'Peça Chegou',c:'badge-purple'},cancelado:{l:'Cancelado',c:'badge-red'}};
function Badge({s}){const{l,c}=STATUS[s]||{l:s,c:'badge-gray'};return <span className={`badge ${c}`}>{l}</span>;}
function Plate({v}){return <span className="plate-tag">{v}</span>;}
function Av({name,size=32,bg}){
  const init=name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
  return <div className="av" style={{width:size,height:size,fontSize:size*.37,background:bg||'var(--accent)'}}>{init}</div>;
}
function Btn({onClick,variant='primary',sm,children,style}){
  const base={display:'inline-flex',alignItems:'center',gap:6,borderRadius:8,fontWeight:600,cursor:'pointer',border:'none',fontFamily:'inherit',transition:'all .15s',whiteSpace:'nowrap',padding:sm?'6px 14px':'9px 18px',fontSize:sm?12.5:13.5,...style};
  const variants={
    primary:{background:'var(--accent)',color:'#fff'},
    ghost:{background:'transparent',color:'var(--text-muted)',border:'1.5px solid var(--border)'},
    outline:{background:'transparent',color:'var(--accent)',border:'1.5px solid var(--accent)'},
    success:{background:'var(--green)',color:'#fff'},
    danger:{background:'transparent',color:'var(--red)',border:'1.5px solid var(--red)'},
  };
  return <button style={{...base,...variants[variant]}} onClick={onClick}>{children}</button>;
}

// ── SIDEBAR ─────────────────────────────────────────
const NAV_LINKS=[
  {id:'dashboard',icon:'bi-grid-1x2',label:'Dashboard'},
  {id:'cotacoes',icon:'bi-clipboard-list',label:'Cotações',badge:'4'},
  {id:'nova',icon:'bi-plus-circle',label:'Nova Cotação'},
  {id:'detalhe',icon:'bi-file-earmark-text',label:'Detalhe'},
  {id:'pecas',icon:'bi-box-seam',label:'Catálogo de Peças'},
  {id:'notifs',icon:'bi-bell',label:'Notificações',badge:'5',badgeOrange:true},
  {id:'usuarios',icon:'bi-people',label:'Usuários'},
];

function Sidebar({page,setPage,w}){
  return (
    <aside style={{width:w,position:'fixed',top:0,left:0,height:'100vh',background:'var(--sidebar)',display:'flex',flexDirection:'column',zIndex:200,overflowY:'auto',transition:'width .2s',flexShrink:0}}>
      <div style={{padding:'20px 16px 16px',borderBottom:'1px solid var(--sidebar-border)',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="7" fill="var(--accent)"/><path d="M7 14h6M15 10l4 4-4 4" stroke="white" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
          <span style={{fontSize:17,fontWeight:800,color:'var(--sidebar-brand)',letterSpacing:'-.3px'}}>COTOU</span>
        </div>
        <div style={{fontSize:11,color:'var(--sidebar-text)',marginTop:4,marginLeft:38,opacity:.6}}>Sistema de Cotações</div>
      </div>
      <nav style={{flex:1,padding:'10px',display:'flex',flexDirection:'column',gap:1}}>
        {NAV_LINKS.map(l=>(
          <button key={l.id} onClick={()=>setPage(l.id)} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',borderRadius:8,background:page===l.id?'var(--sidebar-active)':'transparent',color:page===l.id?'#fff':'var(--sidebar-text)',fontWeight:page===l.id?600:500,fontSize:13.5,border:'none',cursor:'pointer',width:'100%',textAlign:'left',transition:'background .12s,color .12s'}}>
            <i className={`bi ${l.icon}`} style={{fontSize:15,flexShrink:0}}></i>
            <span style={{flex:1}}>{l.label}</span>
            {l.badge&&<span style={{background:l.badgeOrange?'#ea580c':'var(--accent)',color:'#fff',fontSize:10,fontWeight:700,padding:'1px 7px',borderRadius:20}}>{l.badge}</span>}
          </button>
        ))}
      </nav>
      <div style={{borderTop:'1px solid var(--sidebar-border)',padding:'10px 10px 0'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 12px 18px'}}>
          <Av name="João Vendas" size={32}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:12.5,fontWeight:600,color:'#e2e8f0',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>João Vendas</div>
            <div style={{fontSize:11,color:'var(--sidebar-text)'}}>Setor de Vendas</div>
          </div>
          <i className="bi bi-box-arrow-right" style={{color:'var(--sidebar-text)',fontSize:15,cursor:'pointer'}}></i>
        </div>
      </div>
    </aside>
  );
}

// ── TOPBAR ───────────────────────────────────────────
function Topbar({title,subtitle,actions}){
  return (
    <div style={{background:'var(--topbar)',borderBottom:'1px solid var(--topbar-border)',padding:'0 28px',height:64,display:'flex',alignItems:'center',justifyContent:'space-between',position:'sticky',top:0,zIndex:100,gap:16}}>
      <div>
        <div style={{fontSize:17,fontWeight:800,color:'var(--text)',letterSpacing:'-.3px'}}>{title}</div>
        {subtitle&&<div style={{fontSize:12,color:'var(--text-muted)',marginTop:1}}>{subtitle}</div>}
      </div>
      <div style={{display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
        {actions}
        <div style={{width:34,height:34,borderRadius:'50%',border:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text-muted)',position:'relative',fontSize:15,background:'var(--card)',cursor:'pointer'}}>
          <i className="bi bi-bell"></i>
          <span style={{position:'absolute',top:5,right:5,width:7,height:7,background:'var(--red)',borderRadius:'50%',border:'2px solid var(--topbar)'}}></span>
        </div>
        <Av name="João Vendas" size={34}/>
      </div>
    </div>
  );
}

// ── PAGE: DASHBOARD ──────────────────────────────────
function PageDashboard({setPage}){
  const kpis=[
    {label:'Aguardando',value:7,icon:'bi-clock',ck:'kpi-amber',ik:'icon-amber',trend:'+2 hoje',up:true},
    {label:'Em Cotação',value:3,icon:'bi-search',ck:'kpi-blue',ik:'icon-blue',trend:'em andamento',up:null},
    {label:'Cotado',value:12,icon:'bi-check-circle',ck:'kpi-green',ik:'icon-green',trend:'+4 esta semana',up:true},
    {label:'Peça Chegou',value:5,icon:'bi-box-arrow-in-down',ck:'kpi-purple',ik:'icon-purple',trend:'aguardando cliente',up:null},
  ];
  const recents=[
    {num:'COT-2025-0012',cliente:'Marcos Silva',veiculo:'HB20 2022',placa:'ABC1D23',status:'pendente',data:'02/05'},
    {num:'COT-2025-0011',cliente:'Ana Costa',veiculo:'Gol 2019',placa:'XYZ9876',status:'em_cotacao',data:'01/05'},
    {num:'COT-2025-0010',cliente:'Roberto P.',veiculo:'Uno 2018',placa:'DEF5G67',status:'cotado',data:'30/04'},
    {num:'COT-2025-0009',cliente:'Luiza F.',veiculo:'Celta 2015',placa:'GHI3456',status:'peca_chegou',data:'29/04'},
  ];
  const notifs=[
    {icon:'bi-check-circle-fill',ik:'icon-blue',title:'Cotação #0011 respondida',desc:'Maria Compras preencheu os valores',time:'15 min'},
    {icon:'bi-box-arrow-in-down',ik:'icon-purple',title:'Peça chegou — #0008',desc:'Filtro de ar disponível para retirada',time:'1h'},
    {icon:'bi-plus-circle',ik:'icon-amber',title:'Nova cotação #0012',desc:'João Vendas abriu nova solicitação',time:'2h'},
  ];
  return (
    <div className="page-content">
      <Topbar title="Dashboard" subtitle="Bem-vindo de volta, João!" actions={<Btn onClick={()=>setPage('nova')}><i className="bi bi-plus-lg"></i> Nova Cotação</Btn>}/>
      <div className="page-body">
        <div className="kpi-grid">
          {kpis.map(k=>(
            <button key={k.label} className={`kpi-card ${k.ck}`} onClick={()=>setPage('cotacoes')}>
              <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:10}}>
                <div className={`kpi-icon ${k.ik}`}><i className={`bi ${k.icon}`}></i></div>
                <div style={{fontSize:32,fontWeight:800,color:'var(--text)',lineHeight:1}}>{k.value}</div>
              </div>
              <div style={{fontSize:12,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:5}}>{k.label}</div>
              <div style={{fontSize:12,color:k.up?'var(--green)':'var(--text-muted)',display:'flex',alignItems:'center',gap:2}}>
                {k.up&&<i className="bi bi-arrow-up-short"></i>}{k.trend}
              </div>
            </button>
          ))}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1.4fr 1fr',gap:16}}>
          <div className="section-card">
            <div className="section-head">
              <span className="section-title"><i className="bi bi-clock-history"></i> Cotações Recentes</span>
              <button className="btn-link" onClick={()=>setPage('cotacoes')}>Ver todas →</button>
            </div>
            <table className="data-table">
              <thead><tr><th>Número</th><th>Cliente</th><th>Veículo</th><th>Status</th><th>Data</th></tr></thead>
              <tbody>
                {recents.map(r=>(
                  <tr key={r.num} onClick={()=>setPage('detalhe')} style={{cursor:'pointer'}}>
                    <td><span className="qid">#{r.num}</span></td>
                    <td><div style={{display:'flex',alignItems:'center',gap:8}}><Av name={r.cliente} size={26}/><span>{r.cliente}</span></div></td>
                    <td><div style={{fontSize:13}}>{r.veiculo}</div><Plate v={r.placa}/></td>
                    <td><Badge s={r.status}/></td>
                    <td style={{color:'var(--text-muted)',fontSize:13}}>{r.data}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="section-card">
            <div className="section-head">
              <span className="section-title"><i className="bi bi-bell"></i> Notificações</span>
              <button className="btn-link" onClick={()=>setPage('notifs')}>Ver todas →</button>
            </div>
            {notifs.map((n,i)=>(
              <div key={i} style={{display:'flex',alignItems:'flex-start',gap:12,padding:'12px 16px',borderBottom:i<notifs.length-1?'1px solid var(--border)':'none'}}>
                <div className={`kpi-icon ${n.ik}`} style={{width:36,height:36,borderRadius:10,fontSize:15,flexShrink:0}}><i className={`bi ${n.icon}`}></i></div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:600,fontSize:13}}>{n.title}</div>
                  <div style={{fontSize:12,color:'var(--text-muted)',marginTop:2}}>{n.desc}</div>
                </div>
                <div style={{fontSize:11,color:'var(--text-muted)',flexShrink:0}}>{n.time}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── PAGE: COTAÇÕES ───────────────────────────────────
function PageCotacoes({setPage}){
  const [filter,setFilter]=useState('todas');
  const rows=[
    {num:'COT-2025-0012',cliente:'Marcos Silva',veiculo:'HB20 2022',placa:'ABC1D23',pecas:2,status:'pendente',vendedor:'João V.',data:'02/05/2025'},
    {num:'COT-2025-0011',cliente:'Ana Costa',veiculo:'Gol 2019',placa:'XYZ9876',pecas:1,status:'em_cotacao',vendedor:'João V.',data:'01/05/2025'},
    {num:'COT-2025-0010',cliente:'Roberto P.',veiculo:'Uno 2018',placa:'DEF5G67',pecas:3,status:'cotado',vendedor:'Maria V.',data:'30/04/2025'},
    {num:'COT-2025-0009',cliente:'Luiza F.',veiculo:'Celta 2015',placa:'GHI3456',pecas:1,status:'peca_chegou',vendedor:'João V.',data:'29/04/2025'},
    {num:'COT-2025-0008',cliente:'Carlos F.',veiculo:'Palio 2016',placa:'JKL7890',pecas:2,status:'cancelado',vendedor:'Maria V.',data:'28/04/2025'},
  ];
  const tabs=[{id:'todas',label:'Todas'},{id:'pendente',label:'Aguardando'},{id:'em_cotacao',label:'Em Cotação'},{id:'cotado',label:'Cotado'},{id:'peca_chegou',label:'Peça Chegou'}];
  const filtered=filter==='todas'?rows:rows.filter(r=>r.status===filter);
  return (
    <div className="page-content">
      <Topbar title="Cotações" subtitle="Gerencie todas as solicitações" actions={<Btn onClick={()=>setPage('nova')}><i className="bi bi-plus-lg"></i> Nova Cotação</Btn>}/>
      <div className="page-body">
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14,flexWrap:'wrap'}}>
          <div style={{display:'flex',background:'var(--card)',border:'1px solid var(--border)',borderRadius:9,padding:4,gap:2,flexWrap:'wrap'}}>
            {tabs.map(t=>(
              <button key={t.id} onClick={()=>setFilter(t.id)} style={{padding:'6px 16px',borderRadius:6,fontSize:13,fontWeight:500,color:filter===t.id?'#fff':'var(--text-muted)',background:filter===t.id?'var(--text)':'transparent',border:'none',cursor:'pointer',transition:'all .12s'}}>{t.label}</button>
            ))}
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8,background:'var(--card)',border:'1px solid var(--border)',borderRadius:8,padding:'0 12px',height:38,minWidth:240}}>
            <i className="bi bi-search" style={{color:'var(--text-muted)',fontSize:14}}></i>
            <input style={{border:'none',outline:'none',fontSize:13.5,color:'var(--text)',background:'transparent',width:'100%'}} placeholder="Buscar cotações..."/>
          </div>
        </div>
        <div className="table-wrap">
          <table className="data-table">
            <thead><tr><th>Data</th><th>Número</th><th>Cliente</th><th>Veículo</th><th>Peças</th><th>Status</th><th>Vendedor</th><th></th></tr></thead>
            <tbody>
              {filtered.map(r=>(
                <tr key={r.num} onClick={()=>setPage('detalhe')} style={{cursor:'pointer'}}>
                  <td style={{color:'var(--text-muted)',fontSize:13}}>{r.data}</td>
                  <td><span className="qid">#{r.num}</span></td>
                  <td><div style={{display:'flex',alignItems:'center',gap:8}}><Av name={r.cliente} size={26}/><span style={{fontWeight:600}}>{r.cliente}</span></div></td>
                  <td><div style={{fontSize:13,fontWeight:500}}>{r.veiculo}</div><Plate v={r.placa}/></td>
                  <td style={{color:'var(--text-muted)',fontSize:13}}>{r.pecas} {r.pecas===1?'peça':'peças'}</td>
                  <td><Badge s={r.status}/></td>
                  <td style={{color:'var(--text-muted)',fontSize:12.5}}>{r.vendedor}</td>
                  <td><button className="btn-icon" onClick={e=>{e.stopPropagation();setPage('detalhe')}}><i className="bi bi-eye"></i></button></td>
                </tr>
              ))}
            </tbody>
          </table>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 16px',borderTop:'1px solid var(--border)'}}>
            <span style={{color:'var(--text-muted)',fontSize:13}}>Mostrando {filtered.length} de 27 cotações</span>
            <div style={{display:'flex',gap:4}}>
              {[1,2,3,4].map(p=><button key={p} className={`pag-btn ${p===1?'active':''}`}>{p}</button>)}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── PAGE: NOVA COTAÇÃO (wizard) ──────────────────────
function PageNova({setPage}){
  const [step,setStep]=useState(0);
  const [items,setItems]=useState([{cod:'',nome:'Filtro de Ar',qtd:1,mo:0},{cod:'',nome:'',qtd:1,mo:0}]);
  const steps=['Cliente','Veículo','Peças','Revisão'];
  return (
    <div className="page-content">
      <Topbar title="Nova Cotação" subtitle="Preencha os dados para enviar ao setor de compras" actions={<Btn variant="ghost" onClick={()=>setPage('cotacoes')}>← Cancelar</Btn>}/>
      <div className="page-body">
        {/* Wizard bar */}
        <div style={{display:'flex',alignItems:'center',background:'var(--card)',border:'1px solid var(--border)',borderRadius:12,padding:'16px 20px',marginBottom:20,gap:0}}>
          {steps.map((s,i)=>(
            <React.Fragment key={s}>
              <button onClick={()=>i<=step&&setStep(i)} style={{display:'flex',alignItems:'center',gap:10,fontSize:13,fontWeight:600,color:i===step?'var(--accent)':i<step?'var(--green)':'var(--text-muted)',background:'none',border:'none',cursor:'pointer',padding:0}}>
                <div style={{width:28,height:28,borderRadius:'50%',border:'2px solid currentColor',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:800,flexShrink:0,background:i===step?'var(--accent)':i<step?'var(--green)':'transparent',color:i<=step?'#fff':'currentColor',borderColor:i===step?'var(--accent)':i<step?'var(--green)':'var(--text-muted)'}}>
                  {i<step?<i className="bi bi-check"></i>:i+1}
                </div>
                <span>{s}</span>
              </button>
              {i<steps.length-1&&<div style={{flex:1,height:2,background:i<step?'var(--green)':'var(--border)',margin:'0 12px'}}></div>}
            </React.Fragment>
          ))}
        </div>

        {step===0&&(
          <div className="form-section">
            <div className="form-section-header"><i className="bi bi-person-circle"></i> Dados do Cliente</div>
            <div className="form-section-body">
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
                <div><label className="form-label">Nome do Cliente <span style={{color:'var(--red)'}}>*</span></label><input className="form-control" placeholder="Ex: João da Silva"/></div>
                <div><label className="form-label">Telefone / WhatsApp <span style={{color:'var(--red)'}}>*</span></label><input className="form-control" placeholder="(11) 99999-9999"/></div>
              </div>
            </div>
          </div>
        )}

        {step===1&&(
          <div className="form-section">
            <div className="form-section-header"><i className="bi bi-car-front"></i> Dados do Veículo</div>
            <div className="form-section-body">
              <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14,marginBottom:14}}>

                  <td><div style={{display:'flex',gap:6}}><button className="btn-icon" title="Editar"><i className="bi bi-pencil"></i></button><button className="btn-icon red" title="Remover"><i className="bi bi-trash"></i></button></div></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── PAGE: LOGIN ──────────────────────────────────────
function PageLogin({setPage}){
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--bg)'}}>
      <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:16,padding:'40px 36px',width:380,boxShadow:'0 20px 48px rgba(0,0,0,.08)'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:24}}>
          <svg width="36" height="36" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="7" fill="var(--accent)"/><path d="M7 14h6M15 10l4 4-4 4" stroke="white" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
          <span style={{fontSize:20,fontWeight:800,letterSpacing:'-.3px'}}>COTOU</span>
        </div>
        <h2 style={{fontSize:22,fontWeight:800,marginBottom:4,letterSpacing:'-.3px'}}>Bem-vindo de volta</h2>
        <p style={{fontSize:13,color:'var(--text-muted)',marginBottom:24}}>Acesse o sistema de cotações</p>
        <div style={{marginBottom:14}}>
          <label className="form-label">E-mail</label>
          <input className="form-control" type="email" placeholder="seu@email.com.br"/>
        </div>
        <div style={{marginBottom:24}}>
          <label className="form-label">Senha</label>
          <input className="form-control" type="password" placeholder="••••••••"/>
        </div>
        <Btn style={{width:'100%',justifyContent:'center'}} onClick={()=>setPage('dashboard')}>Entrar no Sistema</Btn>
      </div>
    </div>
  );
}

// ── APP ──────────────────────────────────────────────
function App(){
  const [page,setPage]=useState('dashboard');
  const [tweaks,setTweakState]=useState(TWEAK_DEFAULTS);

  const setTweak=(key,val)=>{
    setTweakState(prev=>{
      const next=typeof key==='object'?{...prev,...key}:{...prev,[key]:val};
      window.parent.postMessage({type:'__edit_mode_set_keys',edits:next},'*');
      return next;
    });
  };

  useEffect(()=>{ applyTheme(tweaks.theme,tweaks.accentColor); },[tweaks.theme,tweaks.accentColor]);

  const sw=tweaks.sidebarWidth||220;

  return (
    <>
      <TweaksPanel defaults={TWEAK_DEFAULTS} onUpdate={setTweak}>
        <TweakSection title="Aparência">
          <TweakRadio id="theme" label="Tema Sidebar" value={tweaks.theme} onChange={v=>setTweak('theme',v)}
            options={[{value:'dark',label:'Dark'},{value:'blue',label:'Azul'},{value:'clean',label:'Clean'}]}/>
          <TweakColor id="accentColor" label="Cor Principal" value={tweaks.accentColor} onChange={v=>setTweak('accentColor',v)}/>
        </TweakSection>
        <TweakSection title="Layout">
          <TweakSlider id="sidebarWidth" label="Largura Sidebar" value={sw} min={180} max={280} step={10} onChange={v=>setTweak('sidebarWidth',v)}/>
        </TweakSection>
        <TweakSection title="Navegar para">
          {['dashboard','cotacoes','nova','detalhe','pecas','notifs','usuarios','login'].map(p=>(
            <TweakButton key={p} label={p.charAt(0).toUpperCase()+p.slice(1)} onClick={()=>setPage(p)}/>
          ))}
        </TweakSection>
      </TweaksPanel>

      {page==='login'
        ? <PageLogin setPage={setPage}/>
        : (
          <div style={{display:'flex',minHeight:'100vh',background:'var(--bg)'}}>
            <Sidebar page={page} setPage={setPage} w={sw}/>
            <div style={{marginLeft:sw,flex:1,display:'flex',flexDirection:'column',minHeight:'100vh',minWidth:0,transition:'margin-left .2s'}}>
              {page==='dashboard'&&<PageDashboard setPage={setPage}/>}
              {page==='cotacoes' &&<PageCotacoes setPage={setPage}/>}
              {page==='nova'     &&<PageNova setPage={setPage}/>}
              {page==='detalhe'  &&<PageDetalhe setPage={setPage}/>}
              {page==='pecas'    &&<PagePecas/>}
              {page==='notifs'   &&<PageNotifs/>}
              {page==='usuarios' &&<PageUsuarios/>}
            </div>
          </div>
        )
      }
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
