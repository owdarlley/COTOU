function RespondModal({ quotation, onClose }) {
  const { dispatch } = useStore();
  const [items, setItems] = useState(quotation.items.map(it => ({
    id: it.id,
    unit_price: '',
    labor_cost_compras: '',
    delivery_days: '',
    supplier_name: '',
    notes: '',
  })));
  const [notesCompras, setNotesCompras] = useState('');

  function update(idx, field, v) {
    setItems(prev => prev.map((it, i) => i === idx ? { ...it, [field]: v } : it));
  }
  const allFilled = items.every(it => Number(it.unit_price) > 0 && Number(it.delivery_days) > 0);

  function submit() {
    if (!allFilled) return;
    dispatch({
      type: 'respond_quotation',
      payload: { id: quotation.id, items, notes_compras: notesCompras }
    });
    onClose();
  }

  // Live total
  const liveTotal = items.reduce((s, it, i) => {
    const q = quotation.items[i].quantity;
    const u = Number(it.unit_price) || 0;
    const l = Number(it.labor_cost_compras) || 0;
    return s + (u * q) + l;
  }, 0);

  return (
    <Modal
      open={true} onClose={onClose}
      title={`Responder cotação ${quotation.quote_number}`}
      icon="bi-currency-exchange"
      size="lg"
      footer={
        <>
          <Button variant="ghost" onClick={onClose}>Cancelar</Button>
          <Button variant="primary" icon="bi-send" onClick={submit} disabled={!allFilled}>

        </>

    >
      <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
        {quotation.items.map((it, i) => (
          <div key={it.id} className="card card-pad" style={{ background: 'var(--surface-2)', border: '1px solid var(--border)' }}>
            <div className="row between" style={{ marginBottom: 12 }}>
              <div>
                <div className="bold">{it.part_name}</div>
                <div className="tiny faint mono">{it.part_code || '—'} · qtd {it.quantity}</div>
              </div>
              <span className="mono small bold">
                {fmt.brl(((Number(items[i].unit_price) || 0) * it.quantity) + (Number(items[i].labor_cost_compras) || 0))}
              </span>
            </div>
            <div className="grid-4">
              <Field label="Preço unit. *">
                <div className="input-group">
                  <span className="input-icon mono">R$</span>
                  <input className="input mono" type="number" step="0.01" placeholder="0,00" min="0.01"
                    value={items[i].unit_price} onChange={e => update(i, 'unit_price', e.target.value)}
                    style={items[i].unit_price !== '' && Number(items[i].unit_price) <= 0 ? { borderColor: '#dc2626' } : {}} />
                </div>
              </Field>
              <Field label="Mão de obra">
                <div className="input-group">
                  <span className="input-icon mono">R$</span>
                  <input className="input mono" type="number" step="0.01" placeholder="0,00"
                    value={items[i].labor_cost_compras} onChange={e => update(i, 'labor_cost_compras', e.target.value)} />
                </div>
              </Field>
              <Field label="Prazo (dias) *">
                <input className="input mono" type="number" placeholder="3" min="1"
                  value={items[i].delivery_days} onChange={e => update(i, 'delivery_days', e.target.value)}
                  style={items[i].delivery_days !== '' && Number(items[i].delivery_days) <= 0 ? { borderColor: '#dc2626' } : {}} />
              </Field>
              <Field label="Fornecedor">
                <input className="input" placeholder="Nome do fornecedor"
                  value={items[i].supplier_name} onChange={e => update(i, 'supplier_name', e.target.value)} />
              </Field>
            </div>
            <div style={{ marginTop: 12 }}>
              <Field label="Observação do item">
                <input className="input" placeholder="Notas opcionais sobre disponibilidade, marca…"
                  value={items[i].notes} onChange={e => update(i, 'notes', e.target.value)} />
              </Field>
            </div>
          </div>
        ))}

        <Field label="Observação geral de Compras">
          <textarea className="textarea" placeholder="Notas que vão para a Cotação inteira"
            value={notesCompras} onChange={e => setNotesCompras(e.target.value)} />
        </Field>

        <div className="row between" style={{ padding: 14, background: 'var(--brand-soft)', borderRadius: 'var(--r-md)' }}>
          <div>
            <div className="tiny" style={{ textTransform: 'uppercase', letterSpacing: '0.1em', color: 'var(--brand)' }}>Total da cotação</div>
            <div className="mono bold" style={{ fontSize: 24, color: 'var(--brand)' }}>{fmt.brl(liveTotal)}</div>
          </div>
          {!allFilled && <span className="tiny" style={{ color: 'var(--brand)' }}>Preencha preço unit. e prazo de todos os itens</span>}
        </div>

  );

function WhatsAppConnectModal({ userId, onClose }) {
  const { dispatch } = useStore();
  const [phase, setPhase] = useState('loading'); // loading | qr | connected
  const [qrSrc, setQrSrc] = useState(null);
  const timerRef = React.useRef(null);
  const pollRef = React.useRef(null);

  React.useEffect(() => {
    let cancelled = false;
    const instanceName = `cotou-user-${userId}`;

    async function start() {
      try {
        const res = await fetch(`${PLATE_PROXY_URL}/api/whatsapp/connect`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ instanceName }),
        });
        const json = await res.json();
        if (cancelled) return;

        if (json.demo || !json.ok) {
          // Demo mode: show placeholder QR and auto-connect after 5s
          setPhase('qr');
          timerRef.current = setTimeout(() => {
            if (!cancelled) {
              dispatch({ type: 'whatsapp_connect', userId });
              setPhase('connected');
            }
          }, 5000);
          return;
        }

        if (json.qrcode) {
          setQrSrc(`data:image/png;base64,${json.qrcode}`);
          setPhase('qr');
          // Poll for connection
          let attempts = 0;
          pollRef.current = setInterval(async () => {
            if (cancelled) return;
            attempts++;
            if (attempts > 40) { clearInterval(pollRef.current); return; }
            try {
              const sr = await fetch(`${PLATE_PROXY_URL}/api/whatsapp/status/${instanceName}`);
              const s = await sr.json();
              if (s.connected) {
                clearInterval(pollRef.current);
                if (!cancelled) {
                  dispatch({ type: 'whatsapp_connect', userId });
                  setPhase('connected');
                }
              }
            } catch (_) {}
          }, 3000);
        }
      } catch (_) {
        // Network error → demo mode
        if (!cancelled) {
          setPhase('qr');
          timerRef.current = setTimeout(() => {
            if (!cancelled) {
              dispatch({ type: 'whatsapp_connect', userId });
              setPhase('connected');
            }
          }, 5000);
        }
      }
    }

    start();
    return () => {
      cancelled = true;
      clearTimeout(timerRef.current);
      clearInterval(pollRef.current);
    };
  }, [userId]);

  React.useEffect(() => {
    if (phase === 'connected') {
      const t = setTimeout(onClose, 1500);
      return () => clearTimeout(t);
    }
  }, [phase]);

  return (
    <Modal open={true} onClose={onClose} title="Conectar WhatsApp" icon="bi-whatsapp"
      footer={<Button variant="ghost" onClick={onClose}>Fechar</Button>}
    >
      <div className="col" style={{ alignItems: 'center', gap: 20, padding: '8px 0' }}>
        {phase === 'loading' && (
          <>
            <i className="bi bi-arrow-clockwise" style={{ fontSize: 32, color: 'var(--brand)', animation: 'spin 1s linear infinite' }}></i>
            <div className="muted">Gerando QR Code…</div>
          </>
        )}
        {phase === 'qr' && (
          <>
            {qrSrc
              ? <img src={qrSrc} alt="QR Code WhatsApp" style={{ width: 220, height: 220, borderRadius: 12, border: '1px solid var(--border)' }} />
              : (
                <div style={{ width: 220, height: 220, borderRadius: 12, border: '2px dashed var(--border)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 12, background: 'var(--surface-2)' }}>
                  <i className="bi bi-qr-code" style={{ fontSize: 64, color: 'var(--text-faint)' }}></i>
                  <div className="tiny muted" style={{ textAlign: 'center', lineHeight: 1.4 }}>QR Code (modo demo)<br/>Conectando em 5s…</div>
                </div>
              )
            }
            <div className="muted tiny">Abra o WhatsApp → Dispositivos conectados → Conectar dispositivo</div>
          </>
        )}
        {phase === 'connected' && (
          <>
            <div style={{ width: 64, height: 64, borderRadius: 99, background: '#dcfce7', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <i className="bi bi-check-lg" style={{ fontSize: 32, color: '#16a34a' }}></i>
            </div>
            <div style={{ fontWeight: 600, color: '#16a34a' }}>WhatsApp conectado!</div>
          </>
        )}
      </div>
    </Modal>
  );
}

/* =========================================================
   New quotation
   ========================================================= */
function NewQuotation() {
  const { state, dispatch } = useStore();
  const [step, setStep] = useState(1);
  // customer
  const [customerName, setCustomerName] = useState('');
  const [customerPhone, setCustomerPhone] = useState('');
  const [step1Touched, setStep1Touched] = useState(false);
  // vehicle
  const [plate, setPlate] = useState('');
  const [plateLoading, setPlateLoading] = useState(false);
  const [plateFound, setPlateFound] = useState(false);
  const [plateWarning, setPlateWarning] = useState('');
  const [vehicle, setVehicle] = useState({ make: '', model: '', year_model: '', year_manuf: '', color: '', fuel: '' });
  // items
  const [items, setItems] = useState([]);
  const [partQuery, setPartQuery] = useState('');
  // notes + photo
  const [notesVendas, setNotesVendas] = useState('');
  const [photo, setPhoto] = useState(null);
  const fileRef = useRef(null);

  async function lookupPlate() {
    const key = plate.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
    if (!key) return;
    setPlateLoading(true);
    setPlateWarning('');
    try {
      const res = await fetch(`${PLATE_PROXY_URL}/api/placa/${key}`);
      const json = await res.json();
      if (json.ok && json.data) {
        setVehicle({
          make:       json.data.make || '',
          model:      json.data.model || '',
          year_model: String(json.data.year_model || ''),
          year_manuf: String(json.data.year_manuf || ''),
          color:      json.data.color || '',
          fuel:       json.data.fuel || '',
        });
        setPlateFound(true);
        dispatch({ type: 'toast', tone: 'success', message: 'Dados do veículo carregados' });
      } else {
        setPlateFound(false);
        dispatch({ type: 'toast', tone: 'error', message: json.message || 'Placa não encontrada — preencha manualmente' });
      }
    } catch (_err) {
      setPlateFound(false);
      dispatch({ type: 'toast', tone: 'error', message: 'Erro ao consultar placa. Preencha manualmente.' });
    } finally {
      const existing = state.quotations.find(
        q => q.vehicle.plate.toUpperCase() === key && ['pendente', 'em_cotacao'].includes(q.status)
      );
      if (existing) {
        setPlateWarning(`⚠️ Este veículo já possui a cotação ${existing.quote_number} em aberto (${STATUS_META[existing.status].label}).`);
      }
      setPlateLoading(false);
    }
  }

  function addItem(part) {
    setItems(prev => [...prev, { part_name: part.name, part_code: part.code, quantity: 1 }]);
    setPartQuery('');
  }

  function addManualItem() {
    setItems(prev => [...prev, { part_name: '', part_code: '', quantity: 1 }]);
  }
  function removeItem(idx) {
    setItems(prev => prev.filter((_, i) => i !== idx));
  }
  function updateItem(idx, field, v) {
    setItems(prev => prev.map((it, i) => i === idx ? { ...it, [field]: v } : it));
  }

  function onFile(e) {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => setPhoto(reader.result);
    reader.readAsDataURL(f);
  }

  const phoneDigits = customerPhone.replace(/\D/g, '');
  const canStep1 = customerName.trim() && (phoneDigits.length === 10 || phoneDigits.length === 11);
  const canStep2 = plate && vehicle.make && vehicle.model;
  const validItems = items.filter(i => i.part_name && i.quantity > 0);
  const canSubmit = canStep1 && canStep2 && validItems.length > 0;

  function submit() {
    dispatch({
      type: 'create_quotation',
      payload: {
        customer_name: customerName,
        customer_phone: customerPhone.replace(/\D/g, ''),
        vehicle: {
          plate: plate.toUpperCase(),
          make: vehicle.make, model: vehicle.model,
          year_model: Number(vehicle.year_model) || null,
          year_manuf: Number(vehicle.year_manuf) || null,
          color: vehicle.color, fuel: vehicle.fuel,
        },
        items: validItems,
        notes_vendas: notesVendas,
        photo_path: photo,
      },
    });
  }

  return (
    <div className="page" style={{ maxWidth: 980 }}>
      <div className="page-head">
        <div>
          <button className="btn btn-ghost btn-sm" onClick={() => dispatch({ type: 'navigate', name: 'quotations' })} style={{ marginBottom: 8 }}>
            <i className="bi bi-arrow-left"></i> Voltar
          </button>
          <h2 className="page-title">Nova cotação</h2>
          <p className="page-sub">Cadastre o cliente, veículo e peças. O setor de compras será notificado.</p>
        </div>
      </div>

      {/* Stepper */}
      <div className="card card-pad" style={{ marginBottom: 16 }}>
        <div className="timeline">
          {[
            { k: 1, label: 'Cliente', icon: 'bi-person' },
            { k: 2, label: 'Veículo', icon: 'bi-car-front' },
            { k: 3, label: 'Peças', icon: 'bi-gear' },
            { k: 4, label: 'Observações', icon: 'bi-chat-text' },
          ].map(s => (
            <div key={s.k} className={`timeline-step ${step > s.k ? 'done' : step === s.k ? 'current' : ''}`}>
              <span className="timeline-dot"><i className={`bi ${step > s.k ? 'bi-check2' : s.icon}`}></i></span>
              <div className="timeline-label">{s.label}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Step 1: customer */}
      {step === 1 && (
        <div className="card card-pad" style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <h3 style={{ margin: 0 }}>Dados do cliente</h3>

            </Field>
            <Field label="WhatsApp *" hint="Com DDD, sem espaços" error={step1Touched && !(phoneDigits.length === 10 || phoneDigits.length === 11) ? 'Informe DDD + número (10 ou 11 dígitos)' : ''}>
              <div className="input-group">
                <i className="bi bi-whatsapp input-icon" style={{ color: '#16a34a' }}></i>
                <input className="input mono" value={customerPhone} onChange={e => setCustomerPhone(e.target.value)} placeholder="11987654321" style={step1Touched && !(phoneDigits.length === 10 || phoneDigits.length === 11) ? { borderColor: '#dc2626' } : {}} />
              </div>
            </Field>
          </div>
          <div className="row" style={{ justifyContent: 'flex-end' }}>

        <div className="card card-pad" style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <h3 style={{ margin: 0 }}>Veículo</h3>

              <div className="input-group" style={{ flex: 1 }}>
                <i className="bi bi-tag input-icon"></i>

          </div>
          <div className="row between">

            <h3 style={{ margin: 0 }}>Peças solicitadas</h3>

          <div className="card" style={{ background: 'var(--surface-2)' }}>

                <thead>
                  <tr>
                    <th>Peça</th>
                    <th>Código</th>
                    <th style={{ width: 90 }}>Quantidade</th>
                    <th style={{ width: 44 }}></th>
                  </tr>
                </thead>
                <tbody>
                  {items.map((it, i) => (
                    <tr key={i}>
                      <td>
                        <input className="input" value={it.part_name} onChange={e => updateItem(i, 'part_name', e.target.value)} placeholder="Nome da peça" />
                      </td>
                      <td>
                        <input className="input mono small" value={it.part_code || ''} onChange={e => updateItem(i, 'part_code', e.target.value)} placeholder="—" style={{ width: 110 }} />

                      <td>
                        <input className="input mono" type="number" min="1" value={it.quantity} onChange={e => updateItem(i, 'quantity', Number(e.target.value))} />

                  ))}
                </tbody>
                <tfoot>
                  <tr>
                    <td colSpan={4} style={{ paddingTop: 6 }}>
                      <button className="btn btn-ghost btn-sm" type="button" onClick={addManualItem} style={{ gap: 6 }}>
                        <i className="bi bi-plus-lg"></i> Adicionar peça

                    </td>
                  </tr>
                </tfoot>
              </table>
            )}
          </div>

          <div className="row between">
            <Button variant="ghost" icon="bi-arrow-left" onClick={() => setStep(2)}>Voltar</Button>
            <Button variant="primary" iconRight="bi-arrow-right" disabled={validItems.length === 0} onClick={() => setStep(4)}>Próximo</Button>
          </div>
        </div>
      )}

                <div>
                  <div className="tiny faint">Cliente</div>

                  <div className="mono tiny faint">{fmt.phone(customerPhone)}</div>
                </div>

                  <div className="tiny faint">Veículo</div>

                  <div className="row" style={{ gap: 6, marginTop: 4 }}>

                    <span className="tiny faint mono">{vehicle.year_manuf}/{vehicle.year_model}</span>

<script type="text/babel">
// COTOU — Misc screens: Dashboard, Catalog, Notifications, Admin

const { useState, useMemo } = React;

/* =========================================================
   Dashboard
   ========================================================= */
function Dashboard() {
  const { state, dispatch, currentUser, unreadCount } = useStore();

  // Filter cotações by role
  const visible = currentUser.role === 'vendas'
    ? state.quotations.filter(q => q.created_by_user_id === currentUser.id)
    : state.quotations;

  const counts = {
    pendente: visible.filter(q => q.status === 'pendente').length,
    em_cotacao: visible.filter(q => q.status === 'em_cotacao').length,
    cotado: visible.filter(q => q.status === 'cotado').length,
    peca_chegou: visible.filter(q => q.status === 'peca_chegou').length,
    cancelado: visible.filter(q => q.status === 'cancelado').length,
  };
  const total = visible.length;
  const active = counts.pendente + counts.em_cotacao + counts.cotado;
  const revenue = visible.reduce((s, q) => s + calcTotals(q.items).grandTotal, 0);
  const approvedCount = visible.filter(q => q.customer_approved === 1).length;
  const respondedCount = visible.filter(q => ['cotado', 'peca_chegou'].includes(q.status)).length;
  const approveRate = respondedCount ? Math.round((approvedCount / respondedCount) * 100) : 0;

  // Synthetic 14-day chart data (deterministic based on count)
  const chartData = useMemo(() => {
    const days = [];
    const today = new Date();
    for (let i = 13; i >= 0; i--) {
      const d = new Date(today); d.setDate(d.getDate() - i);
      const label = d.toLocaleDateString('pt-BR', { day: '2-digit' });
      // pseudo-random but deterministic
      const seed = (d.getDate() * 7 + d.getMonth() * 13) % 19;
      const value = 2 + (seed % 11);
      const won = Math.max(0, value - 2 + (seed % 3));
      days.push({ label, value, won });
    }
    return days;
  }, []);
  const maxBar = Math.max(...chartData.map(d => d.value));

  // Donut for status mix
  const statusMix = [
    { k: 'pendente',    label: 'Pendentes',   value: counts.pendente,    color: 'var(--st-pendente)' },
    { k: 'em_cotacao',  label: 'Em cotação',  value: counts.em_cotacao,  color: 'var(--st-em-cotacao)' },
    { k: 'cotado',      label: 'Cotadas',     value: counts.cotado,      color: 'var(--st-cotado)' },
    { k: 'peca_chegou', label: 'Peça chegou', value: counts.peca_chegou, color: 'var(--st-peca)' },
  ].filter(s => s.value > 0);
  const mixTotal = statusMix.reduce((s, x) => s + x.value, 0) || 1;

  // Recent cotações
  const recent = [...visible].sort((a, b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 5);

  // Greeting
  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Bom dia' : hour < 18 ? 'Boa tarde' : 'Boa noite';

  return (
    <div className="page">
      <div className="page-head">
        <div>
          <h2 className="page-title">{greet}, {currentUser.name.split(' ')[0]}.</h2>
          <p className="page-sub">
            {currentUser.role === 'vendas' && `Você tem ${plural(counts.pendente, 'cotação pendente', 'cotações pendentes')} e ${plural(counts.cotado, 'cotação aguardando', 'cotações aguardando')} envio ao cliente.`}
            {currentUser.role === 'compras' && `${plural(counts.pendente, 'cotação esperando', 'cotações esperando')} você assumir.`}
            {currentUser.role === 'admin' && `${plural(total, 'cotação no sistema', 'cotações no sistema')}, ${plural(active, 'ativa', 'ativas')}.`}
          </p>
        </div>
        <div className="row" style={{ gap: 8 }}>
          {(currentUser.role === 'vendas' || currentUser.role === 'admin') && (
            <Button variant="primary" icon="bi-plus-lg" onClick={() => dispatch({ type: 'navigate', name: 'new-quotation' })}>
              Nova cotação
            </Button>
          )}
        </div>
      </div>

      {/* KPI grid */}
      <div className="stat-grid" style={{ marginBottom: 16 }}>
        <Stat
          label="Pendentes"
          value={counts.pendente}
          icon="bi-hourglass-split"
          color="var(--st-pendente)"
          deltaUp={counts.pendente > 0}
          deltaText={counts.pendente > 0 ? `${counts.pendente} aguardando` : 'nada pendente'}
          onClick={() => dispatch({ type: 'navigate', name: 'quotations', params: { filter: 'pendente' } })}
        />
        <Stat
          label="Em cotação"
          value={counts.em_cotacao}
          icon="bi-currency-exchange"
          color="var(--st-em-cotacao)"
          deltaText="sendo trabalhadas"
          onClick={() => dispatch({ type: 'navigate', name: 'quotations', params: { filter: 'em_cotacao' } })}
        />
        <Stat
          label="Cotadas"
          value={counts.cotado}
          icon="bi-check2-square"
          color="var(--st-cotado)"
          deltaText="prontas pra cliente"
          onClick={() => dispatch({ type: 'navigate', name: 'quotations', params: { filter: 'cotado' } })}
        />
        <Stat
          label="Receita estimada"
          value={fmt.brlShort(revenue)}
          icon="bi-graph-up-arrow"
          color="var(--brand)"
          deltaText={`em ${total} cotações`}
        />
      </div>

      {/* Chart + Donut */}
      <div className="grid-side" style={{ marginBottom: 16 }}>
        <div className="card">
          <div className="card-head">
            <i className="bi bi-bar-chart" style={{ color: 'var(--text-muted)' }}></i>
            <h3>Cotações abertas — últimos 14 dias</h3>
            <div className="row" style={{ marginLeft: 'auto', gap: 12 }}>
              <span className="row tiny faint" style={{ gap: 5 }}><span style={{ width: 8, height: 8, background: 'var(--surface-3)', borderRadius: 2 }}></span> Abertas</span>
              <span className="row tiny faint" style={{ gap: 5 }}><span style={{ width: 8, height: 8, background: 'var(--brand)', borderRadius: 2 }}></span> Concluídas</span>
            </div>
          </div>
          <div className="card-pad">
            <div className="chart-bar-grid">
              {chartData.map((d, i) => (
                <div key={i} style={{ display: 'flex', flexDirection: 'column', justifyContent: 'flex-end', height: '100%', gap: 2 }} title={`${d.label}: ${d.value} abertas`}>
                  <div className="chart-bar" style={{ height: `${(d.value / maxBar) * 100}%` }}></div>
                  <div className="chart-bar alt" style={{ height: `${(d.won / maxBar) * 30}%`, marginTop: -2 }}></div>
                </div>
              ))}
            </div>
            <div className="chart-xrow" style={{ marginTop: 8 }}>
              {chartData.map((d, i) => (
                <div key={i} className="chart-bar-label">{d.label}</div>
              ))}
            </div>
          </div>
        </div>

        <div className="card">
          <div className="card-head">
            <i className="bi bi-pie-chart" style={{ color: 'var(--text-muted)' }}></i>
            <h3>Status</h3>
          </div>
          <div className="card-pad" style={{ textAlign: 'center' }}>
            <DonutChart segments={statusMix} total={mixTotal} active={active} />
            <div className="col" style={{ gap: 6, marginTop: 16, textAlign: 'left' }}>
              {statusMix.map(s => (
                <div key={s.k} className="row between">
                  <span className="row tiny" style={{ gap: 8 }}>
                    <span style={{ width: 8, height: 8, background: s.color, borderRadius: 2 }}></span>
                    {s.label}
                  </span>
                  <span className="mono small bold">{s.value}</span>
                </div>
              ))}
              {statusMix.length === 0 && <div className="empty tiny" style={{ padding: 16 }}>Sem dados</div>}
            </div>
          </div>
        </div>
      </div>

      {/* Approve rate + recent */}
      <div className="grid-side">
        <div className="card">
          <div className="card-head">
            <i className="bi bi-clock-history" style={{ color: 'var(--text-muted)' }}></i>
            <h3>Cotações recentes</h3>
            <button className="btn btn-ghost btn-sm" style={{ marginLeft: 'auto' }} onClick={() => dispatch({ type: 'navigate', name: 'quotations' })}>
              Ver todas <i className="bi bi-arrow-right"></i>
            </button>
          </div>
          {recent.length === 0 ? (
            <EmptyState icon="bi-inbox" title="Sem cotações recentes" />
          ) : (
            <table className="tbl">
              <tbody>
                {recent.map(q => {
                  const totals = calcTotals(q.items);
                  return (
                    <tr
                      key={q.id} className="clickable"
                      onClick={() => dispatch({ type: 'navigate', name: 'quotation-detail', params: { id: q.id } })}
                    >
                      <td style={{ width: 130 }}><span className="mono semibold" style={{ fontSize: 12 }}>{q.quote_number}</span></td>
                      <td>
                        <div className="semibold">{q.customer_name}</div>
                        <div className="tiny faint">{q.vehicle.make} {q.vehicle.model}</div>
                      </td>
                      <td><Plate value={q.vehicle.plate} /></td>
                      <td><span className="mono small">{totals.grandTotal > 0 ? fmt.brl(totals.grandTotal) : <span className="faint">—</span>}</span></td>
                      <td><StatusBadge status={q.status} /></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>

        <div className="col" style={{ gap: 16 }}>
          {/* Approve rate */}
          <div className="card card-pad">
            <div className="row between">
              <div>
                <div className="tiny faint" style={{ textTransform: 'uppercase', letterSpacing: '0.12em', fontFamily: 'var(--mono)' }}>Taxa de aprovação</div>
                <div className="bold" style={{ fontSize: 36, lineHeight: 1, marginTop: 8 }}>{approveRate}<span style={{ fontSize: 22, color: 'var(--text-muted)' }}>%</span></div>
                <div className="tiny faint" style={{ marginTop: 4 }}>{approvedCount} de {respondedCount} cotadas</div>
              </div>
              <ProgressRing value={approveRate} />
            </div>
          </div>

          {/* Quick actions */}
          <div className="card">
            <div className="card-head">
              <i className="bi bi-lightning-charge-fill" style={{ color: 'var(--brand)' }}></i>
              <h3>Atalhos rápidos</h3>
            </div>
            <div className="card-pad" style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              {currentUser.role === 'vendas' && (
                <QuickAction icon="bi-plus-square-fill" label="Abrir nova cotação" onClick={() => dispatch({ type: 'navigate', name: 'new-quotation' })} />
              )}
              <QuickAction icon="bi-clipboard-data" label="Ver fila de cotações" onClick={() => dispatch({ type: 'navigate', name: 'quotations' })} />
              <QuickAction icon="bi-box-seam" label="Catálogo de peças" onClick={() => dispatch({ type: 'navigate', name: 'catalog' })} />
              <QuickAction icon="bi-bell-fill" label={`Notificações${unreadCount ? ` (${unreadCount})` : ''}`} onClick={() => dispatch({ type: 'navigate', name: 'notifications' })} />
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function Stat({ label, value, icon, color, deltaUp, deltaText, onClick }) {
  return (
    <div className="stat" onClick={onClick} style={onClick ? { cursor: 'pointer' } : null}>
      <div className="stat-icon" style={{ color: color || 'var(--text-muted)' }}>
        <i className={`bi ${icon}`}></i>
      </div>
      <div className="stat-label">{label}</div>
      <div className="stat-value">{value}</div>
      <div className={`stat-delta ${deltaUp != null ? (deltaUp ? 'up' : 'down') : ''}`}>
        {deltaText}
      </div>
    </div>
  );
}

function DonutChart({ segments, total, active }) {
  const R = 56, C = 2 * Math.PI * R;
  let offset = 0;
  return (
    <div style={{ position: 'relative', display: 'inline-block' }}>
      <svg width={160} height={160} className="ring" viewBox="0 0 160 160">
        <circle cx="80" cy="80" r={R} className="ring-bg" strokeWidth="14"></circle>
        {segments.map((s, i) => {
          const len = (s.value / total) * C;
          const dash = `${len} ${C - len}`;
          const el = (
            <circle key={s.k} cx="80" cy="80" r={R} fill="none"
              stroke={s.color} strokeWidth="14"
              strokeDasharray={dash}
              strokeDashoffset={-offset}
              style={{ transition: 'stroke-dasharray 320ms' }}
            />
          );
          offset += len;
          return el;
        })}
      </svg>
      <div style={{ position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%, -50%)', textAlign: 'center' }}>
        <div className="bold" style={{ fontSize: 28, lineHeight: 1 }}>{active}</div>
        <div className="tiny faint" style={{ textTransform: 'uppercase', letterSpacing: '0.1em', marginTop: 2 }}>Ativas</div>
      </div>
    </div>
  );
}

function ProgressRing({ value }) {
  const R = 28, C = 2 * Math.PI * R;
  const dash = `${(value / 100) * C} ${C}`;
  return (
    <svg width="72" height="72" className="ring" viewBox="0 0 72 72">
      <circle cx="36" cy="36" r={R} className="ring-bg" strokeWidth="6"></circle>
      <circle cx="36" cy="36" r={R} className="ring-fg" strokeWidth="6" strokeDasharray={dash} />
    </svg>
  );
}

function QuickAction({ icon, label, onClick }) {
  return (
    <button onClick={onClick} className="row" style={{
      width: '100%', padding: '10px 12px', borderRadius: 'var(--r-md)',
      border: '1px solid var(--border)', background: 'var(--surface)',
      cursor: 'pointer', fontSize: 13, fontWeight: 600,
      gap: 10, transition: 'background 120ms, border-color 120ms',
    }}
    onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--brand)'; e.currentTarget.style.background = 'var(--surface-2)'; }}
    onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--border)'; e.currentTarget.style.background = 'var(--surface)'; }}
    >
      <i className={`bi ${icon}`} style={{ color: 'var(--brand)', fontSize: 15 }}></i>
      <span style={{ flex: 1, textAlign: 'left' }}>{label}</span>
      <i className="bi bi-arrow-right faint" style={{ fontSize: 12 }}></i>
    </button>
  );
}

/* =========================================================
   Catalog
   ========================================================= */
function CatalogScreen() {
  const { state, dispatch, currentUser } = useStore();
  const [q, setQ] = useState('');
  const [editing, setEditing] = useState(null); // part or 'new' or null
  const [deleting, setDeleting] = useState(null);

  const canEdit = currentUser.role === 'compras' || currentUser.role === 'admin';
  const list = q.trim()
    ? state.parts.filter(p => p.name.toLowerCase().includes(q.toLowerCase()) || p.code.toLowerCase().includes(q.toLowerCase()))
    : state.parts;
  const categories = [...new Set(state.parts.map(p => p.category))];

  return (
    <div className="page">
      <div className="page-head">
        <div>
          <h2 className="page-title">Catálogo de peças</h2>
          <p className="page-sub">{state.parts.length} peças cadastradas em {categories.length} categorias.</p>
        </div>
        <div className="row" style={{ gap: 8 }}>
          <div style={{ position: 'relative' }}>
            <i className="bi bi-search" style={{ position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)', color: 'var(--text-faint)', fontSize: 13 }}></i>
            <input className="input" placeholder="Buscar peça…" value={q} onChange={e => setQ(e.target.value)} style={{ width: 280, paddingLeft: 34 }} />

          {canEdit && (
            <Button variant="primary" icon="bi-plus-lg" onClick={() => setEditing('new')}>Nova peça</Button>
          )}

      </div>

      <div className="card">
        {list.length === 0 ? (
          <EmptyState icon="bi-box" title="Nenhuma peça encontrada" />
        ) : (
          <table className="tbl">
            <thead>
              <tr>
                <th style={{ width: 110 }}>Código</th>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Categoria</th>
                <th style={{ width: 120 }}>Preço padrão</th>
                {canEdit && <th style={{ width: 90 }}></th>}
              </tr>
            </thead>
            <tbody>
              {list.map(p => (
                <tr key={p.id}>
                  <td><span className="mono semibold small">{p.code}</span></td>
                  <td className="semibold">{p.name}</td>
                  <td className="small muted">{p.description}</td>
                  <td><Badge>{p.category}</Badge></td>
                  <td><span className="mono">{fmt.brl(p.default_price)}</span></td>
                  {canEdit && (
                    <td>
                      <div className="row" style={{ gap: 4 }}>
                        <button className="icon-btn" onClick={() => setEditing(p)} title="Editar">
                          <i className="bi bi-pencil" style={{ fontSize: 13 }}></i>
                        </button>
                        <button className="icon-btn" onClick={() => setDeleting(p)} title="Excluir">
                          <i className="bi bi-trash3" style={{ fontSize: 13, color: '#b91c1c' }}></i>
                        </button>
                      </div>
                    </td>
                  )}
                </tr>
              ))}
            </tbody>
          </table>
        )}

      {editing && <PartModal key={editing === 'new' ? 'new' : editing.id} part={editing === 'new' ? null : editing} onClose={() => setEditing(null)} />}
      <ConfirmDialog
        open={!!deleting}
        onClose={() => setDeleting(null)}
        title="Remover peça?"
        message={deleting ? `A peça "${deleting.name}" (${deleting.code}) será removida do catálogo.` : ''}
        confirmLabel="Remover"
        tone="danger"
        onConfirm={() => { dispatch({ type: 'delete_part', id: deleting.id }); setDeleting(null); }}
      />
    </div>

function PartModal({ part, onClose }) {
  const { dispatch, state } = useStore();
  const [form, setForm] = useState(part || { code: '', name: '', description: '', category: '', default_price: 0 });
  const categories = [...new Set(state.parts.map(p => p.category))];
  function save() {
    const data = { ...form, default_price: Number(form.default_price) || 0 };
    if (part) dispatch({ type: 'update_part', id: part.id, payload: data });
    else dispatch({ type: 'add_part', payload: data });
    onClose();
  }
  return (
    <Modal open onClose={onClose} title={part ? 'Editar peça' : 'Nova peça'} icon="bi-box-seam"
      footer={<>
        <Button variant="ghost" onClick={onClose}>Cancelar</Button>
        <Button variant="primary" icon="bi-check2" disabled={!form.code || !form.name} onClick={save}>Salvar</Button>
      </>}>
      <div className="col" style={{ gap: 14 }}>
        <div className="grid-2">
          <Field label="Código *">
            <input className="input mono" value={form.code} onChange={e => setForm({ ...form, code: e.target.value })} placeholder="PF-1023" />
          </Field>
          <Field label="Categoria">
            <input className="input" list="cats" value={form.category} onChange={e => setForm({ ...form, category: e.target.value })} placeholder="Freios" />
            <datalist id="cats">{categories.map(c => <option key={c} value={c} />)}</datalist>
          </Field>
        </div>
        <Field label="Nome *">
          <input className="input" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="Pastilha de Freio Dianteira" />
        </Field>
        <Field label="Descrição">
          <input className="input" value={form.description} onChange={e => setForm({ ...form, description: e.target.value })} placeholder="Kit com 4 pastilhas" />
        </Field>
        <Field label="Preço padrão (R$)">
          <input className="input mono" type="number" step="0.01" value={form.default_price} onChange={e => setForm({ ...form, default_price: e.target.value })} />
        </Field>
      </div>
    </Modal>
  );
}

/* =========================================================
   Notifications page
   ========================================================= */
function NotificationsScreen() {
  const { myNotifs, dispatch } = useStore();
  const unread = myNotifs.filter(n => !n.read_at);
  const read = myNotifs.filter(n => n.read_at);

  return (
    <div className="page" style={{ maxWidth: 800 }}>
      <div className="page-head">
        <div>
          <h2 className="page-title">Notificações</h2>
          <p className="page-sub">{unread.length > 0 ? plural(unread.length, 'nova notificação', 'novas notificações') : 'Tudo em dia'}</p>
        </div>
        {unread.length > 0 && (
          <Button variant="secondary" icon="bi-check2-all" onClick={() => dispatch({ type: 'mark_all_read' })}>
            Marcar tudo como lido
          </Button>
        )}
      </div>

      {unread.length > 0 && (
        <div style={{ marginBottom: 24 }}>
          <div className="row tiny faint" style={{ textTransform: 'uppercase', letterSpacing: '0.12em', fontFamily: 'var(--mono)', marginBottom: 10 }}>
            <span>Não lidas</span>
            <span className="badge" style={{ background: 'var(--brand)', color: '#fff' }}>{unread.length}</span>
          </div>
          <div className="card">
            {unread.map((n, i) => (
              <NotifRow key={n.id} n={n} last={i === unread.length - 1} />
            ))}
          </div>
        </div>
      )}

      {read.length > 0 && (
        <div>
          <div className="row tiny faint" style={{ textTransform: 'uppercase', letterSpacing: '0.12em', fontFamily: 'var(--mono)', marginBottom: 10 }}>
            <span>Lidas</span>
          </div>
          <div className="card">
            {read.map((n, i) => (
              <NotifRow key={n.id} n={n} last={i === read.length - 1} />
            ))}
          </div>
        </div>
      )}

      {myNotifs.length === 0 && (
        <div className="card">
          <EmptyState icon="bi-bell-slash" title="Sem notificações" message="Quando algo acontecer, você verá aqui." />
        </div>
      )}
    </div>
  );
}

function NotifRow({ n, last }) {
  const { dispatch } = useStore();
  return (
    <div
      className="notif-item"
      style={{ borderBottom: last ? 0 : '1px solid var(--border)', padding: '14px 18px' }}
      onClick={() => {
        dispatch({ type: 'mark_notification_read', id: n.id });
        if (n.quotation_id) dispatch({ type: 'navigate', name: 'quotation-detail', params: { id: n.quotation_id } });
      }}
    >
      <div className={`notif-icon ${!n.read_at ? 'unread' : ''}`}>
        <i className={`bi ${
          n.type === 'nova_cotacao' ? 'bi-plus-square' :
          n.type === 'cotacao_respondida' ? 'bi-currency-exchange' :
          n.type === 'peca_chegou' ? 'bi-box-seam' :
          n.type === 'cotacao_atualizada' ? 'bi-arrow-repeat' :
          n.type === 'nova_mensagem' ? 'bi-chat-dots-fill' : 'bi-bell'}`}></i>
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div className="row between">
          <div className="notif-title">{n.title}</div>
          <span className="tiny faint mono">{n.time_label || fmt.ago(n.created_at)}</span>
        </div>
        <div className="notif-msg">{n.message}</div>
      </div>
      {!n.read_at && <div className="notif-unread-dot"></div>}
    </div>
  );
}

/* =========================================================
   Admin users
   ========================================================= */
function AdminUsersScreen() {
  const { state, dispatch } = useStore();
  const [editing, setEditing] = useState(null);
  const [connectUserId, setConnectUserId] = useState(null);
  const [q, setQ] = useState('');
  const list = q.trim()
    ? state.users.filter(u => u.name.toLowerCase().includes(q.toLowerCase()) || u.email.toLowerCase().includes(q.toLowerCase()))
    : state.users;

  return (
    <div className="page">
      <div className="page-head">
        <div>
          <h2 className="page-title">Usuários</h2>
          <p className="page-sub">{state.users.filter(u => u.active).length} ativos de {state.users.length} cadastrados</p>
        </div>
        <div className="row" style={{ gap: 8 }}>
          <input className="input" placeholder="Buscar…" value={q} onChange={e => setQ(e.target.value)} style={{ width: 240 }} />
          <Button variant="primary" icon="bi-person-plus" onClick={() => setEditing('new')}>Novo usuário</Button>
        </div>
      </div>

      <div className="card">
        <table className="tbl">
          <thead>
            <tr>
              <th>Usuário</th>
              <th>E-mail</th>
              <th>Função</th>
              <th>WhatsApp pessoal</th>
              <th>Status</th>
              <th>Criado</th>

            </tr>
          </thead>
          <tbody>
            {list.map(u => (
              <tr key={u.id}>
                <td>
                  <div className="row" style={{ gap: 10 }}>
                    <div className="avatar" style={{ background: u.active ? 'var(--brand)' : 'var(--surface-3)', color: u.active ? 'var(--brand-text)' : 'var(--text-faint)' }}>
                      {u.name.split(' ').map(s => s[0]).slice(0, 2).join('')}
                    </div>
                    <div className="semibold">{u.name}</div>
                  </div>
                </td>
                <td><span className="mono small">{u.email}</span></td>
                <td><RoleBadge role={u.role} /></td>
                <td>
                  {u.whatsapp_connected
                    ? <div className="row" style={{ gap: 6, alignItems: 'center' }}>
                        <Badge className="badge-cotado" style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
                          <span className="dot-sm" style={{ background: '#16a34a' }}></span> Conectado
                        </Badge>
                        <button className="icon-btn" title="Desconectar"
                          onClick={() => dispatch({ type: 'whatsapp_disconnect', userId: u.id })}>
                          <i className="bi bi-x-circle" style={{ fontSize: 14, color: 'var(--text-faint)' }}></i>
                        </button>
                      </div>
                    : <Button variant="ghost" size="sm" icon="bi-whatsapp"
                        onClick={() => setConnectUserId(u.id)}>Conectar</Button>
                  }
                </td>
                <td>
                  {u.active
                    ? <Badge className="badge-cotado"><span className="dot-sm"></span> Ativo</Badge>
                    : <Badge className="badge-cancelado"><span className="dot-sm"></span> Inativo</Badge>}
                </td>
                <td><span className="tiny mono faint">{fmt.date(u.created_at)}</span></td>
                <td>
                  <div className="row" style={{ gap: 4 }}>
                    <button className="icon-btn" onClick={() => setEditing(u)} title="Editar">
                      <i className="bi bi-pencil" style={{ fontSize: 13 }}></i>
                    </button>
                    <button className="icon-btn" onClick={() => dispatch({ type: 'toggle_user_active', id: u.id })} title={u.active ? 'Desativar' : 'Ativar'}>
                      <i className={`bi ${u.active ? 'bi-pause-circle' : 'bi-play-circle'}`} style={{ fontSize: 13 }}></i>

      </div>

      {editing && <UserModal key={editing === 'new' ? 'new' : editing.id} user={editing === 'new' ? null : editing} onClose={() => setEditing(null)} />}

    </div>

}

function UserModal({ user, onClose }) {
  const { dispatch } = useStore();
  const [form, setForm] = useState(user || { name: '', email: '', role: 'vendas', phone_whatsapp: '', new_password: '' });
  function save() {
    if (user) dispatch({ type: 'update_user', id: user.id, payload: form });
    else dispatch({ type: 'add_user', payload: form });
    onClose();
  }
  const valid = form.name && form.email && form.role && (user || form.new_password);
  return (
    <Modal open onClose={onClose} title={user ? 'Editar usuário' : 'Novo usuário'} icon="bi-person"
      footer={<>
        <Button variant="ghost" onClick={onClose}>Cancelar</Button>
        <Button variant="primary" icon="bi-check2" disabled={!valid} onClick={save}>Salvar</Button>
      </>}>
      <div className="col" style={{ gap: 14 }}>
        <Field label="Nome *">
          <input className="input" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="João Vendas" autoFocus />
        </Field>
        <div className="grid-2">
          <Field label="E-mail *">
            <input className="input mono" type="email" value={form.email} onChange={e => setForm({ ...form, email: e.target.value })} placeholder="usuario@cotou.com.br" />
          </Field>
          <Field label="Função *">
            <select className="select" value={form.role} onChange={e => setForm({ ...form, role: e.target.value })}>
              <option value="vendas">Vendas</option>
              <option value="compras">Compras</option>
              <option value="admin">Admin</option>
            </select>
          </Field>
        </div>
        <div className="grid-2">
          <Field label="WhatsApp">
            <input className="input mono" value={form.phone_whatsapp} onChange={e => setForm({ ...form, phone_whatsapp: e.target.value })} placeholder="11999998888" />
          </Field>
          <Field label={user ? 'Nova senha (opcional)' : 'Senha *'}>
            <input className="input" type="password" value={form.new_password || ''} onChange={e => setForm({ ...form, new_password: e.target.value })} placeholder="•••••••" />
          </Field>
        </div>
      </div>
    </Modal>
  );
}

Object.assign(window, {
  Dashboard, CatalogScreen, NotificationsScreen, AdminUsersScreen,
});

<script type="text/babel">
// COTOU — root app: router + tweaks

const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "brand": "#2563eb",
  "theme": "light"
}/*EDITMODE-END*/;

function Router() {
  const { state } = useStore();
  if (!state.loggedIn) return <LoginScreen />;

  let screen = null;
  switch (state.route.name) {
    case 'dashboard':         screen = <Dashboard />; break;
    case 'quotations':        screen = <QuotationsList />; break;
    case 'quotation-detail':  screen = <QuotationDetail />; break;
    case 'new-quotation':     screen = <NewQuotation key={state.route.name + JSON.stringify(state.route.params)} />; break;
    case 'catalog':           screen = <CatalogScreen />; break;
    case 'notifications':     screen = <NotificationsScreen />; break;
    case 'admin-users':       screen = <AdminUsersScreen />; break;
    default:                  screen = <Dashboard />;
  }

  const titles = {
    'dashboard': { title: 'Dashboard', subtitle: 'Visão geral do dia' },
    'quotations': { title: 'Cotações', subtitle: 'Todas as cotações em fluxo' },
    'quotation-detail': { title: 'Detalhe da cotação', subtitle: null },
    'new-quotation': { title: 'Nova cotação', subtitle: 'Abertura' },
    'catalog': { title: 'Catálogo', subtitle: 'Peças cadastradas' },
    'notifications': { title: 'Notificações', subtitle: 'Eventos do sistema' },
    'admin-users': { title: 'Usuários', subtitle: 'Gestão de acesso' },
  };
  const t = titles[state.route.name] || titles.dashboard;

  return (
    <div className="app-root">
      <Sidebar />
      <main style={{ minWidth: 0 }}>
        <Topbar title={t.title} subtitle={t.subtitle} />
        {screen}
      </main>
    </div>
  );
}

/* =========================================================
   Tweaks
   ========================================================= */

const BRAND_PRESETS = ['#2563eb', '#0ea5e9', '#7c3aed', '#16a34a', '#dc2626', '#0f172a'];

function CotouTweaks() {
  const { TweaksPanel, TweakSection, TweakColor, TweakRadio, useTweaks } = window;
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  useEffect(() => {
    // Apply brand
    const brand = t.brand || '#dc2626';
    document.documentElement.style.setProperty('--brand', brand);
    // Auto-compute brand-hover & soft variants
    document.documentElement.style.setProperty('--brand-hover', shade(brand, -15));
    document.documentElement.style.setProperty('--brand-soft', tint(brand, 0.88));
    document.documentElement.style.setProperty('--brand-text', luminance(brand) > 0.55 ? '#0a0a0a' : '#ffffff');
  }, [t.brand]);

  useEffect(() => {
    document.documentElement.dataset.theme = t.theme || 'light';
  }, [t.theme]);

  // Listen for topbar theme toggle and reflect in tweak
  useEffect(() => {
    const handler = (e) => setTweak('theme', e.detail);
    window.addEventListener('cotou-theme', handler);
    return () => window.removeEventListener('cotou-theme', handler);
  }, []);

  return (
    <TweaksPanel title="Tweaks">
      <TweakSection label="Tema" />
      <TweakRadio
        label="Modo"
        value={t.theme}
        onChange={v => setTweak('theme', v)}
        options={['light', 'dark']}
      />
      <TweakSection label="Marca" />
      <TweakColor
        label="Cor primária"
        value={t.brand}
        onChange={v => setTweak('brand', v)}
        options={BRAND_PRESETS}
      />
    </TweaksPanel>
  );
}

/* Color utilities (simple) */
function hexToRgb(hex) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function rgbToHex(r, g, b) {
  const c = (n) => Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, '0');
  return '#' + c(r) + c(g) + c(b);
}
function shade(hex, pct) {
  const { r, g, b } = hexToRgb(hex);
  const f = 1 + pct / 100;
  return rgbToHex(r * f, g * f, b * f);
}
function tint(hex, ratio) {
  const { r, g, b } = hexToRgb(hex);
  return rgbToHex(r + (255 - r) * ratio, g + (255 - g) * ratio, b + (255 - b) * ratio);
}
function luminance(hex) {
  const { r, g, b } = hexToRgb(hex);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
}

/* =========================================================
   Root
   ========================================================= */
function App() {
  return (
    <StoreProvider>
      <Router />
      <Toasts />
      <CotouTweaks />
    </StoreProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
