<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COTOU — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">

  <div class="max-w-sm w-full">
    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <!-- Logo -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-600 rounded-2xl mb-4 shadow-lg shadow-blue-200">
          <i class="bi bi-car-front-fill text-white text-2xl"></i>
        </div>
        <div class="text-3xl font-black text-blue-600 tracking-tight leading-none">COTOU</div>
        <div class="text-xs text-slate-400 mt-1.5 uppercase tracking-widest font-medium">ERP Autopeças</div>
        <p class="text-sm text-slate-500 mt-3">Sistema de Cotação de Peças Automotivas</p>
      </div>

      <!-- Form -->
      <form onsubmit="event.preventDefault(); window.location.href='dashboard.html'" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="email">E-mail</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-3 flex items-center text-slate-400">
              <i class="bi bi-envelope text-sm"></i>
            </span>
            <input
              id="email"
              type="email"
              value="vendas@cotou.com.br"
              placeholder="seu@email.com.br"
              class="w-full pl-9 pr-4 py-2.5 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
            />
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="password">Senha</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-3 flex items-center text-slate-400">
              <i class="bi bi-lock text-sm"></i>
            </span>
            <input
              id="password"
              type="password"
              value="••••••••"
              placeholder="Sua senha"
              class="w-full pl-9 pr-10 py-2.5 border border-slate-200 rounded-xl text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
            />
            <button type="button" onclick="togglePwd()" class="absolute inset-y-0 right-3 flex items-center text-slate-400 hover:text-slate-600">
              <i class="bi bi-eye text-sm" id="pwd-icon"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
            <input type="checkbox" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500" checked />
            Lembrar-me
          </label>
          <a href="#" class="text-sm text-blue-600 font-medium hover:underline">Esqueceu a senha?</a>
        </div>

        <button
          type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-2.5 rounded-xl transition-colors shadow-sm shadow-blue-200 flex items-center justify-center gap-2 mt-2"
        >
          Entrar
          <i class="bi bi-arrow-right"></i>
        </button>
      </form>

      <!-- Perfil demo -->
      <div class="mt-6 pt-5 border-t border-slate-100">
        <p class="text-xs text-slate-400 text-center mb-3 font-medium uppercase tracking-wider">Perfis de demonstração</p>
        <div class="space-y-2">
          <button onclick="setDemo('vendas@cotou.com.br')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-slate-50 border border-slate-100 transition flex items-center gap-3">
            <span class="w-7 h-7 rounded-full bg-blue-100 flex items-center justify-center"><i class="bi bi-person text-blue-600 text-xs"></i></span>
            <span class="text-xs"><span class="font-semibold text-slate-700">Vendas</span> <span class="text-slate-400">— João Vendas</span></span>
          </button>
          <button onclick="setDemo('compras@cotou.com.br')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-slate-50 border border-slate-100 transition flex items-center gap-3">
            <span class="w-7 h-7 rounded-full bg-green-100 flex items-center justify-center"><i class="bi bi-bag text-green-600 text-xs"></i></span>
            <span class="text-xs"><span class="font-semibold text-slate-700">Compras</span> <span class="text-slate-400">— Maria Compras</span></span>
          </button>
          <button onclick="setDemo('admin@cotou.com.br')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-slate-50 border border-slate-100 transition flex items-center gap-3">
            <span class="w-7 h-7 rounded-full bg-purple-100 flex items-center justify-center"><i class="bi bi-shield-check text-purple-600 text-xs"></i></span>
            <span class="text-xs"><span class="font-semibold text-slate-700">Admin</span> <span class="text-slate-400">— Admin Sistema</span></span>
          </button>
        </div>
      </div>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6">© 2026 COTOU · ERP Autopeças v1.0</p>
  </div>

  <script>
    function togglePwd() {
      const input = document.getElementById('password');
      const icon = document.getElementById('pwd-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash text-sm';
      } else {
        input.type = 'password';
        icon.className = 'bi bi-eye text-sm';
      }
    }

    function setDemo(email) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = 'demo1234';
    }
  </script>
</body>
</html>
