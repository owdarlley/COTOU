<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COTOU — ERP Autopeças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
:root {
  /* Brand — defaults; tweakable */
  --brand: #2563eb;
  --brand-hover: #1d4ed8;
  --brand-soft: #dbeafe;
  --brand-text: #ffffff;

  /* Neutrals — light */
  --bg: #f6f6f4;
  --bg-page: #fafaf8;
  --surface: #ffffff;
  --surface-2: #f4f4f1;
  --surface-3: #ebebe6;
  --border: #e3e3dd;
  --border-strong: #cfcfc8;
  --text: #0a0a0a;
  --text-muted: #595959;
  --text-faint: #8a8a85;
  --shadow-sm: 0 1px 0 rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px -8px rgba(0,0,0,0.08);
  --shadow-lg: 0 24px 60px -24px rgba(0,0,0,0.20);

  /* Status */
  --st-pendente: #b45309;
  --st-pendente-bg: #fef3c7;
  --st-em-cotacao: #1d4ed8;
  --st-em-cotacao-bg: #dbeafe;
  --st-cotado: #047857;
  --st-cotado-bg: #d1fae5;
  --st-peca: #6d28d9;
  --st-peca-bg: #ede9fe;
  --st-cancelado: #57534e;
  --st-cancelado-bg: #e7e5e4;

  /* Fonts */
  --sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --mono: 'DM Mono', ui-monospace, monospace;

  /* Radii */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 20px;
}

[data-theme="dark"] {
  --bg: #0a0a0a;
  --bg-page: #050505;
  --surface: #131313;
  --surface-2: #1a1a1a;
  --surface-3: #242424;
  --border: #2a2a2a;
  --border-strong: #3a3a3a;
  --text: #f5f5f3;
  --text-muted: #a0a09a;
  --text-faint: #6e6e68;
  --brand-soft: #2a1414;
  --shadow-sm: 0 1px 0 rgba(0,0,0,0.4);
  --shadow-md: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -8px rgba(0,0,0,0.6);
  --shadow-lg: 0 24px 60px -24px rgba(0,0,0,0.8);

  --st-pendente: #fbbf24;
  --st-pendente-bg: #422006;
  --st-em-cotacao: #60a5fa;
  --st-em-cotacao-bg: #0c1e3f;
  --st-cotado: #34d399;
  --st-cotado-bg: #042f1f;
  --st-peca: #a78bfa;
  --st-peca-bg: #1e1339;
  --st-cancelado: #a8a29e;
  --st-cancelado-bg: #1c1917;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "ss01", "ss02", "cv01";
  font-size: 14px;
  line-height: 1.5;
}
button { font-family: inherit; }
input, textarea, select { font-family: inherit; color: inherit; }
a { color: inherit; }
.mono { font-family: var(--mono); font-feature-settings: "zero" 1; }

/* =========================================================
   App layout
   ========================================================= */

.app-root {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: 100vh;
}

.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
}

.sidebar-brand {
  padding: 18px 18px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
}
.sidebar-brand-mark {
  width: 32px; height: 32px;
  background: var(--brand);
  color: var(--brand-text);
  border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  box-shadow: var(--shadow-sm);
}
.sidebar-brand-wm {
  font-weight: 700;
  font-size: 18px;
  letter-spacing: -0.02em;
  line-height: 1;
}
.sidebar-brand-sub {
  font-size: 9.5px;
  letter-spacing: 0.12em;
  color: var(--text-faint);
  text-transform: uppercase;
  margin-top: 3px;
  font-family: var(--mono);
  font-weight: 500;
}

.sidebar-nav { padding: 10px; flex: 1; overflow-y: auto; }
.sidebar-section {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-faint);
  padding: 14px 10px 6px;
  font-family: var(--mono);
  font-weight: 500;
}

.nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: var(--r-sm);
  background: none;
  border: 0;
  cursor: pointer;
  text-align: left;
  color: var(--text-muted);
  font-size: 13.5px;
  font-weight: 500;
  transition: background 120ms, color 120ms;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active {
  background: var(--surface-2);
  color: var(--text);
}
.nav-item.active .nav-icon { color: var(--brand); }
.nav-icon { font-size: 15px; width: 18px; text-align: center; color: var(--text-faint); }
.nav-badge {
  margin-left: auto;
  background: var(--brand);
  color: var(--brand-text);
  font-size: 10.5px;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: 99px;
  min-width: 18px;
  text-align: center;
}

.sidebar-user {
  padding: 12px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.avatar {
  width: 32px; height: 32px;
  background: var(--surface-3);
  color: var(--text);
  border-radius: 99px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
  font-size: 12px;
  flex-shrink: 0;
}
.avatar.brand { background: var(--brand); color: var(--brand-text); }

/* =========================================================
   Topbar
   ========================================================= */

.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 28px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 30;
}
.topbar h1 {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0;
}
.topbar-search {
  position: relative;
  margin-left: 16px;
  flex: 1;
  max-width: 420px;
}
.topbar-search input {
  width: 100%;
  padding: 8px 12px 8px 34px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: var(--r-md);
  font-size: 13px;
  color: var(--text);
  outline: none;
  transition: border-color 120ms, background 120ms;
}
.topbar-search input:focus { border-color: var(--brand); background: var(--surface); }
.topbar-search .bi-search {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-faint);
}
.topbar-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.icon-btn {
  width: 36px; height: 36px;
  border-radius: var(--r-md);
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px;
  position: relative;
  transition: background 120ms, color 120ms;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn .dot {
  position: absolute;
  top: 8px; right: 9px;
  width: 8px; height: 8px;
  border-radius: 99px;
  background: var(--brand);
  border: 2px solid var(--surface);
}
.icon-btn .dot::after {
  content: '';
  position: absolute; inset: -4px;
  border-radius: 99px;
  background: var(--brand);
  opacity: 0.35;
  animation: pulse 1.6s ease-out infinite;
}
@keyframes pulse {
  0% { transform: scale(0.6); opacity: 0.5; }
  100% { transform: scale(1.8); opacity: 0; }
}

/* =========================================================
   Page container
   ========================================================= */

.page {
  padding: 28px 28px 80px;
  max-width: 1400px;
  margin: 0 auto;
}
.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 24px;
}
.page-title {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0 0 4px;
  line-height: 1.1;
}
.page-sub {
  color: var(--text-muted);
  font-size: 13.5px;
  margin: 0;
}

/* =========================================================
   Card
   ========================================================= */

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
}
.card-pad { padding: 20px; }
.card-head {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
.card-head h3 {
  margin: 0;
  font-size: 14.5px;
  font-weight: 600;
  letter-spacing: -0.005em;
}

/* =========================================================
   Buttons
   ========================================================= */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 14px;
  border-radius: var(--r-md);
  font-weight: 600;
  font-size: 13px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: background 120ms, border-color 120ms, color 120ms, transform 80ms;
  text-decoration: none;
  white-space: nowrap;
  line-height: 1.2;
}
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: var(--brand);
  color: var(--brand-text);
}
.btn-primary:hover { background: var(--brand-hover); }
.btn-secondary {
  background: var(--surface);
  color: var(--text);
  border-color: var(--border-strong);
}
.btn-secondary:hover { background: var(--surface-2); }
.btn-ghost {
  background: transparent;
  color: var(--text);
}
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger {
  background: var(--surface);
  color: #b91c1c;
  border-color: var(--border-strong);
}
.btn-danger:hover { background: #fef2f2; border-color: #fecaca; }
[data-theme="dark"] .btn-danger { color: #fca5a5; }
[data-theme="dark"] .btn-danger:hover { background: #2a1414; border-color: #4a1717; }
.btn-whatsapp {
  background: #16a34a;
  color: #fff;
}
.btn-whatsapp:hover { background: #15803d; }

.btn-lg { padding: 11px 18px; font-size: 14px; }
.btn-sm { padding: 5px 9px; font-size: 12px; gap: 4px; }
.btn-icon { padding: 8px; width: 34px; height: 34px; }

/* =========================================================
   Inputs
   ========================================================= */

.field { display: flex; flex-direction: column; gap: 6px; }
.field-label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.field-hint { font-size: 12px; color: var(--text-faint); }
.input, .textarea, .select {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  padding: 9px 12px;
  border-radius: var(--r-md);
  font-size: 13.5px;
  color: var(--text);
  outline: none;
  transition: border-color 120ms, box-shadow 120ms;
  width: 100%;
}
.input:focus, .textarea:focus, .select:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-soft);
}
.input.mono { font-family: var(--mono); letter-spacing: 0.04em; }
.textarea { resize: vertical; min-height: 80px; }
.select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-faint) 50%), linear-gradient(135deg, var(--text-faint) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
.input-group { position: relative; }
.input-group .input { padding-left: 36px; }
.input-group .input-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-faint);
  font-size: 14px;
  pointer-events: none;
}

/* =========================================================
   Badges
   ========================================================= */

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.01em;
  background: var(--surface-2);
  color: var(--text-muted);
  white-space: nowrap;
  line-height: 1.4;
}
.badge .dot-sm {
  width: 6px; height: 6px;
  border-radius: 99px;
  background: currentColor;
}
.badge-pendente { background: var(--st-pendente-bg); color: var(--st-pendente); }
.badge-em_cotacao { background: var(--st-em-cotacao-bg); color: var(--st-em-cotacao); }
.badge-cotado { background: var(--st-cotado-bg); color: var(--st-cotado); }
.badge-peca_chegou { background: var(--st-peca-bg); color: var(--st-peca); }
.badge-cancelado { background: var(--st-cancelado-bg); color: var(--st-cancelado); }
.badge-role-vendas { background: #dbeafe; color: #1d4ed8; }
.badge-role-compras { background: #d1fae5; color: #047857; }
.badge-role-admin { background: #ede9fe; color: #6d28d9; }
[data-theme="dark"] .badge-role-vendas { background: #0c1e3f; color: #93c5fd; }
[data-theme="dark"] .badge-role-compras { background: #042f1f; color: #6ee7b7; }
[data-theme="dark"] .badge-role-admin { background: #1e1339; color: #c4b5fd; }

/* =========================================================
   Tables
   ========================================================= */

.tbl {
  width: 100%;
  border-collapse: collapse;
}
.tbl thead th {
  text-align: left;
  padding: 11px 16px;
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-faint);
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  font-family: var(--mono);
  background: var(--surface-2);
}
.tbl tbody td {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 13.5px;
  vertical-align: middle;
}
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr.clickable { cursor: pointer; transition: background 120ms; }
.tbl tbody tr.clickable:hover { background: var(--surface-2); }

.plate {
  display: inline-flex;
  align-items: center;
  font-family: var(--mono);
  font-weight: 700;
  letter-spacing: 0.08em;
  font-size: 12px;
  padding: 3px 8px;
  border: 1.5px solid var(--text);
  border-radius: 4px;
  background: var(--surface);
  white-space: nowrap;
}

/* =========================================================
   KPI / Stat cards
   ========================================================= */

.stat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 18px 20px;
  position: relative;
  overflow: hidden;
}
.stat-label {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-faint);
  font-family: var(--mono);
  font-weight: 600;
}
.stat-value {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.025em;
  margin-top: 4px;
  line-height: 1.05;
}
.stat-delta {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 6px;
  display: flex; align-items: center; gap: 4px;
}
.stat-delta.up { color: #047857; }
.stat-delta.down { color: #b91c1c; }
[data-theme="dark"] .stat-delta.up { color: #34d399; }
[data-theme="dark"] .stat-delta.down { color: #fca5a5; }
.stat-icon {
  position: absolute;
  right: 16px;
  top: 16px;
  width: 32px; height: 32px;
  border-radius: var(--r-md);
  background: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  color: var(--text-muted);
}

/* =========================================================
   Timeline (status)
   ========================================================= */

.timeline { display: flex; align-items: flex-start; position: relative; padding: 8px 0; }
.timeline-step { flex: 1; text-align: center; position: relative; }
.timeline-step::before {
  content: '';
  position: absolute;
  top: 13px;
  left: 50%;
  width: 100%;
  height: 2px;
  background: var(--border);
  z-index: 0;
}
.timeline-step:last-child::before { display: none; }
.timeline-step.done::before { background: var(--brand); }
.timeline-dot {
  width: 28px; height: 28px;
  border-radius: 99px;
  background: var(--surface);
  border: 2px solid var(--border);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  color: var(--text-faint);
  position: relative;
  z-index: 1;
}
.timeline-step.done .timeline-dot {
  background: var(--brand);
  border-color: var(--brand);
  color: var(--brand-text);
}
.timeline-step.current .timeline-dot {
  border-color: var(--brand);
  color: var(--brand);
  background: var(--surface);
  box-shadow: 0 0 0 4px var(--brand-soft);
}
.timeline-label {
  margin-top: 8px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.timeline-step.done .timeline-label,
.timeline-step.current .timeline-label { color: var(--text); }
.timeline-sub {
  font-size: 11px;
  color: var(--text-faint);
  margin-top: 2px;
  font-family: var(--mono);
}

/* =========================================================
   Modal
   ========================================================= */

.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(10,10,10,0.45);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  animation: fadeIn 140ms ease-out;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  max-width: 720px;
  width: 100%;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-lg);
  animation: slideUp 200ms cubic-bezier(.2,.8,.2,1);
}
.modal-head {
  padding: 18px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
.modal-head h3 {
  margin: 0;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.modal-body { padding: 24px; overflow-y: auto; flex: 1; }
.modal-foot {
  padding: 14px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  background: var(--surface-2);
}
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }

/* =========================================================
   Dropdown / notifications
   ========================================================= */
.dropdown {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-md);
  width: 380px;
  max-height: 480px;
  display: flex;
  flex-direction: column;
  z-index: 50;
  animation: slideUp 160ms cubic-bezier(.2,.8,.2,1);
}
.dropdown-head {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.dropdown-head strong { font-weight: 600; font-size: 14px; }
.dropdown-list { overflow-y: auto; flex: 1; }
.notif-item {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 12px;
  cursor: pointer;
  transition: background 120ms;
}
.notif-item:hover { background: var(--surface-2); }
.notif-item:last-child { border-bottom: 0; }
.notif-icon {
  width: 32px; height: 32px;
  border-radius: var(--r-md);
  background: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}
.notif-icon.unread { background: var(--brand-soft); color: var(--brand); }
.notif-title { font-size: 13px; font-weight: 600; }
.notif-msg { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
.notif-time { font-size: 11px; color: var(--text-faint); margin-top: 4px; font-family: var(--mono); }
.notif-unread-dot {
  width: 7px; height: 7px;
  border-radius: 99px;
  background: var(--brand);
  margin-top: 6px;
  flex-shrink: 0;
}

/* =========================================================
   Chart
   ========================================================= */

.chart-bar-grid {
  display: grid;
  grid-template-columns: repeat(14, 1fr);
  gap: 6px;
  align-items: end;
  height: 180px;
}
.chart-bar {
  background: var(--surface-3);
  border-radius: 4px 4px 0 0;
  position: relative;
  transition: background 200ms;
}
.chart-bar:hover { background: var(--brand); }
.chart-bar.alt { background: var(--brand); opacity: 0.85; }
.chart-bar-label {
  text-align: center;
  font-size: 10px;
  color: var(--text-faint);
  margin-top: 6px;
  font-family: var(--mono);
}
.chart-xrow {
  display: grid;
  grid-template-columns: repeat(14, 1fr);
  gap: 6px;
}

/* Donut / progress ring */
.ring { transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--surface-3); }
.ring-fg { fill: none; stroke: var(--brand); transition: stroke-dasharray 320ms; stroke-linecap: round; }

/* =========================================================
   Toast
   ========================================================= */

.toast-host { position: fixed; bottom: 24px; right: 24px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--brand);
  padding: 12px 16px;
  border-radius: var(--r-md);
  box-shadow: var(--shadow-md);
  min-width: 280px;
  display: flex;
  align-items: center;
  gap: 10px;
  animation: slideInRight 240ms cubic-bezier(.2,.8,.2,1);
  font-size: 13px;
}
.toast.success { border-left-color: #16a34a; }
.toast.error { border-left-color: #dc2626; }
.toast i { font-size: 16px; }
@keyframes slideInRight { from { transform: translateX(20px); opacity: 0 } to { transform: translateX(0); opacity: 1 } }

/* =========================================================
   Login screen
   ========================================================= */

.login-bg {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: var(--bg);
}
.login-poster {
  background: var(--text);
  color: var(--surface);
  padding: 48px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
}
.login-poster::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(800px 600px at 80% 100%, color-mix(in srgb, var(--brand) 30%, transparent), transparent 60%);
}
.login-poster > * { position: relative; z-index: 1; }
.login-mark { display: flex; align-items: center; gap: 12px; }
.login-mark .sidebar-brand-mark { width: 38px; height: 38px; font-size: 20px; }
.login-mark .sidebar-brand-wm { font-size: 22px; }
.login-headline {
  font-size: 44px;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.05;
  margin: 0 0 16px;
}
.login-sub { font-size: 15px; color: rgba(255,255,255,0.7); max-width: 420px; line-height: 1.55; }
.login-meta {
  display: flex;
  gap: 24px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
}
.login-form-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px;
}
.login-form { width: 100%; max-width: 360px; }
.role-pick {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
  margin-top: 8px;
}
.role-tile {
  border: 1px solid var(--border);
  background: var(--surface);
  padding: 10px;
  border-radius: var(--r-md);
  cursor: pointer;
  text-align: left;
  transition: border-color 120ms, background 120ms;
}
.role-tile:hover { border-color: var(--brand); }
.role-tile.active { border-color: var(--brand); background: var(--brand-soft); }
.role-tile-name { font-weight: 700; font-size: 12.5px; }
.role-tile-mail { font-family: var(--mono); font-size: 10px; color: var(--text-faint); margin-top: 2px; }

/* =========================================================
   Helpers / utilities
   ========================================================= */

.row { display: flex; align-items: center; gap: 12px; }
.col { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.muted { color: var(--text-muted); }
.faint { color: var(--text-faint); }
.tiny { font-size: 11.5px; }
.small { font-size: 12.5px; }
.big { font-size: 16px; }
.bold { font-weight: 700; }
.semibold { font-weight: 600; }

.hr { height: 1px; background: var(--border); border: 0; margin: 16px 0; }

.empty {
  text-align: center;
  padding: 56px 16px;
  color: var(--text-faint);
}
.empty i { font-size: 36px; margin-bottom: 8px; display: block; }

/* segmented control */
.segmented {
  display: inline-flex;
  background: var(--surface-2);
  border-radius: var(--r-md);
  padding: 3px;
  border: 1px solid var(--border);
}
.segmented button {
  background: transparent;
  border: 0;
  padding: 6px 12px;
  font-size: 12.5px;
  font-weight: 600;
  border-radius: 7px;
  cursor: pointer;
  color: var(--text-muted);
  transition: background 120ms, color 120ms;
  font-family: inherit;
}
.segmented button.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}

.scrollbar-thin { scrollbar-width: thin; }
.scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
.scrollbar-thin::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; }

/* Photo dropzone */
.dropzone {
  border: 1.5px dashed var(--border-strong);
  border-radius: var(--r-lg);
  padding: 24px;
  text-align: center;
  background: var(--surface-2);
  cursor: pointer;
  transition: border-color 120ms, background 120ms;
}
.dropzone:hover { border-color: var(--brand); }
.dropzone i { font-size: 28px; color: var(--text-faint); display: block; margin-bottom: 8px; }
.photo-preview {
  border-radius: var(--r-lg);
  overflow: hidden;
  position: relative;
  border: 1px solid var(--border);
}
.photo-preview img { width: 100%; display: block; }
.photo-preview .remove {
  position: absolute;
  top: 8px; right: 8px;
  background: rgba(0,0,0,0.65);
  color: #fff;
  border: 0;
  width: 28px; height: 28px;
  border-radius: 99px;
  cursor: pointer;
}

/* Autocomplete list */
.autocomplete {
  position: absolute;
  top: calc(100% + 4px);
  left: 0; right: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-md);
  z-index: 20;
  max-height: 280px;
  overflow-y: auto;
}
.autocomplete-item {
  padding: 10px 12px;
  cursor: pointer;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.autocomplete-item:last-child { border: 0; }
.autocomplete-item:hover, .autocomplete-item.hl { background: var(--surface-2); }
.autocomplete-item .code { font-family: var(--mono); font-size: 11px; color: var(--text-faint); }

/* layout helpers for forms */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 14px; }
.grid-side { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; }

/* responsive nicety */
@media (max-width: 980px) {
  .app-root { grid-template-columns: 64px 1fr; }
  .sidebar { width: 64px; }
  .sidebar-brand-wm, .sidebar-brand-sub, .nav-item span:not(.nav-badge), .sidebar-section, .sidebar-user .user-text { display: none; }
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .grid-side { grid-template-columns: 1fr; }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

/* =========================================================

const StoreContext = createContext(null);

const initialState = {
  currentUserId: 2, // start as Vendas
  users: SEED_USERS,
  parts: SEED_PARTS,
  quotations: SEED_QUOTATIONS,
  notifications: SEED_NOTIFICATIONS,
  toasts: [],
  loggedIn: false,
  route: { name: 'login', params: {} },
};

function nextId(arr) { return arr.length ? Math.max(...arr.map(x => x.id)) + 1 : 1; }
function nextQuoteNumber(arr) {
  const max = arr.reduce((m, q) => {
    const n = parseInt((q.quote_number.split('-').pop() || '0'), 10);
    return Math.max(m, n);
  }, 0);
  return 'COT-2026-' + String(max + 1).padStart(4, '0');
}

function reducer(state, action) {
  switch (action.type) {
    case 'login':
      return { ...state, currentUserId: action.userId, loggedIn: true, route: { name: 'dashboard', params: {} } };
    case 'logout':
      return { ...state, loggedIn: false, route: { name: 'login', params: {} } };
    case 'navigate':
      return { ...state, route: { name: action.name, params: action.params || {} } };
    case 'switch_role': {
      // Find first active user with that role
      const u = state.users.find(u => u.role === action.role && u.active);
      if (!u) return state;
      return { ...state, currentUserId: u.id };
    }
    case 'create_quotation': {
      const id = nextId(state.quotations);
      const quote_number = nextQuoteNumber(state.quotations);
      const user = state.users.find(u => u.id === state.currentUserId);
      const items = action.payload.items.map((it, i) => ({
        id: Date.now() + i,
        part_name: it.part_name,
        part_code: it.part_code || null,
        quantity: it.quantity,
        unit_price: null, total_price: null,
        labor_cost_compras: null, delivery_days: null, supplier_name: null,
        item_status: 'aguardando', notes: null,
      }));
      const q = {
        id, quote_number, status: 'pendente',
        customer_name: action.payload.customer_name,
        customer_phone: action.payload.customer_phone,
        vehicle: action.payload.vehicle,
        created_by_user_id: state.currentUserId,
        assigned_buyer_id: null,
        creator_name: user.name, buyer_name: null,
        notes_vendas: action.payload.notes_vendas || '',
        notes_compras: null,
        photo_path: action.payload.photo_path || null,
        customer_approved: null,
        whatsapp_sent_at: null,
        created_at: new Date().toISOString(),
        messages: [],
        items,
      };
      // Add a notification for compras users
      const buyers = state.users.filter(u => u.role === 'compras' && u.active);
      const notifs = buyers.map((b, i) => ({
        id: nextId(state.notifications) + i,
        user_id: b.id,
        type: 'nova_cotacao',
        title: `Nova cotação #${quote_number}`,
        message: `${user.name} abriu cotação — ${q.vehicle.model} ${q.vehicle.plate}`,
        read_at: null,
        quotation_id: id,
        created_at: q.created_at,
        time_label: 'agora',
      }));
      return {
        ...state,
        quotations: [q, ...state.quotations],
        notifications: [...notifs, ...state.notifications],
        toasts: [...state.toasts, { id: Date.now(), type: 'success', message: `Cotação ${quote_number} criada` }],
        route: { name: 'quotation-detail', params: { id } },
      };
    }
    case 'assign_quotation': {
      const user = state.users.find(u => u.id === state.currentUserId);
      const quotations = state.quotations.map(q =>
        q.id === action.id
          ? { ...q, status: 'em_cotacao', assigned_buyer_id: state.currentUserId, buyer_name: user.name, items: q.items.map(it => ({ ...it, item_status: 'em_cotacao' })) }
          : q
      );
      const q = quotations.find(x => x.id === action.id);
      const notif = {
        id: nextId(state.notifications),
        user_id: q.created_by_user_id,
        type: 'status_atualizado',
        title: `Cotação #${q.quote_number} em cotação`,
        message: `${user.name} assumiu sua cotação.`,
        read_at: null, quotation_id: q.id, created_at: new Date().toISOString(), time_label: 'agora',
      };
      return { ...state, quotations, notifications: [notif, ...state.notifications],
        toasts: [...state.toasts, { id: Date.now(), type: 'success', message: 'Cotação assumida' }] };
    }
    case 'respond_quotation': {
      const { id, items, notes_compras } = action.payload;
      const user = state.users.find(u => u.id === state.currentUserId);
      const quotations = state.quotations.map(q => {
        if (q.id !== id) return q;
        return {
          ...q, status: 'cotado',
          notes_compras: notes_compras || q.notes_compras,
          items: q.items.map(it => {
            const update = items.find(x => x.id === it.id);
            if (!update) return it;
            return {
              ...it,
              unit_price: Number(update.unit_price) || 0,
              total_price: (Number(update.unit_price) || 0) * (it.quantity || 1),
              labor_cost_compras: Number(update.labor_cost_compras) || 0,
              delivery_days: Number(update.delivery_days) || 0,
              supplier_name: update.supplier_name || null,
              notes: update.notes || null,
              item_status: 'cotado',
            };
          }),
        };
      });
      const q = quotations.find(x => x.id === id);
      const notif = {
        id: nextId(state.notifications),
        user_id: q.created_by_user_id,
        type: 'cotacao_respondida',
        title: `Cotação #${q.quote_number} respondida`,
        message: `${user.name} preencheu os valores.`,
        read_at: null, quotation_id: q.id, created_at: new Date().toISOString(), time_label: 'agora',
      };
      return { ...state, quotations, notifications: [notif, ...state.notifications],
        toasts: [...state.toasts, { id: Date.now(), type: 'success', message: 'Cotação respondida' }] };
    }
    case 'mark_arrived': {
      const quotations = state.quotations.map(q =>
        q.id === action.id ? { ...q, status: 'peca_chegou', items: q.items.map(it => ({ ...it, item_status: 'peca_chegou', arrived_at: new Date().toISOString() })) } : q
      );
      const q = quotations.find(x => x.id === action.id);
      const notif = {
        id: nextId(state.notifications),
        user_id: q.created_by_user_id,
        type: 'peca_chegou',
        title: `Peça chegou — Cotação #${q.quote_number}`,
        message: `Avise o cliente!`,
        read_at: null, quotation_id: q.id, created_at: new Date().toISOString(), time_label: 'agora',
      };
      return { ...state, quotations, notifications: [notif, ...state.notifications],
        toasts: [...state.toasts, { id: Date.now(), type: 'success', message: 'Marcado como peça chegou' }] };
    }
    case 'cancel_quotation':
      return {
        ...state,
        quotations: state.quotations.map(q => q.id === action.id ? { ...q, status: 'cancelado' } : q),
        toasts: [...state.toasts, { id: Date.now(), type: 'error', message: 'Cotação cancelada' }],
      };
    case 'customer_response':
      return {
        ...state,
        quotations: state.quotations.map(q => q.id === action.id ? { ...q, customer_approved: action.approved ? 1 : 0 } : q),
        toasts: [...state.toasts, { id: Date.now(), type: action.approved ? 'success' : 'error', message: action.approved ? 'Cliente aprovou' : 'Cliente recusou' }],
      };
    case 'send_whatsapp':
      return {
        ...state,
        quotations: state.quotations.map(q => q.id === action.id ? { ...q, whatsapp_sent_at: new Date().toISOString() } : q),
        toasts: [...state.toasts, { id: Date.now(), type: 'success', message: 'Mensagem enviada via WhatsApp' }],
      };
    case 'whatsapp_connect':
      return {
        ...state,
        users: state.users.map(u => u.id === action.userId
          ? { ...u, whatsapp_connected: true, whatsapp_instance: `cotou-user-${action.userId}` }
          : u
        ),
      };
    case 'whatsapp_disconnect':
      return {
        ...state,
        users: state.users.map(u => u.id === action.userId
          ? { ...u, whatsapp_connected: false, whatsapp_instance: null }
          : u
        ),
      };
    case 'mark_notification_read':
      return {
        ...state,
        notifications: state.notifications.map(n => n.id === action.id ? { ...n, read_at: new Date().toISOString() } : n),
      };
    case 'mark_all_read':
      return {
        ...state,
        notifications: state.notifications.map(n => n.user_id === state.currentUserId ? { ...n, read_at: n.read_at || new Date().toISOString() } : n),
      };
    case 'add_part':
      return { ...state, parts: [{ id: nextId(state.parts), ...action.payload }, ...state.parts],
        toasts: [...state.toasts, { id: Date.now(), type: 'success', message: 'Peça adicionada ao catálogo' }] };
    case 'update_part':
      return { ...state, parts: state.parts.map(p => p.id === action.id ? { ...p, ...action.payload } : p),
        toasts: [...state.toasts, { id: Date.now(), type: 'success', message: 'Peça atualizada' }] };
    case 'delete_part':
      return { ...state, parts: state.parts.filter(p => p.id !== action.id),
        toasts: [...state.toasts, { id: Date.now(), type: 'error', message: 'Peça removida' }] };
    case 'add_user':
      return { ...state, users: [{ id: nextId(state.users), active: true, created_at: new Date().toISOString(), ...action.payload }, ...state.users],
        toasts: [...state.toasts, { id: Date.now(), type: 'success', message: 'Usuário criado' }] };
    case 'update_user':
      return { ...state, users: state.users.map(u => u.id === action.id ? { ...u, ...action.payload } : u),
        toasts: [...state.toasts, { id: Date.now(), type: 'success', message: 'Usuário atualizado' }] };
    case 'toggle_user_active':
      return { ...state, users: state.users.map(u => u.id === action.id ? { ...u, active: !u.active } : u) };
    case 'toast':
      return { ...state, toasts: [...state.toasts, { id: Date.now(), type: action.tone || 'info', message: action.message }] };
    case 'dismiss_toast':
      return { ...state, toasts: state.toasts.filter(t => t.id !== action.id) };
    case 'send_message': {
      const { quotationId, text } = action;
      const qt = state.quotations.find(q => q.id === quotationId);
      const sender = state.users.find(u => u.id === state.currentUserId);
      const newMsg = { id: Date.now(), from: state.currentUserId, text, ts: new Date().toISOString() };
      const otherUserId = sender.role === 'vendas' ? qt.assigned_buyer_id : qt.created_by_user_id;
      const notif = otherUserId ? {
        id: nextId(state.notifications),
        user_id: otherUserId,
        type: 'nova_mensagem',
        title: `Nova mensagem em ${qt.quote_number}`,
        message: `${sender.name}: ${text.length > 60 ? text.slice(0, 57) + '…' : text}`,
        read_at: null, quotation_id: quotationId,
        created_at: newMsg.ts, time_label: 'agora',
      } : null;
      return {
        ...state,
        quotations: state.quotations.map(q =>
          q.id === quotationId ? { ...q, messages: [...(q.messages || []), newMsg] } : q
        ),
        notifications: notif ? [notif, ...state.notifications] : state.notifications,
      };
    }
    default:
      return state;
  }
}

function StoreProvider({ children }) {
  const [state, dispatch] = useReducer(reducer, initialState);
  const value = useMemo(() => {
    const currentUser = state.users.find(u => u.id === state.currentUserId);
    const myNotifs = state.notifications.filter(n => n.user_id === state.currentUserId);
    const unreadCount = myNotifs.filter(n => !n.read_at).length;
    return { state, dispatch, currentUser, myNotifs, unreadCount, calcTotals };
  }, [state]);
  return <StoreContext.Provider value={value}>{children}</StoreContext.Provider>;
}

function useStore() { return useContext(StoreContext); }

/* =========================================================
   Formatters
   ========================================================= */

const fmt = {
  brl: (v) => (v == null ? '—' : v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })),
  brlShort: (v) => (v == null ? '—' : 'R$ ' + Math.round(v).toLocaleString('pt-BR')),
  date: (iso) => {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' });
  },
  datetime: (iso) => {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
  },
  time: (iso) => {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  },
  ago: (iso) => {
    if (!iso) return '—';
    const diff = Date.now() - new Date(iso).getTime();
    const min = Math.floor(diff / 60000);
    if (min < 1) return 'agora';
    if (min < 60) return `${min}min`;
    const h = Math.floor(min / 60);
    if (h < 24) return `${h}h`;
    const d = Math.floor(h / 24);
    if (d < 30) return `${d}d`;
    return new Date(iso).toLocaleDateString('pt-BR');
  },
  phone: (p) => {
    if (!p) return '—';
    const s = String(p).replace(/\D/g, '');
    if (s.length === 11) return `(${s.slice(0,2)}) ${s.slice(2,7)}-${s.slice(7)}`;
    if (s.length === 10) return `(${s.slice(0,2)}) ${s.slice(2,6)}-${s.slice(6)}`;
    return p;
  },
  plate: (p) => p ? String(p).toUpperCase() : '—',
};

function plural(n, sing, plur) { return `${n} ${n === 1 ? sing : plur}`; }
window.plural = plural;

const STATUS_META = {
  pendente:    { label: 'Pendente',     icon: 'bi-hourglass-split', order: 0 },
  em_cotacao:  { label: 'Em cotação',   icon: 'bi-currency-exchange', order: 1 },
  cotado:      { label: 'Cotado',       icon: 'bi-check2-square', order: 2 },
  peca_chegou: { label: 'Peça chegou',  icon: 'bi-box-seam', order: 3 },
  cancelado:   { label: 'Cancelado',    icon: 'bi-x-circle', order: -1 },
};
const ROLE_META = {
  vendas:  { label: 'Vendas',  icon: 'bi-person-vcard' },
  compras: { label: 'Compras', icon: 'bi-bag-check' },
  admin:   { label: 'Admin',   icon: 'bi-shield-lock' },
};

Object.assign(window, {
  StoreProvider, useStore, fmt, STATUS_META, ROLE_META,
});

</script>
<script type="text/babel">
// COTOU — UI primitives
// Depends on React (global), uses CSS classes from styles.css

const { useState, useEffect, useRef, useCallback } = React;

/* =========================================================
   Button
   ========================================================= */
function Button({ variant = 'secondary', size, icon, iconRight, children, className = '', ...props }) {
  const cls = ['btn', `btn-${variant}`, size && `btn-${size}`, className].filter(Boolean).join(' ');
  return (
    <button className={cls} {...props}>
      {icon && <i className={`bi ${icon}`}></i>}
      {children}
      {iconRight && <i className={`bi ${iconRight}`}></i>}
    </button>
  );
}

/* =========================================================
   Badge / StatusBadge
   ========================================================= */
function Badge({ children, className = '', icon }) {
  return (
    <span className={`badge ${className}`}>
      {icon && <i className={`bi ${icon}`} style={{ fontSize: 11 }}></i>}
      {children}
    </span>
  );
}
function StatusBadge({ status }) {
  const meta = window.STATUS_META[status];
  if (!meta) return null;
  return (
    <span className={`badge badge-${status}`}>
      <span className="dot-sm"></span>
      {meta.label}
    </span>
  );
}
function RoleBadge({ role }) {
  const meta = window.ROLE_META[role];
  if (!meta) return null;
  return (
    <span className={`badge badge-role-${role}`}>
      <i className={`bi ${meta.icon}`} style={{ fontSize: 10 }}></i>
      {meta.label}
    </span>
  );
}

/* =========================================================
   Plate
   ========================================================= */
function Plate({ value }) {
  if (!value) return <span className="faint">—</span>;
  return <span className="plate">{String(value).toUpperCase()}</span>;
}

/* =========================================================
   Field
   ========================================================= */
function Field({ label, hint, children, error }) {
  return (
    <label className="field">
      {label && <span className="field-label">{label}</span>}
      {children}
      {hint && !error && <span className="field-hint">{hint}</span>}
      {error && <span className="field-hint" style={{ color: '#dc2626' }}>{error}</span>}
    </label>
  );
}

/* =========================================================
   Modal
   ========================================================= */
function Modal({ open, onClose, title, icon, children, footer, size }) {
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => e.key === 'Escape' && onClose && onClose();
    window.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => {
      window.removeEventListener('keydown', onKey);
      document.body.style.overflow = '';
    };
  }, [open, onClose]);
  if (!open) return null;
  return ReactDOM.createPortal(
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={size === 'lg' ? { maxWidth: 960 } : null} onClick={e => e.stopPropagation()}>
        {title && (
          <div className="modal-head">
            {icon && <i className={`bi ${icon}`} style={{ fontSize: 18, color: 'var(--text-muted)' }}></i>}
            <h3>{title}</h3>
            <button className="icon-btn" onClick={onClose} style={{ marginLeft: 'auto' }}>
              <i className="bi bi-x-lg" style={{ fontSize: 14 }}></i>
            </button>
          </div>
        )}
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>,
    document.body
  );
}

/* =========================================================
   Toasts
   ========================================================= */
function Toasts() {
  const { state, dispatch } = useStore();
  useEffect(() => {
    const timers = state.toasts.map(t => setTimeout(() => dispatch({ type: 'dismiss_toast', id: t.id }), 3200));
    return () => timers.forEach(clearTimeout);
  }, [state.toasts]);
  if (!state.toasts.length) return null;
  return (
    <div className="toast-host">
      {state.toasts.map(t => (
        <div key={t.id} className={`toast ${t.type}`}>
          <i className={`bi ${t.type === 'success' ? 'bi-check-circle-fill' : t.type === 'error' ? 'bi-exclamation-circle-fill' : 'bi-info-circle-fill'}`} style={{ color: t.type === 'success' ? '#16a34a' : t.type === 'error' ? '#dc2626' : 'var(--text-muted)' }}></i>
          <span>{t.message}</span>
        </div>
      ))}
    </div>
  );
}

/* =========================================================
   Empty state
   ========================================================= */
function EmptyState({ icon = 'bi-inbox', title, message, action }) {
  return (
    <div className="empty">
      <i className={`bi ${icon}`}></i>
      <div style={{ fontSize: 14, fontWeight: 600, color: 'var(--text-muted)' }}>{title}</div>
      {message && <div style={{ fontSize: 12.5, marginTop: 4 }}>{message}</div>}
      {action && <div style={{ marginTop: 16 }}>{action}</div>}
    </div>
  );
}

/* =========================================================
   Timeline (cotação lifecycle)
   ========================================================= */
function StatusTimeline({ quotation }) {
  if (quotation.status === 'cancelado') {
    return (
      <div className="row" style={{ padding: 12, background: 'var(--st-cancelado-bg)', borderRadius: 'var(--r-md)', color: 'var(--st-cancelado)' }}>
        <i className="bi bi-x-circle"></i>
        <span className="semibold">Cotação cancelada</span>
      </div>
    );
  }
  const order = ['pendente', 'em_cotacao', 'cotado', 'peca_chegou'];
  const currentIdx = order.indexOf(quotation.status);
  return (
    <div className="timeline">
      {order.map((s, idx) => {
        const meta = STATUS_META[s];
        const isDone = idx < currentIdx;
        const isCurrent = idx === currentIdx;
        return (
          <div key={s} className={`timeline-step ${isDone ? 'done' : ''} ${isCurrent ? 'current' : ''}`}>
            <span className="timeline-dot">
              {isDone ? <i className="bi bi-check2"></i> : <i className={`bi ${meta.icon}`}></i>}
            </span>
            <div className="timeline-label">{meta.label}</div>
            <div className="timeline-sub">
              {idx === 0 && fmt.date(quotation.created_at)}
              {idx === 1 && quotation.buyer_name && (currentIdx >= 1 ? quotation.buyer_name : '—')}
              {idx === 2 && currentIdx >= 2 && '✓'}
              {idx === 3 && currentIdx >= 3 && '✓'}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* =========================================================
   Autocomplete
   ========================================================= */
function PartAutocomplete({ value, onChange, onPick, placeholder = 'Buscar peça por nome ou código…' }) {
  const { state } = useStore();
  const [open, setOpen] = useState(false);
  const [hl, setHl] = useState(0);
  const ref = useRef(null);
  useEffect(() => {
    const onDown = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', onDown);
    return () => document.removeEventListener('mousedown', onDown);
  }, []);
  const q = (value || '').toLowerCase().trim();
  const matches = q.length >= 1
    ? state.parts.filter(p => p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q)).slice(0, 8)
    : [];
  return (
    <div ref={ref} style={{ position: 'relative' }}>
      <div className="input-group">
        <i className="bi bi-search input-icon"></i>
        <input
          className="input"
          value={value || ''}
          onChange={e => { onChange(e.target.value); setOpen(true); setHl(0); }}
          onFocus={() => setOpen(true)}
          onKeyDown={e => {
            if (!open) return;
            if (e.key === 'ArrowDown') { setHl(h => Math.min(h + 1, matches.length - 1)); e.preventDefault(); }
            if (e.key === 'ArrowUp') { setHl(h => Math.max(h - 1, 0)); e.preventDefault(); }
            if (e.key === 'Enter' && matches[hl]) { onPick(matches[hl]); setOpen(false); e.preventDefault(); }
            if (e.key === 'Escape') setOpen(false);
          }}
          placeholder={placeholder}
        />
      </div>
      {open && matches.length > 0 && (
        <div className="autocomplete scrollbar-thin">
          {matches.map((p, i) => (
            <div
              key={p.id}
              className={`autocomplete-item ${i === hl ? 'hl' : ''}`}
              onMouseDown={(e) => { e.preventDefault(); onPick(p); setOpen(false); }}
              onMouseEnter={() => setHl(i)}
            >
              <i className="bi bi-gear-fill" style={{ color: 'var(--text-faint)' }}></i>
              <div style={{ flex: 1 }}>
                <div className="semibold">{p.name}</div>
                <div className="faint tiny">
                  <span className="code">{p.code}</span> · {p.category} · {fmt.brl(p.default_price)}
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* =========================================================
   Confirm dialog
   ========================================================= */
function ConfirmDialog({ open, onClose, title, message, confirmLabel = 'Confirmar', tone = 'primary', onConfirm }) {
  return (
    <Modal
      open={open}
      onClose={onClose}
      title={title}
      icon="bi-question-circle"
      footer={
        <>
          <Button variant="ghost" onClick={onClose}>Cancelar</Button>
          <Button variant={tone === 'danger' ? 'danger' : 'primary'} onClick={onConfirm}>{confirmLabel}</Button>
        </>
      }
    >
      <div style={{ fontSize: 14, color: 'var(--text-muted)' }}>{message}</div>
    </Modal>
  );
}

Object.assign(window, {
  Button, Badge, StatusBadge, RoleBadge, Plate, Field, Modal, Toasts,
  EmptyState, StatusTimeline, PartAutocomplete, ConfirmDialog,
});

</script>

// COTOU — Quotation screens (list, detail, new)

const { useState, useEffect, useMemo, useRef } = React;

/* =========================================================
   Quotations list
   ========================================================= */
function QuotationsList() {
  const { state, dispatch, currentUser } = useStore();
  const [filter, setFilter] = useState(state.route.params.filter || 'todos');
  const [q, setQ] = useState('');
  const [sortKey, setSortKey] = useState('created_at');
  const [sortDir, setSortDir] = useState('desc');
  const toggleSort = (key) => {
    if (sortKey === key) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortKey(key); setSortDir('desc'); }
  };
  const sortIcon = (key) => sortKey === key ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '';

  useEffect(() => {
    if (state.route.params.filter) setFilter(state.route.params.filter);
  }, [state.route.params.filter]);

  // Vendas only sees own quotations
  let list = currentUser.role === 'vendas'
    ? state.quotations.filter(x => x.created_by_user_id === currentUser.id)
    : state.quotations;

  if (filter !== 'todos') list = list.filter(x => x.status === filter);
  if (q.trim()) {
    const needle = q.toLowerCase();
    list = list.filter(x =>
      x.quote_number.toLowerCase().includes(needle) ||
      x.customer_name.toLowerCase().includes(needle) ||
      x.vehicle.plate.toLowerCase().includes(needle) ||
      x.vehicle.model.toLowerCase().includes(needle)
    );
  }
  list = [...list].sort((a, b) => {
    const dir = sortDir === 'asc' ? 1 : -1;
    const av = sortKey === 'total' ? calcTotals(a.items).grandTotal : a[sortKey];
    const bv = sortKey === 'total' ? calcTotals(b.items).grandTotal : b[sortKey];
    if (av == null) return dir;
    if (bv == null) return -dir;
    return av > bv ? dir : av < bv ? -dir : 0;
  });

  const counts = useMemo(() => {
    const base = currentUser.role === 'vendas'
      ? state.quotations.filter(x => x.created_by_user_id === currentUser.id)
      : state.quotations;
    const map = { todos: base.length };
    ['pendente', 'em_cotacao', 'cotado', 'peca_chegou', 'cancelado'].forEach(s => {
      map[s] = base.filter(x => x.status === s).length;
    });
    return map;
  }, [state.quotations, currentUser]);

  return (
    <div className="page">
      <div className="page-head">
        <div>
          <h2 className="page-title">Cotações</h2>
          <p className="page-sub">
            {currentUser.role === 'vendas' ? 'Suas cotações abertas' : 'Todas as cotações em fluxo'}
          </p>
        </div>
        <div className="row" style={{ gap: 8 }}>
          <div style={{ position: 'relative' }}>
            <i className="bi bi-search" style={{ position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)', color: 'var(--text-faint)', fontSize: 13 }}></i>
            <input className="input" placeholder="Buscar #, cliente, placa…" value={q} onChange={e => setQ(e.target.value)} style={{ width: 280, paddingLeft: 34 }} />
          </div>
          {(currentUser.role === 'vendas' || currentUser.role === 'admin') && (
            <Button variant="primary" icon="bi-plus-lg" onClick={() => dispatch({ type: 'navigate', name: 'new-quotation' })}>
              Nova cotação
            </Button>
          )}
        </div>
      </div>

      {/* Status tabs */}
      <div className="card" style={{ marginBottom: 16, overflow: 'visible' }}>
        <div style={{ padding: '12px 16px', display: 'flex', gap: 6, flexWrap: 'wrap', alignItems: 'center' }}>
          {[
            { k: 'todos', label: 'Todas' },
            { k: 'pendente', label: 'Pendentes' },
            { k: 'em_cotacao', label: 'Em cotação' },
            { k: 'cotado', label: 'Cotadas' },
            { k: 'peca_chegou', label: 'Peça chegou' },
            { k: 'cancelado', label: 'Canceladas' },
          ].map(tab => (
            <button
              key={tab.k}
              className={`btn ${filter === tab.k ? 'btn-primary' : 'btn-ghost'} btn-sm`}
              onClick={() => setFilter(tab.k)}
            >
              {tab.label}
              <span style={{
                background: filter === tab.k ? 'rgba(255,255,255,0.22)' : 'var(--surface-2)',
                color: filter === tab.k ? '#fff' : 'var(--text-muted)',
                padding: '0 6px', borderRadius: 99, fontSize: 11, fontWeight: 700, marginLeft: 2,
              }}>{counts[tab.k] || 0}</span>
            </button>
          ))}
        </div>
      </div>

      {/* Table */}
      <div className="card">
        {list.length === 0 ? (
          <EmptyState
            icon="bi-inbox"
            title="Nenhuma cotação encontrada"
            message="Tente outro filtro ou abra uma nova cotação."
          />
        ) : (
          <table className="tbl">
            <thead>
              <tr>
                <th style={{ width: 130, cursor: 'pointer' }} onClick={() => toggleSort('quote_number')}>Número{sortIcon('quote_number')}</th>
                <th style={{ cursor: 'pointer' }} onClick={() => toggleSort('customer_name')}>Cliente{sortIcon('customer_name')}</th>
                <th>Veículo</th>
                <th>Itens</th>
                <th style={{ cursor: 'pointer' }} onClick={() => toggleSort('total')}>Total{sortIcon('total')}</th>
                <th style={{ cursor: 'pointer' }} onClick={() => toggleSort('created_at')}>Aberta em{sortIcon('created_at')}</th>
                <th style={{ cursor: 'pointer' }} onClick={() => toggleSort('status')}>Status{sortIcon('status')}</th>
                <th style={{ width: 44 }}></th>
              </tr>
            </thead>
            <tbody>
              {list.map(qt => {
                const totals = calcTotals(qt.items);
                return (
                  <tr
                    key={qt.id}
                    className="clickable"
                    onClick={() => dispatch({ type: 'navigate', name: 'quotation-detail', params: { id: qt.id } })}
                  >
                    <td><span className="mono semibold" style={{ fontSize: 12 }}>{qt.quote_number}</span></td>
                    <td>
                      <div className="semibold">{qt.customer_name}</div>
                      <div className="tiny faint mono">{fmt.phone(qt.customer_phone)}</div>
                    </td>
                    <td>
                      <Plate value={qt.vehicle.plate} />
                      <div className="tiny faint" style={{ marginTop: 3 }}>{qt.vehicle.make} {qt.vehicle.model}</div>
                    </td>
                    <td><span className="mono">{qt.items.length}</span></td>
                    <td><span className="mono semibold">{totals.grandTotal > 0 ? fmt.brl(totals.grandTotal) : <span className="faint">—</span>}</span></td>
                    <td><span className="tiny mono faint">{fmt.datetime(qt.created_at)}</span></td>
                    <td><StatusBadge status={qt.status} /></td>
                    <td><i className="bi bi-chevron-right faint"></i></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

/* =========================================================

              <MetaRow label="Comprador" value={qt.buyer_name || '—'} />
              <MetaRow label="Criada" value={fmt.datetime(qt.created_at)} mono />
              {qt.whatsapp_sent_at && (
                <MetaRow label="WhatsApp" value={fmt.datetime(qt.whatsapp_sent_at)} mono icon="bi-whatsapp" iconColor="#16a34a" />

          {/* Photo — compact thumbnail (max 80px height) */}
          <div className="card">
            <div className="card-head" style={{ paddingBottom: 8 }}>
              <i className="bi bi-image" style={{ color: 'var(--text-muted)', fontSize: 13 }}></i>
              <h3>Foto da peça</h3>

            <div style={{ padding: '0 14px 14px' }}>

          <ChatPanel quotation={qt} />
        </div>
      </div>

      {respondOpen && <RespondModal quotation={qt} onClose={() => setRespondOpen(false)} />}
      <ConfirmDialog
        open={cancelOpen}
        onClose={() => setCancelOpen(false)}
        title="Cancelar cotação?"
        message={`A cotação ${qt.quote_number} será marcada como cancelada. Esta ação pode ser auditada posteriormente.`}
        confirmLabel="Sim, cancelar"
        tone="danger"
        onConfirm={() => { dispatch({ type: 'cancel_quotation', id: qt.id }); setCancelOpen(false); }}
      />
      {waOpen && <WhatsAppModal quotation={qt} onClose={() => setWaOpen(false)} />}
    </div>
  );
}

function MetaRow({ label, value, mono, icon, iconColor }) {
  return (
    <div className="row between">
      <span className="tiny faint" style={{ textTransform: 'uppercase', letterSpacing: '0.06em' }}>{label}</span>
      <span className={`small ${mono ? 'mono' : 'semibold'}`} style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
        {icon && <i className={`bi ${icon}`} style={{ color: iconColor || 'var(--text-muted)', fontSize: 12 }}></i>}
        {value}
      </span>
    </div>
  );
}

/* =========================================================
   Chat panel — collapsible
   ========================================================= */
function ChatPanel({ quotation }) {
  const { state, dispatch } = useStore();
  const [text, setText] = useState('');
  const [collapsed, setCollapsed] = useState((quotation.messages || []).length === 0);
  const bottomRef = React.useRef(null);
  const me = state.users.find(u => u.id === state.currentUserId);
  const messages = quotation.messages || [];

  React.useEffect(() => {
    if (!collapsed) bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages.length, collapsed]);

  function send() {
    const t = text.trim();
    if (!t) return;
    dispatch({ type: 'send_message', quotationId: quotation.id, text: t });
    setText('');
    setCollapsed(false);
  }

  function getUserName(id) {
    return state.users.find(u => u.id === id)?.name || 'Desconhecido';
  }

  return (
    <div className="card" style={{ padding: 0, overflow: 'hidden' }}>
      <button
        type="button"
        style={{ width: '100%', background: 'none', border: 'none', padding: '12px 16px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 8, fontFamily: 'inherit', textAlign: 'left' }}
        onClick={() => setCollapsed(c => !c)}
      >
        <i className="bi bi-chat-dots" style={{ color: 'var(--brand)', fontSize: 14 }}></i>
        <span style={{ fontWeight: 600, fontSize: 13, color: 'var(--text)' }}>Chat interno</span>
        {messages.length > 0 && (
          <span className="badge" style={{ fontSize: 10, marginLeft: 2 }}>{messages.length}</span>
        )}
        <i className={`bi bi-chevron-${collapsed ? 'down' : 'up'}`} style={{ marginLeft: 'auto', fontSize: 11, color: 'var(--text-faint)' }}></i>
      </button>
      {!collapsed && (
        <>
          <div style={{ borderTop: '1px solid var(--border)', overflowY: 'auto', maxHeight: 220, padding: '10px 14px', display: 'flex', flexDirection: 'column', gap: 10 }}>
            {messages.length === 0 && (
              <div className="tiny faint" style={{ textAlign: 'center', padding: '14px 0' }}>Nenhuma mensagem ainda.</div>
            )}
            {messages.map(msg => {
              const mine = msg.from === me.id;
              return (
                <div key={msg.id} style={{ display: 'flex', flexDirection: 'column', alignItems: mine ? 'flex-end' : 'flex-start' }}>
                  <div className="tiny faint" style={{ marginBottom: 3 }}>{mine ? 'Você' : getUserName(msg.from)}</div>
                  <div style={{
                    background: mine ? 'var(--brand)' : 'var(--surface-2)',
                    color: mine ? 'var(--brand-text)' : 'var(--text)',
                    borderRadius: mine ? '12px 12px 2px 12px' : '12px 12px 12px 2px',
                    padding: '6px 11px', fontSize: 12.5, maxWidth: '88%', wordBreak: 'break-word', lineHeight: 1.45,
                  }}>
                    {msg.text}
                  </div>
                  <div className="tiny faint" style={{ marginTop: 3 }}>{fmt.time(msg.ts)}</div>
                </div>
              );
            })}
            <div ref={bottomRef} />
          </div>
          <div style={{ padding: '8px 12px', borderTop: '1px solid var(--border)', display: 'flex', gap: 8 }}>
            <input
              className="input"
              style={{ flex: 1, fontSize: 13 }}
              placeholder="Mensagem… (Enter)"
              value={text}
              onChange={e => setText(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }}
            />
            <Button variant="primary" icon="bi-send" onClick={send} disabled={!text.trim()} />
          </div>
        </>
      )}
    </div>
  );
}
