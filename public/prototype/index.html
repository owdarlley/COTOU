<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COTOU — ERP Autopeças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
:root {
  /* Brand — defaults; tweakable */
  --brand: #2563eb;
  --brand-hover: #1d4ed8;
  --brand-soft: #dbeafe;
  --brand-text: #ffffff;

  /* Neutrals — light */
  --bg: #f6f6f4;
  --bg-page: #fafaf8;
  --surface: #ffffff;
  --surface-2: #f4f4f1;
  --surface-3: #ebebe6;
  --border: #e3e3dd;
  --border-strong: #cfcfc8;
  --text: #0a0a0a;
  --text-muted: #595959;
  --text-faint: #8a8a85;
  --shadow-sm: 0 1px 0 rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px -8px rgba(0,0,0,0.08);
  --shadow-lg: 0 24px 60px -24px rgba(0,0,0,0.20);

  /* Status */
  --st-pendente: #b45309;
  --st-pendente-bg: #fef3c7;
  --st-em-cotacao: #1d4ed8;
  --st-em-cotacao-bg: #dbeafe;
  --st-cotado: #047857;
  --st-cotado-bg: #d1fae5;
  --st-peca: #6d28d9;
  --st-peca-bg: #ede9fe;
  --st-cancelado: #57534e;
  --st-cancelado-bg: #e7e5e4;

  /* Fonts */
  --sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --mono: 'DM Mono', ui-monospace, monospace;

  /* Radii */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 20px;

  /* Semantic / utility colors */
  --error:    #dc2626;
  --success:  #16a34a;
  --warning:  #f59e0b;
  --whatsapp: #25d366;
  --wa-bubble: #dcf8c6;
  --wa-bg:     #e5ddd5;
}

[data-theme="dark"] {
  --bg: #0a0a0a;
  --bg-page: #050505;
  --surface: #131313;
  --surface-2: #1a1a1a;
  --surface-3: #242424;
  --border: #2a2a2a;
  --border-strong: #3a3a3a;
  --text: #f5f5f3;
  --text-muted: #a0a09a;
  --text-faint: #6e6e68;
  --brand-soft: #2a1414;
  --shadow-sm: 0 1px 0 rgba(0,0,0,0.4);
  --shadow-md: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -8px rgba(0,0,0,0.6);
  --shadow-lg: 0 24px 60px -24px rgba(0,0,0,0.8);

  --st-pendente: #fbbf24;
  --st-pendente-bg: #422006;
  --st-em-cotacao: #60a5fa;
  --st-em-cotacao-bg: #0c1e3f;
  --st-cotado: #34d399;
  --st-cotado-bg: #042f1f;
  --st-peca: #a78bfa;
  --st-peca-bg: #1e1339;
  --st-cancelado: #a8a29e;
  --st-cancelado-bg: #1c1917;

  --wa-bubble: #005c4b;
  --wa-bg:     #0b141a;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "ss01", "ss02", "cv01";
  font-size: 14px;
  line-height: 1.5;
}
button { font-family: inherit; }
input, textarea, select { font-family: inherit; color: inherit; }
a { color: inherit; }
.mono { font-family: var(--mono); font-feature-settings: "zero" 1; }

/* =========================================================
   App layout
   ========================================================= */

.app-root {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: 100vh;
  overflow-x: clip;
}

.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
}

.sidebar-brand {
  height: 56px;
  padding: 0 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sidebar-brand-mark {
  width: 32px; height: 32px;
  background: var(--brand);
  color: var(--brand-text);
  border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  box-shadow: var(--shadow-sm);
}
.sidebar-brand-wm {
  font-weight: 700;
  font-size: 18px;
  letter-spacing: -0.02em;
  line-height: 1;
}
.sidebar-brand-sub {
  font-size: 9.5px;
  letter-spacing: 0.12em;
  color: var(--text-faint);
  text-transform: uppercase;
  margin-top: 3px;
  font-family: var(--mono);
  font-weight: 500;
}

.sidebar-nav { padding: 6px 8px; flex: 1; overflow-y: auto; min-height: 0; }
.sidebar-section {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-faint);
  padding: 8px 8px 4px;
  font-family: var(--mono);
  font-weight: 500;
}

.nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 6px 8px;
  border-radius: var(--r-sm);
  background: none;
  border: 0;
  cursor: pointer;
  text-align: left;
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 500;
  transition: background 120ms, color 120ms;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active {
  background: var(--surface-2);
  color: var(--text);
}
.nav-item.active .nav-icon { color: var(--brand); }
.nav-icon { font-size: 15px; width: 18px; text-align: center; color: var(--text-faint); }
.nav-badge {
  margin-left: auto;
  background: var(--brand);
  color: var(--brand-text);
  font-size: 10.5px;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: 99px;
  min-width: 18px;
  text-align: center;
}

.sidebar-user {
  padding: 8px 10px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.avatar {
  width: 32px; height: 32px;
  background: var(--surface-3);
  color: var(--text);
  border-radius: 99px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
  font-size: 12px;
  flex-shrink: 0;
}
.avatar.brand { background: var(--brand); color: var(--brand-text); }

/* =========================================================
   Topbar
   ========================================================= */

.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 65px;
  padding: 0 28px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 30;
}
.topbar h1 {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0;
}
.topbar-search {
  position: relative;
  margin-left: 16px;
  flex: 1;
  max-width: 420px;
}
.topbar-search input {
  width: 100%;
  padding: 8px 12px 8px 34px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: var(--r-md);
  font-size: 13px;
  color: var(--text);
  outline: none;
  transition: border-color 120ms, background 120ms;
}
.topbar-search input:focus { border-color: var(--brand); background: var(--surface); }
.topbar-search .bi-search {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-faint);
}
.topbar-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.icon-btn {
  width: 36px; height: 36px;
  border-radius: var(--r-md);
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px;
  position: relative;
  transition: background 120ms, color 120ms;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn .dot {
  position: absolute;
  top: 8px; right: 9px;
  width: 8px; height: 8px;
  border-radius: 99px;
  background: var(--brand);
  border: 2px solid var(--surface);
}
.icon-btn .dot::after {
  content: '';
  position: absolute; inset: -4px;
  border-radius: 99px;
  background: var(--brand);
  opacity: 0.35;
  animation: pulse 1.6s ease-out infinite;
}
@keyframes pulse {
  0% { transform: scale(0.6); opacity: 0.5; }
  100% { transform: scale(1.8); opacity: 0; }
}
@keyframes bellRing {
  0%,100% { transform: rotate(0deg); }
  15%     { transform: rotate(18deg); }
  35%     { transform: rotate(-16deg); }
  55%     { transform: rotate(12deg); }
  75%     { transform: rotate(-8deg); }
  90%     { transform: rotate(4deg); }
}
.bell-ring { animation: bellRing 0.7s ease-in-out; color: var(--brand) !important; }
.notif-count-badge {
  position: absolute;
  top: 3px; right: 3px;
  min-width: 17px; height: 17px;
  padding: 0 4px;
  border-radius: 99px;
  background: #dc2626;
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--surface);
  line-height: 1;
  pointer-events: none;
}

/* =========================================================
   Page container
   ========================================================= */

.page {
  padding: 28px 28px 80px;
  max-width: 1400px;
  margin: 0 auto;
}
.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 24px;
}
.page-title {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0 0 4px;
  line-height: 1.1;
}
.page-sub {
  color: var(--text-muted);
  font-size: 13.5px;
  margin: 0;
}

/* =========================================================
   Card
   ========================================================= */

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
}
.card-pad { padding: 20px; }
.card-head {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
.card-head h3 {
  margin: 0;
  font-size: 14.5px;
  font-weight: 600;
  letter-spacing: -0.005em;
}

/* =========================================================
   Buttons
   ========================================================= */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 14px;
  border-radius: var(--r-md);
  font-weight: 600;
  font-size: 13px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: background 120ms, border-color 120ms, color 120ms, transform 80ms;
  text-decoration: none;
  white-space: nowrap;
  line-height: 1.2;
}
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: var(--brand);
  color: var(--brand-text);
}
.btn-primary:hover { background: var(--brand-hover); }
.btn-secondary {
  background: var(--surface);
  color: var(--text);
  border-color: var(--border-strong);
}
.btn-secondary:hover { background: var(--surface-2); }
.btn-ghost {
  background: transparent;
  color: var(--text);
}
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger {
  background: var(--surface);
  color: #b91c1c;
  border-color: var(--border-strong);
}
.btn-danger:hover { background: #fef2f2; border-color: #fecaca; }
[data-theme="dark"] .btn-danger { color: #fca5a5; }
[data-theme="dark"] .btn-danger:hover { background: #2a1414; border-color: #4a1717; }
.btn-whatsapp {
  background: #16a34a;
  color: #fff;
}
.btn-whatsapp:hover { background: #15803d; }

.btn-lg { padding: 11px 18px; font-size: 14px; }
.btn-sm { padding: 5px 9px; font-size: 12px; gap: 4px; }
.btn-icon { padding: 8px; width: 34px; height: 34px; }

/* =========================================================
   Inputs
   ========================================================= */

.field { display: flex; flex-direction: column; gap: 6px; }
.field-label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.field-hint { font-size: 12px; color: var(--text-faint); }
.input, .textarea, .select {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  padding: 9px 12px;
  border-radius: var(--r-md);
  font-size: 13.5px;
  color: var(--text);
  outline: none;
  transition: border-color 120ms, box-shadow 120ms;
  width: 100%;
}
.input:focus, .textarea:focus, .select:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-soft);
}
.input.mono { font-family: var(--mono); letter-spacing: 0.04em; }
.textarea { resize: vertical; min-height: 80px; }
.select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-faint) 50%), linear-gradient(135deg, var(--text-faint) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
.input-group { position: relative; }
.input-group .input { padding-left: 36px; }
.input-group .input-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-faint);
  font-size: 14px;
  pointer-events: none;
}

/* =========================================================
   Badges
   ========================================================= */

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.01em;
  background: var(--surface-2);
  color: var(--text-muted);
  white-space: nowrap;
  line-height: 1.4;
}
.badge .dot-sm {
  width: 6px; height: 6px;
  border-radius: 99px;
  background: currentColor;
}
.badge-pendente { background: var(--st-pendente-bg); color: var(--st-pendente); }
.badge-em_cotacao { background: var(--st-em-cotacao-bg); color: var(--st-em-cotacao); }
.badge-cotado { background: var(--st-cotado-bg); color: var(--st-cotado); }
.badge-peca_chegou { background: var(--st-peca-bg); color: var(--st-peca); }
.badge-cancelado { background: var(--st-cancelado-bg); color: var(--st-cancelado); }
.badge-role-vendas { background: #dbeafe; color: #1d4ed8; }
.badge-role-compras { background: #d1fae5; color: #047857; }
.badge-role-admin { background: #ede9fe; color: #6d28d9; }
[data-theme="dark"] .badge-role-vendas { background: #0c1e3f; color: #93c5fd; }
[data-theme="dark"] .badge-role-compras { background: #042f1f; color: #6ee7b7; }
[data-theme="dark"] .badge-role-admin { background: #1e1339; color: #c4b5fd; }

/* =========================================================
   Tables
   ========================================================= */

.tbl {
  width: 100%;
  border-collapse: collapse;
}
.tbl thead th {
  text-align: left;
  padding: 11px 16px;
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-faint);
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  font-family: var(--mono);
  background: var(--surface-2);
}
.tbl tbody td {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 13.5px;
  vertical-align: middle;
}
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr.clickable { cursor: pointer; transition: background 120ms; }
.tbl tbody tr.clickable:hover { background: var(--surface-2); }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

.plate {
  display: inline-flex;
  align-items: center;
  font-family: var(--mono);
  font-weight: 700;
  letter-spacing: 0.08em;
  font-size: 12px;
  padding: 3px 8px;
  border: 1.5px solid var(--text);
  border-radius: 4px;
  background: var(--surface);
  white-space: nowrap;
}

/* =========================================================
   KPI / Stat cards
   ========================================================= */

.stat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 18px 20px;
  position: relative;
  overflow: hidden;
}
.stat-label {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-faint);
  font-family: var(--mono);
  font-weight: 600;
}
.stat-value {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.025em;
  margin-top: 4px;
  line-height: 1.05;
}
.stat-delta {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 6px;
  display: flex; align-items: center; gap: 4px;
}
.stat-delta.up { color: #047857; }
.stat-delta.down { color: #b91c1c; }
[data-theme="dark"] .stat-delta.up { color: #34d399; }
[data-theme="dark"] .stat-delta.down { color: #fca5a5; }
.stat-icon {
  position: absolute;
  right: 16px;
  top: 16px;
  width: 32px; height: 32px;
  border-radius: var(--r-md);
  background: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  color: var(--text-muted);
}

/* =========================================================
   Timeline (status)
   ========================================================= */

.timeline { display: flex; align-items: flex-start; position: relative; padding: 8px 0; }
.timeline-step { flex: 1; text-align: center; position: relative; }
.timeline-step::before {
  content: '';
  position: absolute;
  top: 13px;
  left: 50%;
  width: 100%;
  height: 2px;
  background: var(--border);
  z-index: 0;
}
.timeline-step:last-child::before { display: none; }
.timeline-step.done::before { background: var(--brand); }
.timeline-dot {
  width: 28px; height: 28px;
  border-radius: 99px;
  background: var(--surface);
  border: 2px solid var(--border);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  color: var(--text-faint);
  position: relative;
  z-index: 1;
}
.timeline-step.done .timeline-dot {
  background: var(--brand);
  border-color: var(--brand);
  color: var(--brand-text);
}
.timeline-step.current .timeline-dot {
  border-color: var(--brand);
  color: var(--brand);
  background: var(--surface);
  box-shadow: 0 0 0 4px var(--brand-soft);
}
.timeline-label {
  margin-top: 8px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.timeline-step.done .timeline-label,
.timeline-step.current .timeline-label { color: var(--text); }
.timeline-sub {
  font-size: 11px;
  color: var(--text-faint);
  margin-top: 2px;
  font-family: var(--mono);
}

/* =========================================================
   Modal
   ========================================================= */

.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(10,10,10,0.45);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  animation: fadeIn 140ms ease-out;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  max-width: 720px;
  width: 100%;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-lg);
  animation: slideUp 200ms cubic-bezier(.2,.8,.2,1);
}
.modal-head {
  padding: 18px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
.modal-head h3 {
  margin: 0;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.modal-body { padding: 24px; overflow-y: auto; flex: 1; }
.modal-foot {
  padding: 14px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  background: var(--surface-2);
}
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }

/* =========================================================
   Dropdown / notifications
   ========================================================= */
.dropdown {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-md);
  width: 380px;
  max-width: calc(100vw - 24px);
  max-height: 480px;
  display: flex;
  flex-direction: column;
  z-index: 50;
  animation: slideUp 160ms cubic-bezier(.2,.8,.2,1);
}
.dropdown-head {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.dropdown-head strong { font-weight: 600; font-size: 14px; }
.dropdown-list { overflow-y: auto; flex: 1; }
.notif-item {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 12px;
  cursor: pointer;
  transition: background 120ms;
}
.notif-item:hover { background: var(--surface-2); }
.notif-item:last-child { border-bottom: 0; }
.notif-icon {
  width: 32px; height: 32px;
  border-radius: var(--r-md);
  background: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}
.notif-icon.unread { background: var(--brand-soft); color: var(--brand); }
.notif-title { font-size: 13px; font-weight: 600; }
.notif-msg { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
.notif-time { font-size: 11px; color: var(--text-faint); margin-top: 4px; font-family: var(--mono); }
.notif-unread-dot {
  width: 7px; height: 7px;
  border-radius: 99px;
  background: var(--brand);
  margin-top: 6px;
  flex-shrink: 0;
}

/* =========================================================
   Chart
   ========================================================= */

.chart-bar-grid {
  display: grid;
  grid-template-columns: repeat(14, 1fr);
  gap: 6px;
  align-items: end;
  height: 180px;
}
.chart-bar {
  background: var(--surface-3);
  border-radius: 4px 4px 0 0;
  position: relative;
  transition: background 200ms;
}
.chart-bar:hover { background: var(--brand); }
.chart-bar.alt { background: var(--brand); opacity: 0.85; }
.chart-bar-label {
  text-align: center;
  font-size: 10px;
  color: var(--text-faint);
  margin-top: 6px;
  font-family: var(--mono);
}
.chart-xrow {
  display: grid;
  grid-template-columns: repeat(14, 1fr);
  gap: 6px;
}

/* Donut / progress ring */
.ring { transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--surface-3); }
.ring-fg { fill: none; stroke: var(--brand); transition: stroke-dasharray 320ms; stroke-linecap: round; }

/* =========================================================
   Toast
   ========================================================= */

.toast-host { position: fixed; bottom: 24px; right: 24px; z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.toast {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 4px solid var(--brand);
  padding: 12px 14px;
  border-radius: var(--r-md);
  box-shadow: var(--shadow-md);
  min-width: 300px;
  max-width: 380px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  animation: slideInRight 240ms cubic-bezier(.2,.8,.2,1);
  font-size: 13px;
  position: relative;
}
.toast.success { border-left-color: #16a34a; }
.toast.error   { border-left-color: #dc2626; }
.toast.info    { border-left-color: var(--brand); }
.toast-clickable { cursor: pointer; }
.toast-clickable:hover { background: var(--surface-2); }
.toast-body { flex: 1; min-width: 0; }
.toast-title { font-weight: 600; line-height: 1.3; }
.toast-detail { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.35; }
.toast-action { font-size: 11px; color: var(--brand); font-weight: 700; margin-top: 5px; display: inline-block; }
.toast-close { background: none; border: none; cursor: pointer; color: var(--text-faint); padding: 0; line-height: 1; font-size: 15px; flex-shrink: 0; margin-top: 1px; }
.toast-close:hover { color: var(--text); }
.toast > i:first-child { font-size: 17px; flex-shrink: 0; margin-top: 1px; }
@keyframes slideInRight { from { transform: translateX(20px); opacity: 0 } to { transform: translateX(0); opacity: 1 } }

/* =========================================================
   Guided Tour (spotlight)
   ========================================================= */

.tour-overlay {
  position: fixed;
  inset: 0;
  z-index: 9000;
  cursor: pointer;
}
.tour-spotlight {
  position: fixed;
  z-index: 9001;
  pointer-events: none;
  border-radius: 10px;
  box-shadow: 0 0 0 4px var(--brand), 0 0 0 9999px rgba(0,0,0,0.58);
  transition: top 0.28s cubic-bezier(.4,0,.2,1),
              left 0.28s cubic-bezier(.4,0,.2,1),
              width 0.28s cubic-bezier(.4,0,.2,1),
              height 0.28s cubic-bezier(.4,0,.2,1);
}
.tour-tooltip {
  position: fixed;
  z-index: 9002;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg);
  width: 288px;
  padding: 20px 20px 16px;
  cursor: default;
  animation: tourIn 0.22s cubic-bezier(.4,0,.2,1);
}
@keyframes tourIn { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
.tour-arrow {
  position: absolute;
  width: 10px;
  height: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  transform: rotate(45deg);
}
.tour-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--brand-soft);
  color: var(--brand);
  border-radius: 99px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.03em;
  margin-bottom: 10px;
}
.tour-tooltip h3 {
  font-size: 14.5px;
  font-weight: 700;
  margin: 0 0 6px;
  color: var(--text);
  line-height: 1.3;
}
.tour-tooltip p {
  font-size: 12.5px;
  color: var(--text-muted);
  margin: 0 0 14px;
  line-height: 1.55;
}
.tour-dots {
  display: flex;
  gap: 5px;
  align-items: center;
}
.tour-dot {
  width: 6px;
  height: 6px;
  border-radius: 99px;
  background: var(--border-strong);
  transition: background 0.18s, width 0.18s;
  cursor: pointer;
  border: none;
  padding: 0;
}
.tour-dot.on { background: var(--brand); width: 16px; }
.tour-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 14px;
}
.tour-close {
  position: absolute;
  top: 10px; right: 10px;
  background: none; border: none; cursor: pointer;
  color: var(--text-faint); font-size: 13px; padding: 3px 5px;
  border-radius: 5px;
  line-height: 1;
}
.tour-close:hover { background: var(--surface-2); color: var(--text); }

/* =========================================================
   Login screen
   ========================================================= */

.login-bg {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: var(--bg);
}
.login-poster {
  background: var(--text);
  color: var(--surface);
  padding: 48px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
}
.login-poster::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(800px 600px at 80% 100%, color-mix(in srgb, var(--brand) 30%, transparent), transparent 60%);
}
.login-poster > * { position: relative; z-index: 1; }
.login-mark { display: flex; align-items: center; gap: 12px; }
.login-mark .sidebar-brand-mark { width: 38px; height: 38px; font-size: 20px; }
.login-mark .sidebar-brand-wm { font-size: 22px; }
.login-headline {
  font-size: 44px;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.05;
  margin: 0 0 16px;
}
.login-sub { font-size: 15px; color: rgba(255,255,255,0.7); max-width: 420px; line-height: 1.55; }
.login-meta {
  display: flex;
  gap: 24px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
}
.login-form-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px;
}
.login-form { width: 100%; max-width: 360px; }
.role-pick {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
  margin-top: 8px;
}
.role-tile {
  border: 1px solid var(--border);
  background: var(--surface);
  padding: 10px;
  border-radius: var(--r-md);
  cursor: pointer;
  text-align: left;
  transition: border-color 120ms, background 120ms;
}
.role-tile:hover { border-color: var(--brand); }
.role-tile.active { border-color: var(--brand); background: var(--brand-soft); }
.role-tile-name { font-weight: 700; font-size: 12.5px; }
.role-tile-mail { font-family: var(--mono); font-size: 10px; color: var(--text-faint); margin-top: 2px; }

/* =========================================================
   Helpers / utilities
   ========================================================= */

.row { display: flex; align-items: center; gap: 12px; }
.col { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.muted { color: var(--text-muted); }
.faint { color: var(--text-faint); }
.tiny { font-size: 11.5px; }
.small { font-size: 12.5px; }
.big { font-size: 16px; }
.bold { font-weight: 700; }
.semibold { font-weight: 600; }

.hr { height: 1px; background: var(--border); border: 0; margin: 16px 0; }

.empty {
  text-align: center;
  padding: 56px 16px;
  color: var(--text-faint);
}
.empty i { font-size: 36px; margin-bottom: 8px; display: block; }

/* segmented control */
.segmented {
  display: inline-flex;
  background: var(--surface-2);
  border-radius: var(--r-md);
  padding: 3px;
  border: 1px solid var(--border);
}
.segmented button {
  background: transparent;
  border: 0;
  padding: 6px 12px;
  font-size: 12.5px;
  font-weight: 600;
  border-radius: 7px;
  cursor: pointer;
  color: var(--text-muted);
  transition: background 120ms, color 120ms;
  font-family: inherit;
}
.segmented button.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}

.scrollbar-thin { scrollbar-width: thin; }
.scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
.scrollbar-thin::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; }

/* Photo dropzone */
.dropzone {
  border: 1.5px dashed var(--border-strong);
  border-radius: var(--r-lg);
  padding: 24px;
  text-align: center;
  background: var(--surface-2);
  cursor: pointer;
  transition: border-color 120ms, background 120ms;
}
.dropzone:hover { border-color: var(--brand); }
.dropzone i { font-size: 28px; color: var(--text-faint); display: block; margin-bottom: 8px; }
.photo-preview {
  border-radius: var(--r-lg);
  overflow: hidden;
  position: relative;
  border: 1px solid var(--border);
}
.photo-preview img { width: 100%; display: block; }
.photo-preview .remove {
  position: absolute;
  top: 8px; right: 8px;
  background: rgba(0,0,0,0.65);
  color: #fff;
  border: 0;
  width: 28px; height: 28px;
  border-radius: 99px;
  cursor: pointer;
}

/* Autocomplete list */
.autocomplete {
  position: absolute;
  top: calc(100% + 4px);
  left: 0; right: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-md);
  z-index: 20;
  max-height: 280px;
  overflow-y: auto;
}
.autocomplete-item {
  padding: 10px 12px;
  cursor: pointer;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.autocomplete-item:last-child { border: 0; }
.autocomplete-item:hover, .autocomplete-item.hl { background: var(--surface-2); }
.autocomplete-item .code { font-family: var(--mono); font-size: 11px; color: var(--text-faint); }

/* layout helpers for forms */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 14px; }
.grid-side { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; }

/* responsive nicety */
@media (max-width: 980px) {
  .app-root { grid-template-columns: 64px 1fr; }
  .sidebar { width: 64px; }
  .sidebar-brand-wm, .sidebar-brand-sub, .nav-item span:not(.nav-badge), .sidebar-section, .sidebar-user .user-text { display: none; }
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .grid-side { grid-template-columns: 1fr; }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
  .app-root { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .page { padding: 16px; padding-bottom: 80px; }
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .hide-mobile { display: none !important; }
  .modal { margin: 0; border-radius: 0; max-width: 100vw; width: 100vw; max-height: 100vh; }
  .modal-md, .modal-lg { max-width: 100vw; width: 100vw; }
  .mobile-nav { display: flex !important; }
}
.mobile-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 60px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  z-index: 200;
  align-items: stretch;
  box-shadow: 0 -2px 12px rgba(0,0,0,.08);
}
.mobile-nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border: none;
  background: none;
  cursor: pointer;
  color: var(--text-faint);
  font-size: 10px;
  font-family: inherit;
  padding: 0;
  position: relative;
  transition: color 0.15s;
}
.mobile-nav-item.active { color: var(--brand); }
.mobile-nav-item i { font-size: 18px; }
.mobile-nav-badge {
  position: absolute;
  top: 8px; right: calc(50% - 14px);
  background: var(--danger); color: #fff;
  border-radius: 999px;
  font-size: 9px; font-weight: 700;
  padding: 1px 5px;
  line-height: 1.4;
  min-width: 14px;
  text-align: center;
}

/* text truncation utility */
.truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* modal size variants */
.modal-md { max-width: 520px; }
.modal-lg { max-width: 900px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script type="text/babel" src="./tweaks-panel.js"></script>
<script>
// CSRF — armazena token do login e o injeta em todas as mutations à API
let _csrfToken = '';
(function () {
  const _orig = window.fetch.bind(window);
  window.fetch = function (url, opts) {
    opts = opts || {};
    const method = (opts.method || 'GET').toUpperCase();
    const isApi = typeof url === 'string' && (url.startsWith('/') || url.includes(window.__PLATE_PROXY_URL || ''));
    if (isApi && !['GET', 'HEAD', 'OPTIONS'].includes(method) && _csrfToken) {
      opts = { ...opts, headers: { 'X-CSRF-Token': _csrfToken, ...(opts.headers || {}) } };
    }
    return _orig(url, opts);
  };
})();
</script>
<script type="text/babel" src="./store.js"></script>
<script type="text/babel" src="./primitives.js"></script>
<script type="text/babel" src="./shell.js"></script>
<script type="text/babel" src="./login.js"></script>
<script type="text/babel" src="./quotations.js"></script>
<script type="text/babel" src="./screens.js"></script>
<script type="text/babel" src="./app.js"></script>
</body>
