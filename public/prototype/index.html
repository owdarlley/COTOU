<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COTOU — ERP Autopeças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
:root {
  /* Brand */
  --brand:       #2563eb;
  --brand-hover: #1d4ed8;
  --brand-soft:  #eff6ff;
  --brand-text:  #ffffff;

  /* Content area */
  --bg:           #f1f5f9;
  --surface:      #ffffff;
  --surface-2:    #f8fafc;
  --surface-3:    #f1f5f9;
  --border:       #e2e8f0;
  --border-strong:#cbd5e1;
  --text:         #0f172a;
  --text-muted:   #475569;
  --text-faint:   #94a3b8;
  --shadow-sm: 0 1px 2px rgba(15,23,42,.06);
  --shadow-md: 0 1px 3px rgba(15,23,42,.08), 0 4px 12px rgba(15,23,42,.04);
  --shadow-lg: 0 8px 32px rgba(15,23,42,.12);

  /* Status */
  --st-pendente:    #92400e; --st-pendente-bg:    #fef3c7;
  --st-em-cotacao:  #1e40af; --st-em-cotacao-bg:  #dbeafe;
  --st-cotado:      #065f46; --st-cotado-bg:      #d1fae5;
  --st-peca:        #5b21b6; --st-peca-bg:        #ede9fe;
  --st-cancelado:   #334155; --st-cancelado-bg:   #e2e8f0;

  /* Utility */
  --error:    #dc2626;
  --success:  #16a34a;
  --warning:  #d97706;
  --whatsapp: #25d366;
  --wa-bubble:#dcf8c6;
  --wa-bg:    #e5ddd5;

  /* Typography */
  --sans: 'Inter', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;

  /* Radii */
  --r-sm: 5px; --r-md: 8px; --r-lg: 10px; --r-xl: 16px;
}

[data-theme="dark"] {
  --bg:           #0d1117;
  --surface:      #161b22;
  --surface-2:    #1c2128;
  --surface-3:    #21262d;
  --border:       #30363d;
  --border-strong:#3d444d;
  --text:         #e6edf3;
  --text-muted:   #8d96a0;
  --text-faint:   #545d68;
  --brand-soft:   #0d2149;
  --shadow-sm: 0 1px 0 rgba(0,0,0,.4);
  --shadow-md: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  --shadow-lg: 0 16px 48px rgba(0,0,0,.5);
  --st-pendente:   #fbbf24; --st-pendente-bg:   #2d1f00;
  --st-em-cotacao: #60a5fa; --st-em-cotacao-bg: #0d1e3a;
  --st-cotado:     #34d399; --st-cotado-bg:     #002820;
  --st-peca:       #a78bfa; --st-peca-bg:       #1e1039;
  --st-cancelado:  #8d96a0; --st-cancelado-bg:  #1c2128;
  --wa-bubble: #005c4b; --wa-bg: #0b141a;
}

/* ── Base ──────────────────────────────────────────── */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  line-height: 1.5;
}
button { font-family: inherit; }
input, textarea, select { font-family: inherit; color: inherit; }
a { color: inherit; }
.mono { font-family: var(--mono); }

/* ── Layout ────────────────────────────────────────── */
.app-root {
  display: grid;
  grid-template-columns: 220px 1fr;
  min-height: 100vh;
  overflow-x: clip;
}

/* ── Sidebar (always dark) ─────────────────────────── */
.sidebar {
  /* Scope dark vars so all var(--*) inside pick up dark values */
  --surface:       rgba(255,255,255,.06);
  --surface-2:     rgba(255,255,255,.04);
  --surface-3:     rgba(255,255,255,.09);
  --border:        rgba(148,163,184,.12);
  --border-strong: rgba(148,163,184,.22);
  --text:          #f1f5f9;
  --text-muted:    #94a3b8;
  --text-faint:    #4b5a6e;
  --brand-soft:    rgba(37,99,235,.22);
  /* Lighter status for dark bg */
  --st-pendente:   #fbbf24;
  --st-em-cotacao: #60a5fa;
  --st-cotado:     #34d399;

  background: #0f172a;
  border-right: 1px solid rgba(148,163,184,.1);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: hidden;
}

.sidebar-brand {
  height: 56px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid rgba(148,163,184,.1);
  flex-shrink: 0;
}
.sidebar-brand-mark {
  width: 30px; height: 30px;
  background: var(--brand);
  color: #fff;
  border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.sidebar-brand-wm {
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.02em;
  color: #f1f5f9;
  line-height: 1;
}
.sidebar-brand-sub {
  font-size: 9px;
  letter-spacing: 0.1em;
  color: #334155;
  text-transform: uppercase;
  margin-top: 2px;
  font-family: var(--mono);
}

.sidebar-nav { padding: 8px; flex: 1; overflow-y: auto; min-height: 0; }
.sidebar-section {
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #2d3d52;
  padding: 8px 8px 4px;
  font-weight: 600;
}

.nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 8px;
  border-radius: var(--r-md);
  background: none;
  border: 0;
  cursor: pointer;
  text-align: left;
  color: #64748b;
  font-size: 13px;
  font-weight: 500;
  transition: background 120ms, color 120ms;
  position: relative;
}
.nav-item:hover { background: rgba(255,255,255,.05); color: #cbd5e1; }
.nav-item.active { background: rgba(255,255,255,.08); color: #f1f5f9; }
.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 5px; bottom: 5px;
  width: 2px;
  background: var(--brand);
  border-radius: 0 2px 2px 0;
}
.nav-item.active .nav-icon { color: var(--brand) !important; }
.nav-icon { font-size: 15px; width: 18px; text-align: center; color: #374151; transition: color 120ms; }
.nav-item:hover .nav-icon { color: #94a3b8; }
.nav-badge {
  margin-left: auto;
  background: var(--brand);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 99px;
  min-width: 18px;
  text-align: center;
}

.sidebar-user {
  padding: 10px 12px;
  border-top: 1px solid rgba(148,163,184,.1);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.avatar {
  width: 28px; height: 28px;
  background: var(--surface-3);
  color: var(--text);
  border-radius: 99px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
  font-size: 11px;
  flex-shrink: 0;
}
.avatar.brand { background: var(--brand); color: #fff; }

.sidebar .icon-btn { color: #374151; }
.sidebar .icon-btn:hover { background: rgba(255,255,255,.06); color: #94a3b8; }

/* ── Topbar ────────────────────────────────────────── */
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 56px;
  padding: 0 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 30;
}
.topbar h1 {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0;
}
.topbar-search {
  position: relative;
  margin-left: 12px;
  flex: 1;
  max-width: 380px;
}
.topbar-search input {
  width: 100%;
  padding: 7px 12px 7px 32px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: var(--r-md);
  font-size: 13px;
  color: var(--text);
  outline: none;
  transition: border-color 120ms, box-shadow 120ms;
}
.topbar-search input:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-soft);
  background: var(--surface);
}
.topbar-search .bi-search {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-faint);
  font-size: 13px;
}
.topbar-actions { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.icon-btn {
  width: 34px; height: 34px;
  border-radius: var(--r-md);
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  position: relative;
  transition: background 120ms, color 120ms;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn .dot {
  position: absolute;
  top: 7px; right: 8px;
  width: 7px; height: 7px;
  border-radius: 99px;
  background: var(--brand);
  border: 2px solid var(--surface);
}
.icon-btn .dot::after {
  content: '';
  position: absolute; inset: -4px;
  border-radius: 99px;
  background: var(--brand);
  opacity: 0.28;
  animation: pulse 1.6s ease-out infinite;
}
@keyframes pulse {
  0%   { transform: scale(0.6); opacity: 0.5; }
  100% { transform: scale(1.8); opacity: 0; }
}
@keyframes bellRing {
  0%,100% { transform: rotate(0deg); }
  15%     { transform: rotate(18deg); }
  35%     { transform: rotate(-16deg); }
  55%     { transform: rotate(12deg); }
  75%     { transform: rotate(-8deg); }
  90%     { transform: rotate(4deg); }
}
.bell-ring { animation: bellRing 0.7s ease-in-out; color: var(--brand) !important; }
.notif-count-badge {
  position: absolute;
  top: 3px; right: 3px;
  min-width: 16px; height: 16px;
  padding: 0 3px;
  border-radius: 99px;
  background: #dc2626;
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--surface);
  line-height: 1;
  pointer-events: none;
}

/* ── Page ──────────────────────────────────────────── */
.page {
  padding: 24px 28px 80px;
  max-width: 1400px;
  margin: 0 auto;
}
.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 24px;
}
.page-title {
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -0.025em;
  margin: 0 0 3px;
  line-height: 1.15;
}
.page-sub { color: var(--text-muted); font-size: 13px; margin: 0; }

/* ── Card ──────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
}
.card-pad { padding: 20px; }
.card-head {
  padding: 13px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
.card-head h3 { margin: 0; font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em; }

/* ── Buttons ───────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 13px;
  border-radius: var(--r-md);
  font-weight: 500;
  font-size: 13px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: background 120ms, border-color 120ms, color 120ms;
  text-decoration: none;
  white-space: nowrap;
  line-height: 1.3;
  letter-spacing: -0.005em;
}
.btn:active { opacity: .88; transform: translateY(0.5px); }
.btn-primary { background: var(--brand); color: #fff; box-shadow: 0 1px 2px rgba(37,99,235,.2); }
.btn-primary:hover { background: var(--brand-hover); }
.btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn-secondary:hover { background: var(--surface-2); }
.btn-ghost { background: transparent; color: var(--text-muted); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-danger { background: var(--surface); color: #b91c1c; border-color: var(--border-strong); }
.btn-danger:hover { background: #fef2f2; border-color: #fecaca; }
[data-theme="dark"] .btn-danger { color: #fca5a5; }
[data-theme="dark"] .btn-danger:hover { background: #2a1414; border-color: #4a1717; }
.btn-whatsapp { background: #16a34a; color: #fff; }
.btn-whatsapp:hover { background: #15803d; }
.btn-lg { padding: 9px 18px; font-size: 14px; }
.btn-sm { padding: 4px 9px; font-size: 12px; gap: 4px; }
.btn-icon { padding: 7px; width: 32px; height: 32px; }

/* ── Inputs ────────────────────────────────────────── */
.field { display: flex; flex-direction: column; gap: 5px; }
.field-label { font-size: 12px; font-weight: 500; color: var(--text-muted); }
.field-hint { font-size: 12px; color: var(--text-faint); }
.input, .textarea, .select {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  padding: 8px 11px;
  border-radius: var(--r-md);
  font-size: 13.5px;
  color: var(--text);
  outline: none;
  transition: border-color 120ms, box-shadow 120ms;
  width: 100%;
}
.input:focus, .textarea:focus, .select:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-soft);
}
.input.mono { font-family: var(--mono); letter-spacing: 0.04em; }
.textarea { resize: vertical; min-height: 80px; }
.select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-faint) 50%), linear-gradient(135deg, var(--text-faint) 50%, transparent 50%); background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
.input-group { position: relative; }
.input-group .input { padding-left: 34px; }
.input-group .input-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-faint); font-size: 13px; pointer-events: none; }

/* ── Badges ────────────────────────────────────────── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 500;
  background: var(--surface-3);
  color: var(--text-muted);
  white-space: nowrap;
  line-height: 1.5;
}
.badge .dot-sm { width: 5px; height: 5px; border-radius: 99px; background: currentColor; }
.badge-pendente    { background: var(--st-pendente-bg);   color: var(--st-pendente);   }
.badge-em_cotacao  { background: var(--st-em-cotacao-bg); color: var(--st-em-cotacao); }
.badge-cotado      { background: var(--st-cotado-bg);     color: var(--st-cotado);     }
.badge-peca_chegou { background: var(--st-peca-bg);       color: var(--st-peca);       }
.badge-cancelado   { background: var(--st-cancelado-bg);  color: var(--st-cancelado);  }
.badge-role-vendas  { background: #dbeafe; color: #1e40af; }
.badge-role-compras { background: #d1fae5; color: #065f46; }
.badge-role-admin   { background: #ede9fe; color: #5b21b6; }
[data-theme="dark"] .badge-role-vendas  { background: #0d1e3a; color: #93c5fd; }
[data-theme="dark"] .badge-role-compras { background: #002820; color: #6ee7b7; }
[data-theme="dark"] .badge-role-admin   { background: #1e1039; color: #c4b5fd; }

/* ── Tables ────────────────────────────────────────── */
.tbl { width: 100%; border-collapse: collapse; }
.tbl thead th {
  text-align: left;
  padding: 10px 16px;
  font-size: 11px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-faint);
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  background: var(--surface-2);
}
.tbl tbody td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 13.5px;
  vertical-align: middle;
}
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr.clickable { cursor: pointer; transition: background 100ms; }
.tbl tbody tr.clickable:hover { background: var(--surface-2); }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

.plate {
  display: inline-flex;
  align-items: center;
  font-family: var(--mono);
  font-weight: 600;
  letter-spacing: 0.08em;
  font-size: 11.5px;
  padding: 2px 7px;
  border: 1.5px solid var(--border-strong);
  border-radius: 4px;
  background: var(--surface-2);
  white-space: nowrap;
}

/* ── KPI cards ─────────────────────────────────────── */
.stat-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; }
.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 18px 20px;
  position: relative;
  overflow: hidden;
}
.stat-label { font-size: 11.5px; font-weight: 500; color: var(--text-faint); }
.stat-value { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; margin-top: 4px; line-height: 1.1; }
.stat-delta { font-size: 12px; color: var(--text-muted); margin-top: 4px; display: flex; align-items: center; gap: 4px; }
.stat-delta.up { color: #16a34a; }
.stat-delta.down { color: #dc2626; }
[data-theme="dark"] .stat-delta.up { color: #34d399; }
[data-theme="dark"] .stat-delta.down { color: #fca5a5; }
.stat-icon {
  position: absolute;
  right: 16px; top: 16px;
  width: 32px; height: 32px;
  border-radius: var(--r-md);
  background: var(--brand-soft);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  color: var(--brand);
}

/* ── Timeline ──────────────────────────────────────── */
.timeline { display: flex; align-items: flex-start; position: relative; padding: 8px 0; }
.timeline-step { flex: 1; text-align: center; position: relative; }
.timeline-step::before {
  content: '';
  position: absolute;
  top: 12px; left: 50%;
  width: 100%; height: 2px;
  background: var(--border); z-index: 0;
}
.timeline-step:last-child::before { display: none; }
.timeline-step.done::before { background: var(--brand); }
.timeline-dot {
  width: 25px; height: 25px;
  border-radius: 99px;
  background: var(--surface);
  border: 2px solid var(--border);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; color: var(--text-faint);
  position: relative; z-index: 1;
}
.timeline-step.done .timeline-dot    { background: var(--brand); border-color: var(--brand); color: #fff; }
.timeline-step.current .timeline-dot { border-color: var(--brand); color: var(--brand); background: var(--surface); box-shadow: 0 0 0 4px var(--brand-soft); }
.timeline-label {
  margin-top: 7px; font-size: 10.5px; font-weight: 600;
  color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em;
}
.timeline-step.done .timeline-label,
.timeline-step.current .timeline-label { color: var(--text); }
.timeline-sub { font-size: 10px; color: var(--text-faint); margin-top: 2px; font-family: var(--mono); }

/* ── Modal ─────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(15,23,42,.52);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  animation: fadeIn 140ms ease-out;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  max-width: 720px; width: 100%;
  max-height: 90vh;
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg);
  animation: slideUp 200ms cubic-bezier(.2,.8,.2,1);
}
.modal-head { padding: 16px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
.modal-head h3 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.modal-body { padding: 22px; overflow-y: auto; flex: 1; }
.modal-foot {
  padding: 12px 22px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px;
  background: var(--surface-2);
}
@keyframes fadeIn  { from { opacity: 0 } to { opacity: 1 } }
@keyframes slideUp { from { transform: translateY(16px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }

/* ── Dropdown / notifications ──────────────────────── */
.dropdown {
  position: absolute;
  top: calc(100% + 6px); right: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-md);
  width: 380px;
  max-width: calc(100vw - 24px);
  max-height: 480px;
  display: flex; flex-direction: column;
  z-index: 50;
  animation: slideUp 160ms cubic-bezier(.2,.8,.2,1);
}
.dropdown-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.dropdown-head strong { font-weight: 600; font-size: 13px; }
.dropdown-list { overflow-y: auto; flex: 1; }
.notif-item { padding: 11px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 11px; cursor: pointer; transition: background 100ms; }
.notif-item:hover { background: var(--surface-2); }
.notif-item:last-child { border-bottom: 0; }
.notif-icon { width: 30px; height: 30px; border-radius: var(--r-md); background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
.notif-icon.unread { background: var(--brand-soft); color: var(--brand); }
.notif-title { font-size: 13px; font-weight: 600; }
.notif-msg { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
.notif-time { font-size: 11px; color: var(--text-faint); margin-top: 3px; font-family: var(--mono); }
.notif-unread-dot { width: 6px; height: 6px; border-radius: 99px; background: var(--brand); margin-top: 6px; flex-shrink: 0; }

/* ── Chart ─────────────────────────────────────────── */
.chart-bar-grid { display: grid; grid-template-columns: repeat(14,1fr); gap: 6px; align-items: end; height: 160px; }
.chart-bar { background: var(--surface-3); border-radius: 3px 3px 0 0; position: relative; transition: background 200ms; }
.chart-bar:hover { background: var(--brand); }
.chart-bar.alt { background: var(--brand); opacity: 0.8; }
.chart-bar-label { text-align: center; font-size: 9.5px; color: var(--text-faint); margin-top: 5px; font-family: var(--mono); }
.chart-xrow { display: grid; grid-template-columns: repeat(14,1fr); gap: 6px; }
.ring { transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--surface-3); }
.ring-fg { fill: none; stroke: var(--brand); transition: stroke-dasharray 320ms; stroke-linecap: round; }

/* ── Toast ─────────────────────────────────────────── */
.toast-host { position: fixed; bottom: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.toast {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--brand);
  padding: 11px 14px;
  border-radius: var(--r-md);
  box-shadow: var(--shadow-md);
  min-width: 280px; max-width: 360px;
  display: flex; align-items: flex-start; gap: 10px;
  animation: slideInRight 220ms cubic-bezier(.2,.8,.2,1);
  font-size: 13px;
  position: relative;
}
.toast.success { border-left-color: #16a34a; }
.toast.error   { border-left-color: #dc2626; }
.toast.info    { border-left-color: var(--brand); }
.toast-clickable { cursor: pointer; }
.toast-clickable:hover { background: var(--surface-2); }
.toast-body { flex: 1; min-width: 0; }
.toast-title { font-weight: 600; line-height: 1.3; }
.toast-detail { font-size: 12px; color: var(--text-muted); margin-top: 2px; line-height: 1.35; }
.toast-action { font-size: 11px; color: var(--brand); font-weight: 700; margin-top: 4px; display: inline-block; }
.toast-close { background: none; border: none; cursor: pointer; color: var(--text-faint); padding: 0; font-size: 14px; flex-shrink: 0; margin-top: 1px; }
.toast-close:hover { color: var(--text); }
.toast > i:first-child { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
@keyframes slideInRight { from { transform: translateX(16px); opacity: 0 } to { transform: translateX(0); opacity: 1 } }

/* ── Guided Tour ───────────────────────────────────── */
.tour-overlay { position: fixed; inset: 0; z-index: 9000; cursor: pointer; }
.tour-spotlight {
  position: fixed; z-index: 9001; pointer-events: none;
  border-radius: 10px;
  box-shadow: 0 0 0 3px var(--brand), 0 0 0 9999px rgba(15,23,42,.6);
  transition: top .28s cubic-bezier(.4,0,.2,1), left .28s cubic-bezier(.4,0,.2,1), width .28s cubic-bezier(.4,0,.2,1), height .28s cubic-bezier(.4,0,.2,1);
}
.tour-tooltip {
  position: fixed; z-index: 9002;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); box-shadow: var(--shadow-lg);
  width: 280px; padding: 18px 18px 14px;
  cursor: default;
  animation: tourIn .2s cubic-bezier(.4,0,.2,1);
}
@keyframes tourIn { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
.tour-arrow { position: absolute; width: 10px; height: 10px; background: var(--surface); border: 1px solid var(--border); transform: rotate(45deg); }
.tour-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--brand-soft); color: var(--brand); border-radius: 99px; padding: 2px 10px; font-size: 11px; font-weight: 700; margin-bottom: 8px; }
.tour-tooltip h3 { font-size: 14px; font-weight: 700; margin: 0 0 5px; line-height: 1.3; }
.tour-tooltip p { font-size: 12.5px; color: var(--text-muted); margin: 0 0 12px; line-height: 1.55; }
.tour-dots { display: flex; gap: 4px; align-items: center; }
.tour-dot { width: 5px; height: 5px; border-radius: 99px; background: var(--border-strong); transition: background .18s, width .18s; cursor: pointer; border: none; padding: 0; }
.tour-dot.on { background: var(--brand); width: 14px; }
.tour-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; }
.tour-close { position: absolute; top: 8px; right: 8px; background: none; border: none; cursor: pointer; color: var(--text-faint); font-size: 13px; padding: 3px 5px; border-radius: 5px; }
.tour-close:hover { background: var(--surface-2); color: var(--text); }

/* ── Login ─────────────────────────────────────────── */
.login-bg {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: var(--bg);
}
.login-poster {
  background: #0f172a;
  color: #f1f5f9;
  padding: 48px;
  display: flex; flex-direction: column; justify-content: space-between;
  position: relative; overflow: hidden;
}
.login-poster::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(700px 500px at 80% 110%, rgba(37,99,235,.38), transparent 60%);
}
.login-poster > * { position: relative; z-index: 1; }
.login-mark { display: flex; align-items: center; gap: 12px; }
.login-mark .sidebar-brand-mark { width: 36px; height: 36px; font-size: 18px; }
.login-mark .sidebar-brand-wm { font-size: 20px; color: #f1f5f9; }
.login-headline { font-size: 40px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.05; margin: 0 0 14px; }
.login-sub { font-size: 14px; color: rgba(255,255,255,.5); max-width: 380px; line-height: 1.65; }
.login-meta { display: flex; gap: 24px; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: rgba(255,255,255,.28); }
.login-form-wrap { display: flex; align-items: center; justify-content: center; padding: 48px; }
.login-form { width: 100%; max-width: 360px; }
.role-pick { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 8px; }
.role-tile { border: 1px solid var(--border); background: var(--surface); padding: 10px; border-radius: var(--r-md); cursor: pointer; text-align: left; transition: border-color 120ms, background 120ms; }
.role-tile:hover { border-color: var(--brand); }
.role-tile.active { border-color: var(--brand); background: var(--brand-soft); }
.role-tile-name { font-weight: 600; font-size: 12px; }
.role-tile-mail { font-family: var(--mono); font-size: 10px; color: var(--text-faint); margin-top: 2px; }

/* ── Utilities ─────────────────────────────────────── */
.row   { display: flex; align-items: center; gap: 12px; }
.col   { display: flex; flex-direction: column; gap: 12px; }
.grow  { flex: 1; }
.between { justify-content: space-between; }
.wrap  { flex-wrap: wrap; }
.muted { color: var(--text-muted); }
.faint { color: var(--text-faint); }
.tiny  { font-size: 11.5px; }
.small { font-size: 12.5px; }
.big   { font-size: 16px; }
.bold  { font-weight: 700; }
.semibold { font-weight: 600; }
.hr    { height: 1px; background: var(--border); border: 0; margin: 14px 0; }
.empty { text-align: center; padding: 52px 16px; color: var(--text-faint); }
.empty i { font-size: 32px; margin-bottom: 8px; display: block; }

/* Segmented control */
.segmented { display: inline-flex; background: var(--surface-2); border-radius: var(--r-md); padding: 2px; border: 1px solid var(--border); }
.segmented button { background: transparent; border: 0; padding: 5px 12px; font-size: 12.5px; font-weight: 500; border-radius: 6px; cursor: pointer; color: var(--text-muted); transition: background 120ms, color 120ms; font-family: inherit; }
.segmented button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

.scrollbar-thin { scrollbar-width: thin; }
.scrollbar-thin::-webkit-scrollbar { width: 5px; height: 5px; }
.scrollbar-thin::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; }

/* Dropzone */
.dropzone { border: 1.5px dashed var(--border-strong); border-radius: var(--r-lg); padding: 24px; text-align: center; background: var(--surface-2); cursor: pointer; transition: border-color 120ms; }
.dropzone:hover { border-color: var(--brand); }
.dropzone i { font-size: 26px; color: var(--text-faint); display: block; margin-bottom: 8px; }
.photo-preview { border-radius: var(--r-lg); overflow: hidden; position: relative; border: 1px solid var(--border); }
.photo-preview img { width: 100%; display: block; }
.photo-preview .remove { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.6); color: #fff; border: 0; width: 26px; height: 26px; border-radius: 99px; cursor: pointer; }

/* Autocomplete */
.autocomplete { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-md); z-index: 20; max-height: 260px; overflow-y: auto; }
.autocomplete-item { padding: 9px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 9px; }
.autocomplete-item:last-child { border: 0; }
.autocomplete-item:hover, .autocomplete-item.hl { background: var(--surface-2); }
.autocomplete-item .code { font-family: var(--mono); font-size: 11px; color: var(--text-faint); }

/* Layout grids */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 14px; }
.grid-side { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; }

/* Responsive */
@media (max-width: 980px) {
  .app-root { grid-template-columns: 52px 1fr; }
  .sidebar { width: 52px; }
  .sidebar-brand-wm, .sidebar-brand-sub, .nav-item span:not(.nav-badge), .sidebar-section, .sidebar-user .user-text { display: none; }
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .grid-side { grid-template-columns: 1fr; }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
  .app-root { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .page { padding: 16px; padding-bottom: 80px; }
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .hide-mobile { display: none !important; }
  .modal { margin: 0; border-radius: 0; max-width: 100vw; width: 100vw; max-height: 100vh; }
  .modal-md, .modal-lg { max-width: 100vw; width: 100vw; }
  .mobile-nav { display: flex !important; }
}

/* Mobile nav */
.mobile-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: var(--surface); border-top: 1px solid var(--border); z-index: 200; align-items: stretch; box-shadow: 0 -1px 0 var(--border); }
.mobile-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: none; background: none; cursor: pointer; color: var(--text-faint); font-size: 10px; font-family: inherit; padding: 0; position: relative; transition: color 0.15s; }
.mobile-nav-item.active { color: var(--brand); }
.mobile-nav-item i { font-size: 18px; }
.mobile-nav-badge { position: absolute; top: 8px; right: calc(50% - 14px); background: var(--error, #dc2626); color: #fff; border-radius: 999px; font-size: 9px; font-weight: 700; padding: 1px 5px; line-height: 1.4; min-width: 14px; text-align: center; }

.truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.modal-md { max-width: 520px; }
.modal-lg { max-width: 900px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script type="text/babel" src="./tweaks-panel.js"></script>
<script>
// CSRF — armazena token do login e o injeta em todas as mutations à API
let _csrfToken = '';
(function () {
  const _orig = window.fetch.bind(window);
  window.fetch = function (url, opts) {
    opts = opts || {};
    const method = (opts.method || 'GET').toUpperCase();
    const isApi = typeof url === 'string' && (url.startsWith('/') || url.includes(window.__PLATE_PROXY_URL || ''));
    if (isApi && !['GET', 'HEAD', 'OPTIONS'].includes(method) && _csrfToken) {
      opts = { ...opts, headers: { 'X-CSRF-Token': _csrfToken, ...(opts.headers || {}) } };
    }
    return _orig(url, opts);
  };
})();
</script>
<script type="text/babel" src="./store.js"></script>
<script type="text/babel" src="./primitives.js"></script>
<script type="text/babel" src="./shell.js"></script>
<script type="text/babel" src="./login.js"></script>
<script type="text/babel" src="./quotations.js"></script>
<script type="text/babel" src="./screens.js"></script>
<script type="text/babel" src="./app.js"></script>
</body>
