<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cotação — COTOU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background: #f1f5f9; color: #1e293b; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .page { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; }
    .header { text-align: center; padding: 28px 0 20px; }
    .logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; color: #2563eb; margin-bottom: 8px; }
    .logo i { font-size: 22px; }
    .subtitle { font-size: 13px; color: #64748b; }
    .card { background: #fff; border-radius: 14px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
    .card-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #94a3b8; margin-bottom: 12px; }
    .vehicle-row { display: flex; align-items: center; gap: 12px; }
    .vehicle-icon { width: 44px; height: 44px; border-radius: 10px; background: #eff6ff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .vehicle-icon i { font-size: 20px; color: #2563eb; }
    .vehicle-name { font-weight: 600; font-size: 15px; }
    .vehicle-plate { font-size: 12px; color: #64748b; font-family: monospace; margin-top: 2px; }
    .customer-name { font-size: 17px; font-weight: 600; }
    .quote-number { font-size: 12px; color: #64748b; margin-top: 2px; }
    table { width: 100%; border-collapse: collapse; }
    th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: #94a3b8; padding: 0 0 8px; text-align: left; }
    th:last-child, td:last-child { text-align: right; }
    td { padding: 10px 0; border-top: 1px solid #f1f5f9; font-size: 14px; }
    td:first-child { color: #374151; }
    .price { font-family: monospace; font-weight: 600; white-space: nowrap; }
    .delivery { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .total-row { border-top: 2px solid #e2e8f0; padding-top: 12px; margin-top: 4px; display: flex; justify-content: space-between; align-items: center; }
    .total-label { font-weight: 600; font-size: 14px; }
    .total-value { font-size: 22px; font-weight: 700; color: #2563eb; font-family: monospace; }
    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s, transform .1s; font-family: inherit; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn-confirm { background: #16a34a; color: #fff; box-shadow: 0 2px 8px rgba(22,163,74,.25); }
    .btn-confirm:hover:not(:disabled) { background: #15803d; }
    .btn-reject { background: #fff; color: #dc2626; border: 1.5px solid #fca5a5; }
    .btn-reject:hover:not(:disabled) { background: #fff1f1; }
    .decision-intro { font-size: 13.5px; color: #64748b; line-height: 1.55; padding: 12px 0 4px; border-top: 1px solid #f1f5f9; margin-top: 4px; }
    .result { text-align: center; padding: 32px 20px; }
    .result-icon { width: 72px; height: 72px; border-radius: 99px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
    .result-icon.approved { background: #dcfce7; }
    .result-icon.rejected { background: #fee2e2; }
    .result-icon.expired { background: #fef3c7; }
    .result-icon i { font-size: 36px; }
    .result-icon.approved i { color: #16a34a; }
    .result-icon.rejected i { color: #dc2626; }
    .result-icon.expired i { color: #d97706; }
    .result-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .result-desc { font-size: 14px; color: #64748b; line-height: 1.5; }
    .spin { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading { text-align: center; padding: 48px 16px; color: #64748b; }
    .labor-row { display: flex; justify-content: space-between; font-size: 13px; color: #64748b; padding: 6px 0; border-top: 1px solid #f1f5f9; }

    /* Skeleton loader */
    .sk-line { background: #e2e8f0; border-radius: 4px; animation: shimmer 1.4s ease-in-out infinite; }
    .sk-box  { background: #e2e8f0; border-radius: 10px; animation: shimmer 1.4s ease-in-out infinite; }
    @keyframes shimmer { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #f1f5f9; }
      .card { background: #1e293b; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
      .card-title { color: #475569; }
      .vehicle-icon { background: #1e3a5f; }
      .vehicle-plate, .quote-number, .subtitle, .delivery { color: #94a3b8; }
      table td:first-child { color: #cbd5e1; }
      th { color: #475569; }
      td { border-top-color: #334155; }
      .total-row { border-top-color: #334155; }
      .total-value { color: #60a5fa; }
      .btn-confirm { background: #16a34a; }
      .btn-reject { background: #1e293b; color: #f87171; border-color: #7f1d1d; }
      .btn-reject:hover:not(:disabled) { background: #2d1a1a; }
      .result-icon.approved { background: #042f1f; }
      .result-icon.rejected { background: #2d1a1a; }
      .result-icon.expired  { background: #3b2100; }
      .result-desc { color: #94a3b8; }
      .labor-row { color: #94a3b8; border-top-color: #334155; }
      .logo { color: #60a5fa; }
      .sk-line, .sk-box { background: #334155; }
      .decision-intro { color: #94a3b8; border-top-color: #334155; }
      .btn-reject { background: #1e293b; border-color: #7f1d1d; }
    }
  </style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="logo"><i class="bi bi-car-front-fill"></i> COTOU</div>
    <div class="subtitle">Sistema de cotação de peças automotivas</div>
  </div>

  <div id="app">
    <!-- Skeleton inicial -->
    <div class="card">
      <div class="sk-line" style="width:35%;height:10px;margin-bottom:14px"></div>
      <div class="sk-line" style="width:55%;height:18px;margin-bottom:6px"></div>
      <div class="sk-line" style="width:28%;height:12px"></div>
    </div>
    <div class="card">
      <div class="sk-line" style="width:30%;height:10px;margin-bottom:14px"></div>
      <div style="display:flex;gap:12px;align-items:center">
        <div class="sk-box" style="width:44px;height:44px;flex-shrink:0"></div>
        <div style="flex:1">
          <div class="sk-line" style="width:65%;height:16px;margin-bottom:6px"></div>
          <div class="sk-line" style="width:35%;height:12px"></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="sk-line" style="width:40%;height:10px;margin-bottom:14px"></div>
      <div class="sk-line" style="height:13px;margin-bottom:10px"></div>
      <div class="sk-line" style="height:13px;margin-bottom:10px"></div>
      <div class="sk-line" style="width:55%;height:13px;margin-bottom:18px"></div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="sk-line" style="width:25%;height:14px"></div>
        <div class="sk-line" style="width:28%;height:22px"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const token = location.pathname.split('/').pop();
  const API = '/api/aprovar/' + token;

  function brl(v) {
    if (v == null) return '—';
    return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  async function load() {
    try {
      const r = await fetch(API);
      const data = await r.json().catch(() => null);
      if (!data) { renderError('Resposta inesperada do servidor. Tente novamente.'); return; }

      if (!data.ok && data.expired) { renderExpired(); return; }
      if (!data.ok && data.used) { renderUsed(data.approved); return; }
      if (!data.ok) { renderError(data.message || data.error || 'Não foi possível carregar a cotação.'); return; }

      renderQuotation(data.quotation, data.items);
    } catch (err) {
      renderError('Não foi possível carregar a cotação. Verifique sua conexão e tente novamente.');
    }
  }

  function renderQuotation(q, items) {
    const partsTotal = items.reduce((s, i) => s + (i.total_price || 0), 0);
    const laborTotal = items.reduce((s, i) => s + (i.labor_cost_compras || i.labor_cost_vendas || 0), 0);
    const grandTotal = partsTotal + laborTotal;

    const rows = items.map(i => `
      <tr>
        <td>
          <div>${i.part_name}</div>
          ${i.delivery_days ? `<div class="delivery">Prazo: ${i.delivery_days} dia(s)</div>` : ''}
        </td>
        <td class="price">${brl(i.total_price)}</td>
      </tr>
    `).join('');

    const laborSection = laborTotal > 0 ? `
      <div class="labor-row">
        <span>Mão de obra</span>
        <span class="price">${brl(laborTotal)}</span>
      </div>
    ` : '';

    document.getElementById('app').innerHTML = `
      <div class="card">
        <div class="card-title">Cliente</div>
        <div class="customer-name">${q.customer_name}</div>
        <div class="quote-number">Cotação ${q.quote_number}</div>
      </div>

      <div class="card">
        <div class="card-title">Veículo</div>
        <div class="vehicle-row">
          <div class="vehicle-icon"><i class="bi bi-car-front"></i></div>
          <div>
            <div class="vehicle-name">${q.make || ''} ${q.model || ''} ${q.year_model || ''}</div>
            <div class="vehicle-plate">${q.license_plate || ''}</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Peças cotadas</div>
        <table>
          <thead><tr><th>Descrição</th><th>Valor</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        ${laborSection}
        <div class="total-row">
          <div class="total-label">Total estimado</div>
          <div class="total-value">${brl(grandTotal)}</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">O que você decide?</div>
        <p class="decision-intro">
          Confirme para autorizar a encomenda das peças acima. Ao recusar, nossa equipe entrará em contato para entender melhor o que você precisa.
        </p>
        <div class="actions">
          <button id="btn-confirm" class="btn btn-confirm">
            <i class="bi bi-check-lg"></i> Confirmar encomenda
          </button>
          <button id="btn-reject" class="btn btn-reject">
            <i class="bi bi-x-lg"></i> Recusar cotação
          </button>
        </div>
        ${q.approval_token_expires_at ? (() => {
          const exp = new Date(q.approval_token_expires_at.includes('T') ? q.approval_token_expires_at : q.approval_token_expires_at.replace(' ', 'T') + 'Z');
          const fmt = exp.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
          return `<p style="font-size:11px;color:#94a3b8;text-align:center;margin-top:12px;line-height:1.5">
            <i class="bi bi-clock" style="margin-right:4px"></i>Este link expira em <strong>${fmt}</strong>.
          </p>`;
        })() : ''}
      </div>
    `;

    document.getElementById('btn-confirm').addEventListener('click', () => decide('approve'));
    document.getElementById('btn-reject').addEventListener('click', () => decide('reject'));
  }

  async function decide(action) {
    const btns = document.querySelectorAll('.btn');
    btns.forEach(b => b.disabled = true);

    // Mostra spinner no botão clicado
    const clickedId = action === 'approve' ? 'btn-confirm' : 'btn-reject';
    const clickedBtn = document.getElementById(clickedId);
    const origLabel = clickedBtn ? clickedBtn.innerHTML : '';
    if (clickedBtn) clickedBtn.innerHTML = '<i class="bi bi-arrow-clockwise spin"></i> Aguarde…';

    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15000);
      const r = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action }),
        signal: controller.signal,
      });
      clearTimeout(timer);
      const data = await r.json().catch(() => ({}));
      if (!data.ok) {
        if (clickedBtn) clickedBtn.innerHTML = origLabel;
        btns.forEach(b => b.disabled = false);
        renderError(data.message || data.error || 'Não foi possível registrar sua resposta. Tente novamente.');
        return;
      }
      renderResult(action === 'approve');
    } catch (err) {
      if (clickedBtn) clickedBtn.innerHTML = origLabel;
      btns.forEach(b => b.disabled = false);
      const msg = err.name === 'AbortError'
        ? 'Tempo esgotado. Verifique sua conexão e tente novamente.'
        : 'Erro de conexão. Verifique sua internet e tente novamente.';
      renderError(msg);
    }
  }

  function renderResult(approved) {
    document.getElementById('app').innerHTML = `
      <div class="card result">
        <div class="result-icon ${approved ? 'approved' : 'rejected'}">
          <i class="bi ${approved ? 'bi-check-lg' : 'bi-x-lg'}"></i>
        </div>
        <div class="result-title">${approved ? 'Pedido confirmado!' : 'Cotação recusada'}</div>
        <div class="result-desc">${approved
          ? 'Ótimo! Estamos iniciando o processo de encomenda das peças. Em breve entraremos em contato.'
          : 'Entendido! Nossa equipe entrará em contato para entender melhor o que você precisa.'
        }</div>
      </div>
    `;
  }

  function renderExpired() {
    document.getElementById('app').innerHTML = `
      <div class="card result">
        <div class="result-icon expired"><i class="bi bi-clock"></i></div>
        <div class="result-title">Link expirado</div>
        <div class="result-desc">Este link de aprovação não está mais disponível. Entre em contato com a loja para gerar um novo.</div>
      </div>
    `;
  }

  function renderUsed(approved) {
    document.getElementById('app').innerHTML = `
      <div class="card result">
        <div class="result-icon ${approved ? 'approved' : 'rejected'}">
          <i class="bi ${approved ? 'bi-check-circle' : 'bi-x-circle'}"></i>
        </div>
        <div class="result-title">${approved ? 'Já confirmado' : 'Já recusado'}</div>
        <div class="result-desc">Você já respondeu a esta cotação. Nossa equipe já foi notificada.</div>
      </div>
    `;
  }

  function renderError(msg) {
    document.getElementById('app').innerHTML = `
      <div class="card result">
        <div class="result-icon expired"><i class="bi bi-exclamation-triangle"></i></div>
        <div class="result-title">Ops!</div>
        <div class="result-desc">${msg || 'Ocorreu um erro inesperado.'}</div>
      </div>
    `;
  }

  load();
</script>
</body>
</html>
