<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COTOU — Notificações</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'] } } } }</script>
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-56 bg-white border-r border-slate-200 flex flex-col h-screen sticky top-0 flex-shrink-0">
    <div class="px-4 py-5 border-b border-slate-200">
      <div class="text-xl font-black text-blue-600 tracking-tight">COTOU</div>
      <div class="text-xs text-slate-400 mt-0.5 uppercase tracking-widest">ERP Autopeças</div>
    </div>
    <nav class="flex-1 p-3 space-y-0.5 overflow-y-auto">
      <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-50 text-slate-600 text-sm font-medium transition-colors">
        <i class="bi bi-grid-1x2-fill text-base"></i> Dashboard
      </a>
      <a href="cotacoes.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-50 text-slate-600 text-sm font-medium transition-colors">
        <i class="bi bi-clipboard-data text-base"></i> Cotações
      </a>
      <a href="nova-cotacao.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-50 text-slate-600 text-sm font-medium transition-colors">
        <i class="bi bi-plus-circle text-base"></i> Nova Cotação
      </a>
      <a href="catalogo.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-50 text-slate-600 text-sm font-medium transition-colors">
        <i class="bi bi-box-seam text-base"></i> Catálogo de Peças
      </a>
      <a href="notificacoes.html" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-blue-600 text-white text-sm font-medium">
        <i class="bi bi-bell text-base"></i> Notificações
        <span class="ml-auto bg-white/20 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold" id="sidebar-badge">2</span>
      </a>
      <div class="pt-3 pb-1">
        <div class="text-xs text-slate-400 font-semibold uppercase tracking-widest px-3 mb-1">Administração</div>
      </div>
      <a href="admin-usuarios.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-50 text-slate-600 text-sm font-medium transition-colors">
        <i class="bi bi-people text-base"></i> Usuários
      </a>
    </nav>
    <div class="border-t border-slate-200 p-3">
      <div class="flex items-center gap-3 px-2 py-2">
        <div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-white text-xs font-bold flex-shrink-0">JV</div>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-semibold text-slate-800 truncate">João Vendas</div>
          <div class="text-xs text-slate-400 truncate">Vendas</div>
        </div>
        <a href="index.html" class="text-slate-400 hover:text-red-500 transition-colors" title="Sair">
          <i class="bi bi-box-arrow-right"></i>
        </a>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col min-w-0">
    <!-- Topbar -->
    <header class="h-14 bg-white border-b border-slate-200 flex items-center px-6 gap-4 sticky top-0 z-10">
      <div class="flex items-center gap-2 text-sm text-slate-500 flex-shrink-0">
        <span class="font-semibold text-slate-800">Notificações</span>
      </div>
      <div class="flex-1"></div>
      <div class="flex items-center gap-3 flex-shrink-0">
        <div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-white text-xs font-bold cursor-pointer">JV</div>
      </div>
    </header>

    <!-- Content -->
    <main class="flex-1 p-6 max-w-3xl">

      <!-- Header -->
      <div class="flex items-center justify-between mb-5">
        <div>
          <h1 class="text-2xl font-bold text-slate-900">Notificações</h1>
          <p class="text-sm text-slate-500 mt-0.5" id="notif-summary">2 não lidas · 5 no total</p>
        </div>
        <button onclick="markAllRead()" class="inline-flex items-center gap-2 text-sm font-semibold text-slate-600 hover:text-slate-800 border border-slate-200 hover:bg-slate-50 px-4 py-2 rounded-xl transition-colors" id="mark-all-btn">
          <i class="bi bi-check2-all"></i> Marcar todas lidas
        </button>
      </div>

      <!-- Filter Pills -->
      <div class="flex items-center gap-2 mb-6">
        <button onclick="setFilter('all', this)" class="notif-pill px-4 py-1.5 rounded-full text-sm font-medium border transition-colors bg-blue-600 text-white border-blue-600">
          Todas <span class="ml-1 bg-white/20 text-white text-xs px-1.5 py-0.5 rounded-full font-bold">5</span>
        </button>
        <button onclick="setFilter('unread', this)" class="notif-pill px-4 py-1.5 rounded-full text-sm font-medium border transition-colors bg-white text-slate-600 border-slate-200 hover:border-slate-300">
          Não lidas <span class="ml-1 bg-red-100 text-red-600 text-xs px-1.5 py-0.5 rounded-full font-bold" id="unread-badge">2</span>
        </button>
      </div>

      <!-- Notification Groups -->
      <div id="notif-container" class="space-y-6"></div>

      <!-- Empty state -->
      <div id="empty-state" class="hidden text-center py-16 bg-white rounded-xl border border-slate-200">
        <i class="bi bi-bell-slash text-4xl text-slate-300"></i>
        <p class="text-slate-500 font-medium mt-3">Nenhuma notificação não lida</p>
        <p class="text-slate-400 text-sm mt-1">Todas as notificações foram lidas</p>
      </div>

    </main>
  </div>

  <script src="shared/mock-data.js"></script>
  <script src="shared/ui.js"></script>
  <script>
    let activeFilter = 'all';
    let readState = {};

    // Initialize read state from mock
    MOCK.notifications.forEach(n => {
      readState[n.id] = !!n.read_at;
    });

    const typeColors = {
      cotacao_respondida: 'border-green-400',
      peca_chegou:        'border-violet-400',
      status_atualizado:  'border-blue-400',
      nova_cotacao:       'border-amber-400',
      cotacao_atualizada: 'border-green-400',
    };

    function render() {
      const filtered = MOCK.notifications.filter(n => {
        if (activeFilter === 'unread') return !readState[n.id];
        return true;
      });

      const container = document.getElementById('notif-container');
      const empty = document.getElementById('empty-state');

      if (filtered.length === 0) {
        container.innerHTML = '';
        empty.classList.remove('hidden');
        updateSummary();
        return;
      }
      empty.classList.add('hidden');

      // Group by time
      const today = filtered.filter(n => n.time_label === '2h atrás');
      const yesterday = filtered.filter(n => n.time_label === 'ontem');
      const week = filtered.filter(n => !['2h atrás','ontem'].includes(n.time_label));

      const groups = [
        { label: 'Hoje', items: today },
        { label: 'Ontem', items: yesterday },
        { label: 'Esta semana', items: week },
      ].filter(g => g.items.length > 0);

      container.innerHTML = groups.map(group => `
        <div>
          <div class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">${group.label}</div>
          <div class="space-y-2">
            ${group.items.map(n => {
              const isUnread = !readState[n.id];
              const ic = notifIcon(n.type);
              const borderColor = typeColors[n.type] || 'border-slate-300';
              return `
                <div class="bg-white rounded-xl border border-slate-200 border-l-4 ${isUnread ? borderColor : 'border-l-slate-200'} p-4 flex items-start gap-4 hover:shadow-sm transition-shadow cursor-pointer ${isUnread ? 'shadow-sm' : ''}" onclick="markRead(${n.id})" id="notif-${n.id}">
                  <div class="w-10 h-10 ${ic.cls} rounded-xl flex items-center justify-center flex-shrink-0">
                    <i class="bi ${ic.icon} text-base"></i>
                  </div>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-start justify-between gap-3">
                      <div class="font-semibold text-slate-800 text-sm leading-snug">${n.title}</div>
                      <div class="flex items-center gap-2 flex-shrink-0">
                        <span class="text-xs text-slate-400 whitespace-nowrap">${n.time_label}</span>
                        ${isUnread ? `<span class="w-2.5 h-2.5 rounded-full bg-blue-500 flex-shrink-0" id="dot-${n.id}"></span>` : `<span id="dot-${n.id}"></span>`}
                      </div>
                    </div>
                    <p class="text-sm text-slate-500 mt-1">${n.message}</p>
                    ${n.quotation_id ? `
                      <a href="cotacao-detalhe.html" onclick="event.stopPropagation()" class="inline-flex items-center gap-1 text-xs text-blue-600 font-medium mt-2 hover:underline">
                        <i class="bi bi-box-arrow-up-right"></i> Ver cotação
                      </a>` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `).join('');

      updateSummary();
    }

    function markRead(id) {
      readState[id] = true;
      const el = document.getElementById(`notif-${id}`);
      const dot = document.getElementById(`dot-${id}`);
      if (el) {
        el.classList.remove('shadow-sm');
        el.classList.add('opacity-80');
        const border = Object.values(typeColors).find(c => el.classList.contains(c));
        el.classList.replace(border || 'border-l-slate-200', 'border-l-slate-200');
      }
      if (dot) dot.className = '';
      updateSummary();
      if (activeFilter === 'unread') render();
    }

    function markAllRead() {
      MOCK.notifications.forEach(n => { readState[n.id] = true; });
      render();
      showToast('Todas as notificações marcadas como lidas');
      document.getElementById('sidebar-badge').textContent = '0';
      document.getElementById('mark-all-btn').disabled = true;
    }

    function updateSummary() {
      const unread = MOCK.notifications.filter(n => !readState[n.id]).length;
      const total = MOCK.notifications.length;
      document.getElementById('notif-summary').textContent = `${unread} não lid${unread === 1 ? 'a' : 'as'} · ${total} no total`;
      document.getElementById('unread-badge').textContent = unread;
      document.getElementById('sidebar-badge').textContent = unread;
    }

    function setFilter(filter, btn) {
      activeFilter = filter;
      document.querySelectorAll('.notif-pill').forEach(el => {
        el.classList.remove('bg-blue-600', 'text-white', 'border-blue-600');
        el.classList.add('bg-white', 'text-slate-600', 'border-slate-200');
      });
      btn.classList.add('bg-blue-600', 'text-white', 'border-blue-600');
      btn.classList.remove('bg-white', 'text-slate-600', 'border-slate-200');
      render();
    }

    render();
  </script>
</body>
</html>
